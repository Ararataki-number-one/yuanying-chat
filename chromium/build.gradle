plugins {
    id 'com.android.dynamic-feature'
    id 'com.cefrium'
}

String chromiumAbi = providers.gradleProperty('pocketChatChromiumAbi').orElse('arm64-v8a').get()
def otherAbis = ['arm64-v8a', 'armeabi-v7a', 'riscv64', 'x86', 'x86_64'] - chromiumAbi

android {
    namespace 'local.pocketchat.chromium'
    compileSdk { version = release(37) { minorApiLevel = 1 } }
    buildToolsVersion '37.0.0'

    defaultConfig { minSdk 26 }
    buildTypes { integration { initWith release } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
            // Cefrium checks the feature's native merge before the app ABI filter.
            excludes.addAll(otherAbis.collect { "**/${it}/**".toString() })
        }
    }
    sourceSets.main.assets.srcDir new File(gradle.ext.pocketChatCefriumRepository, 'notice')
}

dependencies {
    implementation project(':app')
    implementation 'com.cefrium:cefrium-sdk-core:0.21.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.10'
    runtimeOnly "com.cefrium:cefrium-native-libre-${chromiumAbi}:0.21.0"
}

apply from: rootProject.file('gradle/chromium-manifest.gradle')
apply from: rootProject.file('gradle/chromium-resources.gradle')
