<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>元婴期院士 · 会话 + 网络交互原型</title>
<style>
:root{
  --bg:#f4f7fb;
  --panel:#ffffff;
  --text:#172033;
  --muted:#7a8799;
  --line:#e0e7f0;
  --blue:#2468f2;
  --blue2:#4b7df6;
  --blue-soft:#edf4ff;
  --green:#16a36a;
  --green-soft:#eaf8f1;
  --orange:#e59316;
  --orange-soft:#fff5e6;
  --red:#df5555;
  --red-soft:#fff0f0;
  --shadow:0 8px 24px rgba(38,72,130,.07);
}
*{box-sizing:border-box}
html,body{
  margin:0;
  background:#eef2f8;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
button,input{font:inherit}
button{cursor:pointer}
.app{
  width:min(100%,460px);
  min-height:100vh;
  margin:0 auto;
  background:#f9fbfe;
  position:relative;
  overflow:hidden;
  box-shadow:0 0 0 1px #e4ebf4,0 20px 60px rgba(30,55,95,.08);
}
.status{
  height:34px;
  padding:10px 18px 0;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  font-size:12px;
  font-weight:750;
}
.page{
  display:none;
  min-height:calc(100vh - 34px);
  padding-bottom:72px;
}
.page.active{display:block}

/* ---------- 通用 ---------- */
.icon-btn{
  width:38px;height:38px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
  color:#46536a;
  display:grid;
  place-items:center;
}
.pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  border-radius:999px;
  padding:6px 10px;
  font-size:12px;
  font-weight:780;
}
.pill.ok{background:var(--green-soft);color:var(--green)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.muted{color:var(--muted)}
.blue{color:var(--blue)}

/* ---------- 会话 ---------- */
.chat-shell{
  height:calc(100vh - 34px - 72px);
  display:flex;
  flex-direction:column;
}
.chat-top{
  padding:7px 14px 8px;
  background:#f9fbfe;
}
.chat-row{
  display:flex;
  align-items:center;
  gap:7px;
}
.hamburger{
  width:38px;height:38px;border:0;background:transparent;
  font-size:24px;color:#28364b;padding:0;
}
.env-icon{
  width:38px;height:38px;border-radius:12px;
  display:grid;place-items:center;
  border:1px solid #ccd8e8;background:#fff;
  font-size:22px;
}
.env-title{
  font-size:17px;
  font-weight:850;
  white-space:nowrap;
}

.env-name-only{
  border:0;
  background:transparent;
  color:var(--text);
  padding:6px 4px;
  font-size:18px;
  font-weight:850;
  white-space:nowrap;
  max-width:150px;
  overflow:hidden;
  text-overflow:ellipsis;
  text-align:left;
}
.env-name-only:active{opacity:.72}
.env-badge{
  border:0;
  background:var(--blue-soft);
  color:var(--blue);
  border-radius:999px;
  padding:7px 10px;
  font-size:12px;
  font-weight:800;
}
.mode-switch{
  margin-left:auto;
  display:flex;
  border:1px solid #b9cef8;
  border-radius:12px;
  padding:2px;
  background:#f6f9ff;
  flex:none;
}
.mode-btn{
  border:0;background:transparent;color:#4d6384;
  border-radius:9px;padding:7px 10px;font-size:12px;
}
.mode-btn.active{
  background:var(--blue);color:#fff;
  box-shadow:0 5px 12px rgba(36,104,242,.18);
}
.more-btn{
  width:28px;height:36px;border:0;background:transparent;
  color:#5d6b81;font-size:22px;padding:0;
}
.net-strip{
  margin-top:6px;
  display:flex;
  align-items:center;
  gap:8px;
  min-height:32px;
  padding:0 2px;
  font-size:13px;
  color:#43516a;
}
.net-strip .status-word{color:var(--green);font-weight:800}
.net-strip .lat{color:var(--green);font-weight:800}
.net-strip .chev{margin-left:auto;color:#8793a5;font-size:20px}

.webview{
  flex:1;
  min-height:0;
  margin:0 0 0;
  background:#fff;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.web-head{
  height:60px;
  border-bottom:1px solid #edf1f6;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  background:#fff;
}
.web-head .left{
  position:absolute;left:16px;
  font-size:22px;color:#1e2938
}
.web-head .right{
  position:absolute;right:16px;
  width:34px;height:34px;border-radius:50%;
  background:#eff4ff;color:var(--blue);
  display:grid;place-items:center;font-weight:800
}
.web-title{font-weight:750;font-size:17px}
.web-content{
  flex:1;
  position:relative;
  display:flex;
  flex-direction:column;
  background:#fff;
}
.web-center{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px 18px 122px;
}
.gpt-mark{
  width:64px;height:64px;
  display:grid;place-items:center;
  font-size:46px;font-weight:900;
  color:#0e1726;
}
.greeting{
  font-size:23px;font-weight:850;margin-top:12px;text-align:center;
}
.suggestion-row{
  display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:24px;
}
.suggestion{
  border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:9px 12px;font-size:12px;color:#4d5a70;
}
.composer-wrap{
  position:absolute;
  left:14px;right:14px;bottom:14px;
}
.composer{
  border:1px solid #dce4ef;
  border-radius:20px;
  background:#fff;
  box-shadow:0 8px 26px rgba(40,60,90,.08);
  padding:12px 12px 10px;
}
.placeholder{
  color:#9aa4b5;
  font-size:15px;
  min-height:40px;
}
.compose-actions{
  display:flex;
  align-items:center;
  gap:9px;
}
.circle-btn{
  width:38px;height:38px;border-radius:50%;
  border:0;background:#f2f5f9;
  display:grid;place-items:center;
  font-size:19px;
}
.send-btn{
  margin-left:auto;
  width:42px;height:42px;border-radius:50%;
  border:0;background:#111;color:#fff;
  font-size:20px;
}
.disclaimer{
  text-align:center;
  color:#7c8798;
  font-size:10px;
  padding-top:8px;
}

/* ---------- 网络 ---------- */
.network-topbar{
  height:58px;padding:8px 16px;
  display:flex;align-items:center;justify-content:space-between;
}
.network-title{font-size:24px;font-weight:850}
.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  padding:2px 16px 10px;
}
.tab{
  height:40px;border:1px solid var(--line);
  background:#fff;color:#56647b;
  border-radius:12px;font-weight:750;
}
.tab.active{background:var(--blue);border-color:var(--blue);color:#fff}
.net-content{padding:0 16px 18px}
.panel{display:none}.panel.active{display:block}
.summary-strip{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;margin:0 0 10px;padding:0 2px;
}
.summary-strip .left{font-size:13px;color:var(--muted)}
.summary-strip b{color:var(--text)}
.filter-btn{
  border:0;background:transparent;color:var(--blue);
  font-weight:750;font-size:13px;
}
.window-card{
  background:#fff;border:1px solid var(--line);
  border-radius:16px;padding:13px 14px;
  margin-bottom:10px;box-shadow:var(--shadow);
}
.window-top{
  display:flex;align-items:flex-start;justify-content:space-between;gap:10px
}
.window-name{font-size:17px;font-weight:850}
.window-site{font-size:11px;color:var(--muted);margin-top:2px}
.state{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800
}
.state i{width:7px;height:7px;border-radius:50%;background:currentColor}
.state.ok{color:var(--green)}
.state.warn{color:#a96c0a}
.state.bad{color:var(--red)}
.state.off{color:#8e99a8}
.window-mainline{margin-top:10px;font-size:15px;font-weight:780}
.window-mainline .ip{color:#46546a}
.window-subline{
  margin-top:5px;font-size:12px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.window-actions{display:flex;align-items:center;gap:8px;margin-top:11px}
.small-action{
  height:36px;border-radius:10px;border:1px solid var(--line);
  background:#fff;color:#3f4d63;font-weight:750;padding:0 13px;
}
.small-action.primary{
  background:var(--blue-soft);
  border-color:#cfe0ff;color:var(--blue)
}
.card-more{
  margin-left:auto;border:0;background:transparent;
  color:#7f8a9a;font-size:22px;padding:4px 2px;
}
.section-head{
  display:flex;align-items:center;justify-content:space-between;margin:2px 0 10px
}
.section-head h2{font-size:18px;margin:0}
.add-btn{
  border:0;background:var(--blue-soft);color:var(--blue);
  font-weight:800;border-radius:11px;padding:8px 11px
}
.list-item{
  background:#fff;border:1px solid var(--line);border-radius:15px;
  padding:13px 14px;margin-bottom:9px;
  display:flex;align-items:center;gap:11px
}
.list-icon{
  width:36px;height:36px;border-radius:11px;background:var(--blue-soft);
  display:grid;place-items:center;color:var(--blue);font-weight:850;flex:none
}
.list-main{flex:1;min-width:0}
.list-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.list-title{font-weight:820}
.list-sub{
  margin-top:4px;font-size:12px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}

/* ---------- 中间弹窗：所有弹层都居中 ---------- */
.overlay{
  position:fixed;inset:0;
  background:rgba(17,28,46,.38);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:50;
  padding:18px;
}
.overlay.show{display:flex}
.modal{
  width:min(420px,100%);
  max-height:82vh;
  overflow:auto;
  background:#fff;
  border-radius:22px;
  padding:18px;
  box-shadow:0 22px 70px rgba(18,35,60,.26);
}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;margin-bottom:10px;
}
.modal-title{font-size:20px;font-weight:850}
.close{
  width:36px;height:36px;border:0;border-radius:11px;
  background:#f1f4f8;font-size:18px
}
.route-row{
  min-height:58px;padding:9px 0;
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;border-bottom:1px solid #eef2f7
}
.route-row:last-child{border-bottom:0}
.route-key{font-size:13px;color:var(--muted)}
.route-value{font-size:15px;font-weight:780;margin-top:3px}
.route-note{font-size:11px;color:var(--muted);margin-top:3px}
.chev{color:#a0abba;font-size:20px}
.footer-actions{
  position:sticky;bottom:-18px;background:#fff;
  padding:14px 0 0;margin-top:12px;
  display:grid;grid-template-columns:1fr 1.5fr;gap:8px
}
.btn{
  height:46px;border-radius:13px;border:1px solid var(--line);
  background:#fff;color:#39475e;font-weight:800
}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.compact-choice{
  border:1px solid var(--line);border-radius:14px;
  padding:12px 13px;margin-bottom:8px;
  display:flex;align-items:center;gap:11px
}
.compact-choice.active{border-color:#94b8ff;background:#f7faff}
.radio{
  width:18px;height:18px;border:2px solid #b1bbca;
  border-radius:50%;position:relative;flex:none
}
.compact-choice.active .radio{border-color:var(--blue)}
.compact-choice.active .radio:after{
  content:"";position:absolute;inset:3px;background:var(--blue);border-radius:50%
}
.choice-main{flex:1;min-width:0}
.choice-title{font-weight:800}
.choice-sub{font-size:12px;color:var(--muted);margin-top:3px}
.lat{font-size:12px;font-weight:800;color:var(--green)}
.mode-select{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px
}
.mode-select button{
  height:42px;border:1px solid var(--line);border-radius:12px;
  background:#fff;color:#536077;font-weight:750
}
.mode-select button.active{
  background:var(--blue-soft);color:var(--blue);border-color:#9cbcff
}
.pool-title{font-size:13px;color:var(--muted);margin:12px 0 8px}
.node-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.node-card{
  border:1px solid var(--line);border-radius:12px;
  padding:11px;background:#fff;position:relative
}
.node-card.selected{border-color:#8fb4ff;background:#f7faff}
.node-card .name{font-weight:800;font-size:14px}
.node-card .ms{font-size:12px;color:var(--green);margin-top:3px}
.node-card .check{
  position:absolute;right:8px;top:8px;width:18px;height:18px;
  border-radius:50%;background:#e8edf5;color:#9aa5b5;
  display:grid;place-items:center;font-size:11px
}
.node-card.selected .check{background:var(--blue);color:#fff}
.random-box{
  margin-top:12px;background:#f5f9ff;
  border:1px solid #d4e3ff;border-radius:14px;padding:12px
}
.random-line{
  display:flex;justify-content:space-between;align-items:center;gap:12px
}
.random-result{font-size:16px;font-weight:850}
.link-btn{
  border:0;background:transparent;color:var(--blue);
  padding:4px;font-size:13px;font-weight:750
}
.details{
  display:grid;grid-template-columns:104px 1fr;
  gap:10px 12px;font-size:14px
}
.details .k{color:var(--muted)}
.details .v{font-weight:700}
.menu-item{
  min-height:48px;border-bottom:1px solid #eef2f6;
  display:flex;align-items:center;justify-content:space-between
}
.menu-item:last-child{border-bottom:0}

/* ---------- 底栏 ---------- */
.bottom{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:min(460px,100%);height:70px;
  background:rgba(255,255,255,.97);
  border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);
  z-index:20;backdrop-filter:blur(9px)
}
.nav{
  border:0;background:transparent;color:#7d8999;
  font-size:11px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px
}
.nav .ico{font-size:20px}
.nav.active{color:var(--blue);font-weight:800}
.toast{
  position:fixed;left:50%;bottom:84px;transform:translateX(-50%);
  background:#172033;color:#fff;padding:9px 13px;
  border-radius:11px;font-size:13px;z-index:99;
  opacity:0;pointer-events:none;transition:.2s;white-space:nowrap
}
@media(max-width:360px){
  .mode-btn{padding:7px 7px}
  .node-grid{grid-template-columns:1fr}
  .env-title{font-size:16px}
  .env-name-only{font-size:16px;max-width:118px}
}
</style>
</head>
<body>
<div class="app">
  <div class="status"><span>19:33</span><span>5G ▂▅▇　85%</span></div>

  <!-- 会话 -->
  <section class="page active" id="chatPage">
    <div class="chat-shell">
      <div class="chat-top">
        <div class="chat-row">
          <button class="hamburger">☰</button>
          <button class="env-name-only" id="chatEnvBtn">默认环境</button>

          <div class="mode-switch">
            <button class="mode-btn" data-chat-mode="simple">简洁</button>
            <button class="mode-btn active" data-chat-mode="web">原网页</button>
          </div>
          <button class="more-btn" id="chatMore">⋮</button>
        </div>

        <div class="net-strip" id="chatNetStrip">
          <span class="dot" style="color:var(--green)"></span>
          <span>日本</span><span>·</span>
          <span>203.0.113.25</span><span>·</span>
          <span class="lat">42 ms</span><span>·</span>
          <span class="status-word">已连接</span>
          <span class="chev">›</span>
        </div>
      </div>

      <div class="webview">
        <div class="web-head">
          <div class="left">☰</div>
          <div class="web-title">ChatGPT 4o⌄</div>
          <div class="right">◉</div>
        </div>

        <div class="web-content" id="webMode">
          <div class="web-center">
            <div class="gpt-mark">◎</div>
            <div class="greeting">你好！有什么可以帮助你的吗？</div>
            <div class="suggestion-row">
              <button class="suggestion">创建图像</button>
              <button class="suggestion">分析数据</button>
              <button class="suggestion">帮我写作</button>
              <button class="suggestion">更多</button>
            </div>
          </div>

          <div class="composer-wrap">
            <div class="composer">
              <div class="placeholder">发送消息给 ChatGPT</div>
              <div class="compose-actions">
                <button class="circle-btn">＋</button>
                <button class="circle-btn">◎</button>
                <button class="circle-btn">☷</button>
                <button class="circle-btn" style="margin-left:auto">🎙</button>
                <button class="send-btn">↑</button>
              </div>
            </div>
            <div class="disclaimer">ChatGPT 可能会出错。请核实重要信息。</div>
          </div>
        </div>

        <div class="web-content" id="simpleMode" style="display:none">
          <div class="web-center" style="justify-content:flex-start;align-items:stretch;padding-top:22px">
            <div style="font-size:13px;color:var(--muted);margin-bottom:8px">简洁模式</div>
            <div style="background:#f6f8fc;border:1px solid var(--line);border-radius:14px;padding:13px;font-size:14px;line-height:1.7">
              这里显示从官方网页整理出的聊天内容。复杂网页控件仍建议切回“原网页”模式查看。
            </div>
          </div>
          <div class="composer-wrap">
            <div class="composer">
              <div class="placeholder">继续追问</div>
              <div class="compose-actions">
                <button class="circle-btn">＋</button>
                <button class="circle-btn">🎙</button>
                <button class="send-btn">↑</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 网络 -->
  <section class="page" id="networkPage">
    <div class="network-topbar">
      <div class="network-title">网络</div>
      <button class="icon-btn" id="refreshBtn">↻</button>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="window">窗口网络</button>
      <button class="tab" data-tab="subs">订阅</button>
      <button class="tab" data-tab="exits">出口</button>
    </div>

    <div class="net-content">
      <section class="panel active" id="window">
        <div class="summary-strip">
          <div class="left"><b>4 个窗口</b> · 3 正常 · 1 未配置</div>
          <button class="filter-btn" id="filterBtn">筛选</button>
        </div>
        <div id="windowList"></div>
      </section>

      <section class="panel" id="subs">
        <div class="section-head"><h2>入口订阅</h2><button class="add-btn">＋ 添加</button></div>
        <div id="subList"></div>
      </section>

      <section class="panel" id="exits">
        <div class="section-head"><h2>固定出口</h2><button class="add-btn">＋ 添加</button></div>
        <div id="exitList"></div>
      </section>
    </div>
  </section>

  <nav class="bottom">
    <button class="nav active" data-page="chatPage"><span class="ico">💬</span>会话</button>
    <button class="nav" data-placeholder="环境"><span class="ico">◇</span>环境</button>
    <button class="nav" data-placeholder="下载"><span class="ico">⇩</span>下载</button>
    <button class="nav" data-page="networkPage"><span class="ico">◎</span>网络</button>
    <button class="nav" data-placeholder="设置"><span class="ico">⚙</span>设置</button>
  </nav>
</div>

<!-- 所有弹窗统一居中 -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">标题</div>
      <button class="close" id="closeModal">×</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const subs=[
  {id:"A",name:"订阅 A",updated:"今天 08:30",nodes:[
    {name:"大阪 03",lat:38},{name:"大阪 01",lat:52},{name:"东京 01",lat:60},{name:"首尔",lat:88},{name:"新加坡",lat:136},{name:"香港",lat:142}
  ]},
  {id:"B",name:"订阅 B",updated:"昨天 11:05",nodes:[
    {name:"东京 02",lat:54},{name:"大阪 05",lat:62},{name:"首尔 02",lat:91},{name:"新加坡 02",lat:129}
  ]},
  {id:"C",name:"机场订阅",updated:"9 月 26 日",nodes:[
    {name:"东京 Premium",lat:49},{name:"大阪 Premium",lat:57},{name:"首尔 Premium",lat:84},{name:"新加坡 Premium",lat:124}
  ]}
];
const exits=[
  {name:"日本东京",ip:"203.0.113.25",verified:true,used:2,flag:"🇯🇵"},
  {name:"美国洛杉矶",ip:"18.245.12.63",verified:true,used:1,flag:"🇺🇸"},
  {name:"新加坡",ip:"139.162.91.45",verified:false,used:0,flag:"🇸🇬"},
  {name:"英国伦敦",ip:"172.64.33.18",verified:true,used:0,flag:"🇬🇧"}
];
const windows=[
  {id:"default",name:"默认环境",site:"chatgpt.com",status:"ok",statusText:"正常",sub:"A",entryMode:"random",randomPool:["大阪 03","大阪 01","东京 01","首尔"],entry:"大阪 03",exit:"日本东京",latency:42},
  {id:"work",name:"工作环境",site:"chatgpt.com",status:"ok",statusText:"正常",sub:"B",entryMode:"random",randomPool:["东京 02","大阪 05","首尔 02"],entry:"东京 02",exit:"美国洛杉矶",latency:128},
  {id:"research",name:"研究环境",site:"chatgpt.com",status:"warn",statusText:"需检查",sub:"C",entryMode:"manual",randomPool:[],entry:"东京 Premium",exit:"新加坡",latency:95},
  {id:"backup",name:"备用环境",site:"chatgpt.com",status:"off",statusText:"未配置",sub:null,entryMode:null,randomPool:[],entry:null,exit:null,latency:null}
];
let editingId=null,draft=null;

const $=q=>document.querySelector(q);
const $$=q=>[...document.querySelectorAll(q)];
const subById=id=>subs.find(s=>s.id===id);
const exitByName=n=>exits.find(e=>e.name===n);

function openModal(title,html){
  $("#modalTitle").textContent=title;
  $("#modalBody").innerHTML=html;
  $("#overlay").classList.add("show");
}
function closeModal(){ $("#overlay").classList.remove("show"); }
$("#closeModal").onclick=closeModal;
$("#overlay").onclick=e=>{if(e.target===$("#overlay"))closeModal()};

function toast(msg){
  const t=$("#toast");
  t.textContent=msg;t.style.opacity=1;
  clearTimeout(window.__toast);
  window.__toast=setTimeout(()=>t.style.opacity=0,1400);
}

/* 底栏页面 */
$$(".nav").forEach(btn=>{
  btn.onclick=()=>{
    if(btn.dataset.page){
      $$(".nav").forEach(x=>x.classList.remove("active"));
      btn.classList.add("active");
      $$(".page").forEach(x=>x.classList.remove("active"));
      $("#"+btn.dataset.page).classList.add("active");
    }else if(btn.dataset.placeholder){
      openModal(btn.dataset.placeholder,`<div style="padding:12px 2px;color:var(--muted);line-height:1.7">此 HTML 目前重点展示“会话”和“网络”两个页面。这里保留底部导航位置，方便后续继续补完整模块。</div>`);
    }
  };
});

/* 会话模式 */
$$("[data-chat-mode]").forEach(btn=>{
  btn.onclick=()=>{
    $$("[data-chat-mode]").forEach(x=>x.classList.remove("active"));
    btn.classList.add("active");
    const web = btn.dataset.chatMode==="web";
    $("#webMode").style.display=web?"flex":"none";
    $("#simpleMode").style.display=web?"none":"flex";
  };
});
$("#chatEnvBtn").onclick=()=>{
  openModal("切换环境",windows.map((w,i)=>`
    <div class="compact-choice ${i===0?"active":""}">
      <div class="radio"></div>
      <div class="choice-main">
        <div class="choice-title">${w.name}</div>
        <div class="choice-sub">${w.status==="off"?"未配置网络":`${w.statusText} · ${w.exit}`}</div>
      </div>
    </div>`).join(""));
};
$("#chatMore").onclick=()=>{
  openModal("会话页面",`
    <div class="menu-item"><span>刷新网页</span><span class="chev">›</span></div>
    <div class="menu-item"><span>查看网页信息</span><span class="chev">›</span></div>
    <div class="menu-item"><span>在原网页打开</span><span class="chev">›</span></div>
  `);
};
$("#chatNetStrip").onclick=()=>{
  $$(".nav").forEach(x=>x.classList.remove("active"));
  $$(".nav[data-page='networkPage']").forEach(x=>x.classList.add("active"));
  $$(".page").forEach(x=>x.classList.remove("active"));
  $("#networkPage").classList.add("active");
};

/* 网络 Tabs */
$$(".tab").forEach(btn=>{
  btn.onclick=()=>{
    $$(".tab").forEach(x=>x.classList.remove("active"));
    btn.classList.add("active");
    $$(".panel").forEach(x=>x.classList.remove("active"));
    $("#"+btn.dataset.tab).classList.add("active");
  };
});

function renderWindows(){
  $("#windowList").innerHTML=windows.map(w=>{
    const e=w.exit?exitByName(w.exit):null;
    const s=w.sub?subById(w.sub):null;
    return `<div class="window-card">
      <div class="window-top">
        <div>
          <div class="window-name">${w.name}</div>
          <div class="window-site">${w.site}</div>
        </div>
        <span class="state ${w.status}"><i></i>${w.statusText}</span>
      </div>
      ${w.status!=="off" ? `
        <div class="window-mainline">${e.flag} ${e.name} · <span class="ip">${e.ip}</span> · ${w.latency} ms</div>
        <div class="window-subline">${s.name} · ${w.entryMode==="random"?"自动随机":"手动"} · ${w.entry}</div>
      ` : `
        <div class="window-mainline" style="color:#8792a2">尚未配置网络</div>
        <div class="window-subline">点击“配置网络”开始设置</div>
      `}
      <div class="window-actions">
        <button class="small-action primary" data-edit="${w.id}">${w.status==="off"?"配置网络":"编辑网络"}</button>
        ${w.status!=="off"?`<button class="small-action" data-test="${w.id}">测速</button>`:""}
        <button class="card-more" data-more="${w.id}">⋮</button>
      </div>
    </div>`;
  }).join("");

  $$("[data-edit]").forEach(b=>b.onclick=()=>openEdit(b.dataset.edit));
  $$("[data-test]").forEach(b=>b.onclick=()=>showSpeed(b.dataset.test));
  $$("[data-more]").forEach(b=>b.onclick=()=>showDetails(b.dataset.more));
}

function renderResources(){
  $("#subList").innerHTML=subs.map(s=>`
    <div class="list-item">
      <div class="list-icon">订</div>
      <div class="list-main">
        <div class="list-top"><div class="list-title">${s.name}</div><span class="state ok"><i></i>正常</span></div>
        <div class="list-sub">${s.nodes.length} 个入口 · 更新于 ${s.updated}</div>
      </div>
      <button class="card-more">⋮</button>
    </div>`).join("");

  $("#exitList").innerHTML=exits.map(e=>`
    <div class="list-item">
      <div class="list-icon" style="background:#f6f8fb;font-size:21px">${e.flag}</div>
      <div class="list-main">
        <div class="list-top"><div class="list-title">${e.name}</div><span class="state ${e.verified?"ok":"warn"}"><i></i>${e.verified?"已核验":"未核验"}</span></div>
        <div class="list-sub">${e.ip} · ${e.used?e.used+" 个窗口使用":"未被使用"}</div>
      </div>
      <button class="card-more">⋮</button>
    </div>`).join("");
}
renderWindows();
renderResources();

function openEdit(id){
  editingId=id;
  const w=windows.find(x=>x.id===id);
  draft=structuredClone(w);

  if(!draft.sub){
    draft.sub="A";
    draft.entryMode="random";
    draft.randomPool=subById("A").nodes.slice(0,4).map(n=>n.name);
    draft.entry=draft.randomPool[0];
    draft.exit="日本东京";
  }
  renderEdit();
}

function renderEdit(){
  const s=subById(draft.sub),e=exitByName(draft.exit);
  openModal("编辑 "+windows.find(x=>x.id===editingId).name+" 的网络",`
    <div class="route-row" id="pickSub">
      <div><div class="route-key">入口订阅</div><div class="route-value">${s.name}</div></div>
      <div class="chev">›</div>
    </div>
    <div class="route-row" id="pickEntry">
      <div>
        <div class="route-key">入口选择</div>
        <div class="route-value">${draft.entryMode==="random"?"自动随机 · ":"手动 · "}${draft.entry}</div>
        <div class="route-note">${draft.entryMode==="random"?"随机池 "+draft.randomPool.length+" 个节点":"固定入口"}</div>
      </div>
      <div class="chev">›</div>
    </div>
    <div class="route-row" id="pickExit">
      <div>
        <div class="route-key">固定出口</div>
        <div class="route-value">${e.flag} ${e.name}</div>
        <div class="route-note">${e.ip}</div>
      </div>
      <div class="chev">›</div>
    </div>
    <div class="footer-actions">
      <button class="btn" id="cancelEdit">取消</button>
      <button class="btn primary" id="saveEdit">保存并应用</button>
    </div>
  `);

  $("#cancelEdit").onclick=closeModal;
  $("#saveEdit").onclick=()=>{
    const idx=windows.findIndex(x=>x.id===editingId);
    windows[idx]={
      ...windows[idx],
      ...draft,
      status:"ok",
      statusText:"正常",
      latency:Math.max(32,Math.round(38+Math.random()*90))
    };
    renderWindows();
    closeModal();
    toast("网络配置已应用");
  };
  $("#pickSub").onclick=pickSub;
  $("#pickEntry").onclick=pickEntry;
  $("#pickExit").onclick=pickExit;
}

function pickSub(){
  openModal("选择入口订阅",subs.map(s=>`
    <div class="compact-choice ${draft.sub===s.id?"active":""}" data-subpick="${s.id}">
      <div class="radio"></div>
      <div class="choice-main">
        <div class="choice-title">${s.name}</div>
        <div class="choice-sub">${s.nodes.length} 个入口</div>
      </div>
    </div>`).join(""));
  $$("[data-subpick]").forEach(el=>el.onclick=()=>{
    draft.sub=el.dataset.subpick;
    const ns=subById(draft.sub).nodes;
    draft.randomPool=ns.slice(0,Math.min(4,ns.length)).map(n=>n.name);
    draft.entryMode="random";
    draft.entry=draft.randomPool[0];
    renderEdit();
  });
}

function pickEntry(){
  const s=subById(draft.sub);
  openModal("入口选择",`
    <div class="mode-select">
      <button class="${draft.entryMode==="random"?"active":""}" data-mode="random">自动随机</button>
      <button class="${draft.entryMode==="manual"?"active":""}" data-mode="manual">手动指定</button>
    </div>
    <div id="entryArea"></div>
  `);

  function draw(){
    const area=$("#entryArea");
    if(draft.entryMode==="random"){
      area.innerHTML=`
        <div class="pool-title">点选哪些节点参与随机</div>
        <div class="node-grid">
          ${s.nodes.map(n=>`
            <div class="node-card ${draft.randomPool.includes(n.name)?"selected":""}" data-pool="${n.name}">
              <div class="check">✓</div>
              <div class="name">${n.name}</div>
              <div class="ms">${n.lat} ms</div>
            </div>`).join("")}
        </div>
        <div class="random-box">
          <div class="random-line">
            <div>
              <div class="route-key">当前随机结果</div>
              <div class="random-result">${draft.entry}</div>
            </div>
            <button class="link-btn" id="reroll">重新随机</button>
          </div>
        </div>
        <div class="footer-actions">
          <button class="btn" id="backEdit">返回</button>
          <button class="btn primary" id="useEntry">使用此设置</button>
        </div>
      `;
      $$("[data-pool]").forEach(c=>c.onclick=()=>{
        const n=c.dataset.pool;
        if(draft.randomPool.includes(n)){
          if(draft.randomPool.length===1){toast("至少保留 1 个节点");return}
          draft.randomPool=draft.randomPool.filter(x=>x!==n);
        }else{
          draft.randomPool.push(n);
        }
        if(!draft.randomPool.includes(draft.entry)) draft.entry=draft.randomPool[0];
        draw();
      });
      $("#reroll").onclick=()=>{
        draft.entry=draft.randomPool[Math.floor(Math.random()*draft.randomPool.length)];
        draw();
      };
      $("#backEdit").onclick=renderEdit;
      $("#useEntry").onclick=renderEdit;
    }else{
      area.innerHTML=s.nodes.map(n=>`
        <div class="compact-choice ${draft.entry===n.name?"active":""}" data-manual="${n.name}">
          <div class="radio"></div>
          <div class="choice-main"><div class="choice-title">${n.name}</div></div>
          <div class="lat">${n.lat} ms</div>
        </div>`).join("");
      $$("[data-manual]").forEach(el=>el.onclick=()=>{
        draft.entry=el.dataset.manual;
        renderEdit();
      });
    }
  }

  $$("[data-mode]").forEach(b=>b.onclick=()=>{
    draft.entryMode=b.dataset.mode;
    if(draft.entryMode==="random"&&!draft.randomPool.length){
      draft.randomPool=s.nodes.map(n=>n.name);
    }
    if(draft.entryMode==="random") draft.entry=draft.randomPool[0];
    $$("[data-mode]").forEach(x=>x.classList.toggle("active",x.dataset.mode===draft.entryMode));
    draw();
  });
  draw();
}

function pickExit(){
  openModal("选择固定出口",exits.map(e=>`
    <div class="compact-choice ${draft.exit===e.name?"active":""}" data-exitpick="${e.name}">
      <div class="radio"></div>
      <div class="choice-main">
        <div class="choice-title">${e.flag} ${e.name}</div>
        <div class="choice-sub">${e.ip} · ${e.verified?"已核验":"未核验"}</div>
      </div>
    </div>`).join(""));
  $$("[data-exitpick]").forEach(el=>el.onclick=()=>{
    draft.exit=el.dataset.exitpick;
    renderEdit();
  });
}

function showSpeed(id){
  const w=windows.find(x=>x.id===id),s=subById(w.sub);
  openModal(w.name+" · 测速",`
    <div class="window-card" style="box-shadow:none">
      <div class="window-top">
        <div><div class="window-name">${w.latency} ms</div><div class="window-site">当前完整线路</div></div>
        <span class="state ok"><i></i>正常</span>
      </div>
    </div>
    ${s.nodes.map(n=>`
      <div class="list-item">
        <div class="list-main"><div class="list-title">${n.name}</div></div>
        <div class="lat">${n.lat} ms</div>
      </div>`).join("")}
  `);
}

function showDetails(id){
  const w=windows.find(x=>x.id===id),
        e=w.exit?exitByName(w.exit):null,
        s=w.sub?subById(w.sub):null;
  openModal(w.name+" · 详细信息",`
    <div class="details">
      <div class="k">网络状态</div><div class="v">${w.statusText}</div>
      <div class="k">入口订阅</div><div class="v">${s?s.name:"未配置"}</div>
      <div class="k">入口模式</div><div class="v">${w.entryMode==="random"?"自动随机":w.entryMode==="manual"?"手动指定":"未配置"}</div>
      <div class="k">当前入口</div><div class="v">${w.entry||"未配置"}</div>
      <div class="k">固定出口</div><div class="v">${e?e.name:"未配置"}</div>
      <div class="k">出口 IP</div><div class="v">${e?e.ip:"未核验"}</div>
      <div class="k">延迟</div><div class="v">${w.latency?w.latency+" ms":"未测试"}</div>
    </div>
  `);
}

$("#refreshBtn").onclick=()=>toast("所有窗口网络状态已刷新");
$("#filterBtn").onclick=()=>{
  openModal("筛选窗口",`
    <div class="compact-choice active"><div class="radio"></div><div class="choice-main"><div class="choice-title">全部窗口</div></div></div>
    <div class="compact-choice"><div class="radio"></div><div class="choice-main"><div class="choice-title">网络正常</div></div></div>
    <div class="compact-choice"><div class="radio"></div><div class="choice-main"><div class="choice-title">需要检查</div></div></div>
    <div class="compact-choice"><div class="radio"></div><div class="choice-main"><div class="choice-title">未配置</div></div></div>
  `);
};
</script>
</body>
</html>
