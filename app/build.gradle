plugins { id 'com.android.application' }

def generatedManifest = layout.buildDirectory.file('generated/gecko/AndroidManifest.xml')
tasks.register('prepareGeckoManifest') {
    inputs.file('src/main/AndroidManifest.xml')
    outputs.file(generatedManifest)
    doLast {
        def content = file('src/main/AndroidManifest.xml').getText('UTF-8')
            .replace(' package="local.pocketchat"', '')
            .replaceAll(/<uses-sdk[^>]*\/>/, '')
            .replace(' android:debuggable="false"', '')
            .replace('android:authorities="local.pocketchat.', 'android:authorities="${applicationId}.')
        def services = new StringBuilder()
        for (slot in 0..<8) {
            def types = ['socket','gpu','rdd','utility','gmplugin','ipdlunittest'] + (0..<40).collect { 'tab' + it }
            for (type in types) services.append('<service android:name="local.pocketchat.GeckoEnvironmentServices$E')
                .append(slot).append(type).append('" android:exported="false" android:process=":gecko_env')
                .append(slot).append('_').append(type).append('_disable_art_image_" />\n')
        }
        generatedManifest.get().asFile.with { parentFile.mkdirs(); setText(content.replace('</application>', services.toString() + '</application>'), 'UTF-8') }
    }
}

android {
    namespace 'local.pocketchat'
    compileSdk { version = release(37) { minorApiLevel = 1 } }
    defaultConfig { applicationId 'local.pocketchat'; minSdk 26; targetSdk 35; versionCode 34; versionName '1.5.8' }
    sourceSets {
        main { manifest.srcFile(generatedManifest) }
        integration { java.srcDirs = ['../tests/gecko']; manifest.srcFile('../tests/gecko/AndroidManifest.xml') }
    }
    buildTypes {
        release { minifyEnabled false; debuggable false }
        integration { initWith release; applicationIdSuffix '.test'; signingConfig signingConfigs.debug }
    }
    packaging { jniLibs { useLegacyPackaging = true } }
    splits { abi { enable true; reset(); include 'arm64-v8a', 'x86_64'; universalApk false } }
}
tasks.named('preBuild').configure { dependsOn 'prepareGeckoManifest' }
dependencies {
    implementation files('../libs/webkit-1.12.1.jar')
    implementation 'org.mozilla.geckoview:geckoview:157.0.20260924084938'
}
