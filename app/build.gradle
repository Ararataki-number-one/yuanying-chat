plugins { id 'com.android.application' }

def imeSdkTraceAar = providers.gradleProperty('imeSdkTraceAar')
if (imeSdkTraceAar.isPresent() && !gradle.startParameter.taskNames.every { it.toLowerCase().contains('integration') }) {
    throw new GradleException('Instrumented Gecko SDK is restricted to the isolated integration build')
}

def generatedManifest = layout.buildDirectory.file('generated/gecko/AndroidManifest.xml')
tasks.register('prepareGeckoManifest') {
    inputs.file('src/main/AndroidManifest.xml')
    outputs.file(generatedManifest)
    doLast {
        def content = file('src/main/AndroidManifest.xml').getText('UTF-8')
            .replace(' package="local.pocketchat"', '')
            .replaceAll(/<uses-sdk[^>]*\/>/, '')
            .replace(' android:debuggable="false"', '')
            .replace('android:authorities="local.pocketchat.', 'android:authorities="${applicationId}.')
        def services = new StringBuilder()
        for (slot in 0..<8) {
            def types = ['socket','gpu','rdd','utility','gmplugin','ipdlunittest'] + (0..<40).collect { 'tab' + it }
            for (type in types) services.append('<service android:name="local.pocketchat.GeckoEnvironmentServices$E')
                .append(slot).append(type).append('" android:exported="false" android:process=":gecko_env')
                .append(slot).append('_').append(type).append('_disable_art_image_" />\n')
        }
        generatedManifest.get().asFile.with { parentFile.mkdirs(); setText(content.replace('</application>', services.toString() + '</application>'), 'UTF-8') }
    }
}

android {
    namespace 'local.pocketchat'
    compileSdk { version = release(37) { minorApiLevel = 1 } }
    defaultConfig { applicationId 'local.pocketchat'; minSdk 26; targetSdk 35; versionCode 46; versionName '1.5.20' }
    signingConfigs { debug { if (providers.gradleProperty('testSigningKey').isPresent()) storeFile file(providers.gradleProperty('testSigningKey').get()) } }
    sourceSets {
        main { manifest.srcFile(generatedManifest) }
        integration { java.srcDirs = ['../tests/gecko']; assets.srcDirs = ['../tests/gecko/assets']; manifest.srcFile('../tests/gecko/AndroidManifest.xml') }
    }
    buildTypes {
        release { minifyEnabled false; debuggable false }
        integration { initWith release; applicationIdSuffix '.test'; signingConfig signingConfigs.debug }
    }
    packaging { jniLibs { useLegacyPackaging = true } }
    splits { abi { enable true; reset(); include 'arm64-v8a', 'x86_64'; universalApk false } }
}
tasks.named('preBuild').configure { dependsOn 'prepareGeckoManifest' }
dependencies {
    implementation 'androidx.startup:startup-runtime:1.2.0'
    implementation files('../libs/webkit-1.12.1.jar')
    if (imeSdkTraceAar.isPresent()) {
        implementation files(imeSdkTraceAar.get())
        // The exact upstream 157.0 POM dependencies survive the local AAR replacement.
        implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.4.20'
        runtimeOnly 'androidx.annotation:annotation:1.10.0'
        runtimeOnly 'androidx.annotation:annotation-experimental:1.6.0'
        runtimeOnly 'androidx.collection:collection:1.6.0'
        runtimeOnly 'androidx.core:core:1.19.0'
        runtimeOnly 'androidx.lifecycle:lifecycle-common:2.11.0'
        runtimeOnly 'androidx.lifecycle:lifecycle-process:2.11.0'
        runtimeOnly 'com.google.android.gms:play-services-fido:21.3.1'
        runtimeOnly 'org.yaml:snakeyaml:2.2'
        runtimeOnly 'androidx.media3:media3-common:1.11.0'
        runtimeOnly 'androidx.media3:media3-datasource:1.11.0'
        runtimeOnly 'androidx.media3:media3-decoder:1.11.0'
        runtimeOnly 'androidx.media3:media3-exoplayer:1.11.0'
        runtimeOnly 'androidx.media3:media3-exoplayer-hls:1.11.0'
    } else implementation 'org.mozilla.geckoview:geckoview:157.0.20260924084938'
}
