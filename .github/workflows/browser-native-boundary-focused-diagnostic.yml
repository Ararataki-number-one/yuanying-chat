        BRANCH='diagnostic/browser-native-boundary-20261106-1'
        WORKFLOW_FILE='.github/workflows/browser-native-boundary-focused-diagnostic.yml'
        FINAL=True
        import hashlib,json,os,pathlib,re,subprocess
        def need(value,message):
            if not value: raise ValueError(message)
        def git(*args):
            return subprocess.check_output(['git','--no-replace-objects',*args],text=True).strip()
        head=git('rev-parse','HEAD');tree=git('rev-parse','HEAD^{tree}')
