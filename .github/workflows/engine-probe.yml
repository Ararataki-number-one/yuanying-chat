name: Android engine SDK probe
on:
  push:
    branches: [feature/android-engine-probe]
    paths: ['engine-probe/**', '.github/workflows/engine-probe.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: engine-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare verified SDK and Gradle
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          mkdir -p work/gecko-sdk-validation
          curl -fsSL --retry 3 https://services.gradle.org/distributions/gradle-9.8.0-bin.zip -o work/gecko-sdk-validation/gradle-bin.zip
          echo 'bafd5ce9cfaea0fbccfdc8439a1ac42fbd4cd9c89dc9a988228d8a2639a58e6c  work/gecko-sdk-validation/gradle-bin.zip' | sha256sum -c -
          unzip -q work/gecko-sdk-validation/gradle-bin.zip -d work/gecko-sdk-validation/gradle
          curl -fsSL --retry 3 https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/157.0.20260924084938/geckoview-157.0.20260924084938.aar -o work/gecko-sdk-validation/geckoview.aar
          echo '25de06a6204382c08e405adc36da7373098bdc230d6d768f17a6fe971f0dece0  work/gecko-sdk-validation/geckoview.aar' | sha256sum -c -
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.1' 'build-tools;37.0.0' 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'
      - name: Compile actual precompiled kernel
        shell: bash
        run: |
          set -euo pipefail
          work/gecko-sdk-validation/gradle/gradle-9.8.0/bin/gradle -p engine-probe :app:assembleDebug --console=plain --write-verification-metadata sha256 2>&1 | tee work/gecko-sdk-validation/build.log
      - name: Make compiled artifacts available before device startup
        run: python3 engine-probe/tests/publish_ci.py
      - name: Run native Android fixture
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee work/gecko-sdk-validation/native-test.log) 2>&1
          sudo chmod a+rw /dev/kvm
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force -n engineprobe -k 'system-images;android-35;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd engineprobe -no-window -no-audio -no-snapshot -gpu swiftshader -memory 2048 -cores 2 > work/gecko-sdk-validation/emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
          adb shell input keyevent 82
          adb install engine-probe/app/build/outputs/apk/debug/app-x86_64-debug.apk
          python3 engine-probe/tests/run_device.py --adb "$(command -v adb)" --serial emulator-5554
          adb exec-out screencap -p > work/gecko-sdk-validation/device-screen.png
      - name: Publish isolated test artifacts and outcomes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 engine-probe/tests/publish_ci.py
