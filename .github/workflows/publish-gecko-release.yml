name: Publish original-signed Gecko APK
on:
  push:
    branches: [apk/gecko-release-20261003]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: production-app-updates
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore immutable qualification inputs locally
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,shlex,stat,subprocess,sys,tempfile
          
          SOURCE='4df73b636b96eedebe5247478fabb5f736e5b3c0'
          SOURCE_TREE='f69d9b0caed9135d474f1ffb93ee670be823befa'
          QUALIFICATION='04481a5f7011b87ba09823b594498edd6fdbd53b'
          QUALIFICATION_TREE='0c6447acadc8db1988571f81198bd467afef4cb6'
          QUALIFICATION_MANIFEST_SHA256='67addec49b1fe2f3addbf94bbb07be3dd21e8c42b4d52c6fa8230b4b3ecd8138'
          MAX_TREE=1048576
          MAX_FILES=4096
          MAX_BLOB=8388608
          MAX_TOTAL=100663296
          PUBLIC_FILES=frozenset({'.github/workflows/publish-gecko-release.yml','PocketChat-2.0.38-arm64-v8a.apk.part00','PocketChat-2.0.38-arm64-v8a.apk.part01','RELEASE.md','release-authorization.json','release-manifest.json','signed-apk-tail.bin','signed-transport.json','tools/gecko/release_channel_contract.py','tools/gecko/release_channel_contract_test.py','tools/publish-gecko-release.py','tools/publish-update-feed.py','unsigned-build-manifest.json'})
          PARTS=('PocketChat-2.0.38-arm64-v8a.apk.part00', 'PocketChat-2.0.38-arm64-v8a.apk.part01')
          # These are the four source-code relocations in the original staging script.
          # No diagnostic inventory, file identities or previous runtime index is embedded.
          RELOCATIONS=(('tests/gecko/run_network_settings_retry.py','tools/gecko/run_network_settings_retry.py'),('tests/gecko/run_network_settings_application.py','tools/gecko/run_network_settings_application.py'),('tests/gecko/run_network_settings_internal.py','tools/gecko/run_network_settings_internal.py'),('tests/gecko/assets/sharing-schema-matrix.json','tools/gecko/sharing-schema-matrix.json'))
          
          class Rejected(Exception):pass
          
          def require(condition):
              if not condition:raise Rejected()
          
          def strict_json(raw):
              def pairs(items):
                  result={}
                  for key,value in items:
                      require(key not in result);result[key]=value
                  return result
              return json.loads(raw,object_pairs_hook=pairs,parse_constant=lambda _:(_ for _ in ()).throw(Rejected()))
          
          def safe_path(value):
              require(isinstance(value,str) and 0<len(value)<=240 and re.fullmatch(r'[A-Za-z0-9_.][A-Za-z0-9_./-]*',value) is not None)
              parts=value.split('/')
              require(all(part not in ('','.','..','.git') and not part.startswith('.') for part in parts))
              require(not re.search(r'(?i)(?:\.(?:jks|p12|pfx|pem|key|keystore)$|(?:^|/)(?:private|credentials?|passwords?|secrets?)(?:[./-]|$))',value))
              return value
          
          def git(root,*args):
              result=subprocess.run(['git',*args],cwd=root,stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=60,check=False)
              require(result.returncode==0)
              return result.stdout
          
          def tree_rows(raw):
              require(0<len(raw)<=MAX_TREE and raw.endswith(b'\0'))
              result={}
              for entry in raw.split(b'\0')[:-1]:
                  require(entry.count(b'\t')==1)
                  header,path=entry.split(b'\t');fields=header.split()
                  require(len(fields)==4)
                  mode,kind,blob,size=fields
                  require(mode in (b'100644',b'100755') and kind==b'blob' and re.fullmatch(b'[0-9a-f]{40}',blob) is not None and re.fullmatch(b'0|[1-9][0-9]*',size) is not None)
                  path=path.decode('utf-8');safe_path(path)
                  require(path not in result)
                  result[path]={'path':path,'mode':mode.decode(),'blob':blob.decode(),'bytes':int(size)}
              require(0<len(result)<=MAX_FILES)
              return result
          
          def no_symlink_path(root,path):
              target=root/path
              for parent in (target,*target.parents):
                  if parent==root.parent:break
                  require(not parent.is_symlink())
              require(not target.exists())
              return target
          
          def verify_existing(root,row):
              target=root/row['path']
              require(target.is_file() and not target.is_symlink() and target.stat().st_size==row['bytes'])
              for parent in target.parents:
                  require(not parent.is_symlink())
                  if parent==root:break
              digest=hashlib.sha1(b'blob '+str(row['bytes']).encode()+b'\0');sha=hashlib.sha256()
              with target.open('rb') as stream:
                  for block in iter(lambda:stream.read(1048576),b''):digest.update(block);sha.update(block)
              require(digest.hexdigest()==row['blob'])
              return sha.hexdigest()
          
          def plan_inputs(qualified,source):
              result={}
              def add(row,commit,destination=None):
                  name=safe_path(destination or row['path'])
                  require(name not in PUBLIC_FILES and row['bytes']<=MAX_BLOB)
                  value=dict(row,originPath=row['path'],path=name,commit=commit)
                  if name in result:
                      require(all(result[name][k]==value[k] for k in ('path','mode','blob','bytes')))
                  else:result[name]=value
              for name,row in qualified.items():
                  if name in PUBLIC_FILES:require(name in PARTS)
                  else:add(row,QUALIFICATION)
              for name,row in source.items():
                  if name.startswith('tools/gecko/') and name not in PUBLIC_FILES:add(row,SOURCE)
              for origin,destination in RELOCATIONS:
                  require(origin in source);add(source[origin],SOURCE,destination)
              require(0<len(result)<=MAX_FILES and sum(row['bytes'] for row in result.values())<=MAX_TOTAL)
              return [result[name] for name in sorted(result)]
          
          def hydrate(root):
              root=root.resolve();require(root.is_dir() and not root.is_symlink())
              # The public checkout contains only the thirteen explicitly authorized leaves.
              head=git(root,'ls-tree','-rz','--full-tree','HEAD').split(b'\0');checked=set()
              for entry in head:
                  if not entry:continue
                  header,path=entry.split(b'\t',1);mode,kind,blob=header.split()
                  require(mode==b'100644' and kind==b'blob');checked.add(path.decode('utf-8'))
              require(checked==PUBLIC_FILES)
              for commit,tree in ((SOURCE,SOURCE_TREE),(QUALIFICATION,QUALIFICATION_TREE)):
                  git(root,'fetch','--no-tags','--depth=1','--filter=blob:limit=8388608','origin',commit)
                  require(git(root,'rev-parse',commit+'^{commit}').strip().decode()==commit)
                  require(git(root,'rev-parse',commit+'^{tree}').strip().decode()==tree)
              manifest=git(root,'show',QUALIFICATION+':manifest.json')
              require(len(manifest)<=MAX_TREE and hashlib.sha256(manifest).hexdigest()==QUALIFICATION_MANIFEST_SHA256)
              meta=strict_json(manifest)
              require(meta.get('sourceCommit')==SOURCE and meta.get('version')=='2.0.38' and meta.get('versionCode')==91 and meta.get('runId')=='41010493735' and meta.get('runAttempt')=='1')
              qualified=tree_rows(git(root,'ls-tree','-rlz','--full-tree',QUALIFICATION))
              source_paths=('tools/gecko','tools/publish-gecko-release.py','tools/publish-update-feed.py',*(origin for origin,_ in RELOCATIONS))
              source=tree_rows(git(root,'ls-tree','-rlz','--full-tree',SOURCE,'--',*source_paths))
              require(set(PARTS)<=set(qualified))
              # Existing unsigned transport is checked in place, never overwritten/copied.
              whole=hashlib.sha256();size=0
              for name in PARTS:
                  row=qualified[name];require(row['mode']=='100644')
                  verify_existing(root,row)
                  with (root/name).open('rb') as stream:
                      for block in iter(lambda:stream.read(1048576),b''):whole.update(block);size+=len(block)
              artifacts=meta.get('artifacts');require(isinstance(artifacts,list) and len(artifacts)==1)
              require(artifacts[0].get('bytes')==size and artifacts[0].get('sha256')==whole.hexdigest())
              # Public source tools already tracked in the checkout must be identical too.
              for name in PUBLIC_FILES:
                  if name.startswith('tools/'):
                      require(name in source and source[name]['mode']=='100644');verify_existing(root,source[name])
              rows=plan_inputs(qualified,source)
              for row in rows:no_symlink_path(root,row['path'])
              for row in rows:
                  require(git(root,'cat-file','-t',row['blob']).strip()==b'blob')
                  require(git(root,'cat-file','-s',row['blob']).strip()==str(row['bytes']).encode())
                  data=git(root,'cat-file','blob',row['blob'])
                  require(len(data)==row['bytes'] and hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==row['blob'])
                  target=no_symlink_path(root,row['path']);target.parent.mkdir(parents=True,exist_ok=True)
                  no_symlink_path(root,row['path'])
                  descriptor=os.open(target,os.O_CREAT|os.O_EXCL|os.O_WRONLY|getattr(os,'O_NOFOLLOW',0),0o600)
                  with os.fdopen(descriptor,'wb') as stream:stream.write(data)
                  os.chmod(target,0o700 if row['mode']=='100755' else 0o600)
              return len(rows)
          
          def install_private_python_output_guard():
              require(not os.environ.get('BASH_ENV'))
              runner=pathlib.Path(os.environ['RUNNER_TEMP'])
              environment=pathlib.Path(os.environ['GITHUB_ENV'])
              require(runner.is_dir() and not runner.is_symlink() and environment.is_file() and not environment.is_symlink())
              interpreter=pathlib.Path(sys.executable)
              require(interpreter.is_absolute() and interpreter.is_file() and os.access(interpreter,os.X_OK))
              directory=pathlib.Path(tempfile.mkdtemp(prefix='pocketchat-private-python-',dir=runner));os.chmod(directory,0o700)
              guard=directory/'guard.bash'
              # An unchanged Python command retains its interpreter, argv, stdin and exit.
              # Only stdout/stderr are runner-private, including nested child processes.
              script=("python3() {\n"
                      "  local output status\n"
                      "  output=\"$(mktemp "+shlex.quote(str(directory/'python.XXXXXXXX'))+" 2>/dev/null)\" || { printf 'PYTHON_STEP status=failed exit=70\\n' >&2; return 70; }\n"
                      "  if "+shlex.quote(str(interpreter))+" \"$@\" >\"$output\" 2>&1; then\n"
                      "    printf 'PYTHON_STEP status=passed exit=0\\n'\n"
                      "    return 0\n"
                      "  else\n"
                      "    status=$?\n"
                      "    printf 'PYTHON_STEP status=failed exit=%s\\n' \"$status\" >&2\n"
                      "    return \"$status\"\n"
                      "  fi\n"
                      "}\n")
              descriptor=os.open(guard,os.O_CREAT|os.O_EXCL|os.O_WRONLY,0o600)
              with os.fdopen(descriptor,'w') as stream:stream.write(script)
              require('\n' not in str(guard) and '\r' not in str(guard))
              with environment.open('a') as stream:stream.write('BASH_ENV='+str(guard)+'\n')
              return guard
          
          
          def main():
              restored=hydrate(pathlib.Path.cwd())
              install_private_python_output_guard()
              print('QUALIFICATION_RUNTIME status=restored count='+str(restored)+' source='+SOURCE+' run=41010493735 attempt=1 privateOnly=true')
          
          if __name__=='__main__':
              try:main()
              except BaseException:
                  # No diagnostic bytes, subprocess stderr, URLs or exception text is public.
                  print('QUALIFICATION_RUNTIME status=failed',file=sys.stderr)
                  raise SystemExit(1)
          PY
      - name: Verify original regressions, derived SDK provenance and signed public APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess
          m=json.loads(pathlib.Path('release-manifest.json').read_text())
          if 'releaseException' in m:
              from tools.gecko.release_203_authorization import verify_release
              subprocess.run(['python3','tools/gecko/release_203_authorization_test.py'],check=True)
              verify_release(pathlib.Path('.'))
              raise SystemExit(0)
          tools_commit=m['releaseToolsCommit']
          assert re.fullmatch(r'[0-9a-f]{40}',tools_commit)
          assert re.fullmatch(r'[0-9a-f]{40}',m['sourceCommit'])
          subprocess.run(['git','fetch','--no-tags','--depth=2','--filter=blob:none','origin',tools_commit],check=True)
          subprocess.run(['git','fetch','--no-tags','--depth=1','--filter=blob:none','origin',m['sourceCommit']],check=True)
          parents=[line.split()[1] for line in subprocess.check_output(['git','cat-file','-p',os.environ['GITHUB_SHA']],text=True).split('\n\n',1)[0].splitlines() if line.startswith('parent ')]
          assert parents[0]==m['sourceCommit'] and tools_commit in parents
          release_files={'.github/workflows/publish-gecko-release.yml','tools/publish-gecko-release.py','tools/gecko/release_channel_contract.py','tools/gecko/release_channel_contract_test.py'}
          if tools_commit!=m['sourceCommit']:
              subprocess.run(['git','merge-base','--is-ancestor',m['sourceCommit'],tools_commit],check=True)
              changed=set(subprocess.check_output(['git','diff','--name-only',m['sourceCommit'],tools_commit],text=True).splitlines())
              assert changed and changed<=release_files,'Release tools cannot change the tested APK application source.'
          for name in release_files|{'tools/publish-update-feed.py'}:
              assert pathlib.Path(name).read_bytes()==subprocess.check_output(['git','show',tools_commit+':'+name]),name
          subprocess.run(['python3','tools/gecko/release_channel_contract_test.py'],check=True)
          from tools.gecko.release_channel_contract import release_tag, requires_manual_acceptance, verify_manual_acceptance, verify_direct_release
          release_tag(m)
          if requires_manual_acceptance(m):
              manual='manualAcceptanceArtifact' in m
              direct='releaseAuthorizationArtifact' in m
              assert manual!=direct,'Choose physical acceptance or a separately recorded release instruction.'
              record=m['manualAcceptanceArtifact' if manual else 'releaseAuthorizationArtifact']
              assert record['file']==('manual-acceptance.json' if manual else 'release-authorization.json')
              raw=pathlib.Path(record['file']).read_bytes()
              assert len(raw)==record['bytes'] and hashlib.sha256(raw).hexdigest()==record['sha256']
              if manual:
                  assert 'releaseAuthorization' not in m
                  assert verify_manual_acceptance(json.loads(raw),m)==m['manualAcceptance']
                  assert m['physicalArmPhone']=='user-reported-passed'
              else:
                  assert 'manualAcceptance' not in m
                  assert verify_direct_release(json.loads(raw),m)==m['releaseAuthorization']
                  assert m['physicalArmPhone']=='not-tested'
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+',m['version']) and isinstance(m['versionCode'],int)
          assert m['filename']==f"PocketChat-{m['version']}-gecko-arm64.apk"
          assert re.fullmatch(r'[0-9a-f]{40}',m['sourceCommit'])
          if m['versionCode']>=46:
              # Client and derived SDK checks use git-show before profile checks.
              subprocess.run(['git','fetch','--no-tags','--depth=1','--filter=blob:none','origin',m['sourceCommit']],check=True)
          report=json.loads(pathlib.Path('device-results.json').read_text())
          assert report['sourceCommit']==m['sourceCommit'] and report['status']=='passed' and report['actualAndroidExecution'] and report['releaseMode']
          if m['versionCode']>=59:
              raw=pathlib.Path('appearance-results.json').read_bytes();a=json.loads(raw)
              assert a['status']=='passed' and a['actualAndroidExecution'] and a['systemModeEvents']
              assert a['buildIdentity']['sourceCommit']==m['sourceCommit'] and a['actualAndroidTaps']>=9
              assert a['checkCount']==len(a['checks']) and all(c['pass'] for c in a['checks'])
              assert m['appearanceRegression']==dict(sourceCommit=m['sourceCommit'],checkCount=a['checkCount'],reportSha256=hashlib.sha256(raw).hexdigest(),actualAndroidExecution=True,physicalPhoneAcceptance=False)
              assert json.loads(pathlib.Path('gecko-performance-results.json').read_text())['actualAppearanceRoundtrip']
              network=json.loads(pathlib.Path('network-performance-results.json').read_text())
              required={'A faster permitted entrance reduces controlled website cold response time','Fresh website evidence avoids duplicate candidate HEAD requests','Expired candidate evidence is renewed through real website requests','Budgeted website comparison keeps live entry and fixed exit'}
              assert required<=set(c['name'] for c in network['checks'] if c['pass'])
          if m['versionCode']>=43:
              from tools.gecko.check_performance_evidence import verify_performance_evidence
              assert verify_performance_evidence(pathlib.Path('.'),m['sourceCommit'])==m['performanceRegression']
          if m['versionCode']>=44:
              from tools.gecko.check_connection_evidence import verify_connection_evidence
              assert verify_connection_evidence(pathlib.Path('.'),m['sourceCommit'])==m['connectionRecoveryRegression']
          if m['versionCode']>=45:
              from tools.gecko.check_interaction_transfer_evidence import verify_interaction_transfer_evidence
              assert verify_interaction_transfer_evidence(pathlib.Path('.'),m['sourceCommit'])==m['interactionTransferRegression']
          if m['versionCode']>=46:
              from tools.gecko.check_chain_evidence import verify_chain_evidence
              assert verify_chain_evidence(pathlib.Path('.'),m['sourceCommit'])==m['chainPerformanceRegression']
              from tools.gecko.check_client_evidence import verify_client_evidence
              assert verify_client_evidence(pathlib.Path('.'),m['sourceCommit'])==m['originalClientRegression']
              from tools.gecko.check_sdk_build_evidence import verify_sdk_build_evidence
              sdk_build=verify_sdk_build_evidence(pathlib.Path('.'),m['sourceCommit'])
              if sdk_build is not None:
                  assert sdk_build==m['sdkBuildProvenance']
                  assert sdk_build['runId']==m['buildRunId'] and sdk_build['runAttempt']==m['buildRunAttempt']
                  from tools.gecko.check_caret_compat_evidence import verify_caret_evidence
                  from tools.gecko.profile_invocation_contract import verify_installed
                  from tools.gecko.sdk_identity_contract import strict_json
                  caret=verify_caret_evidence(pathlib.Path('.'),m['sourceCommit'])
                  assert caret==m['controlledCaretCompatibilityRegression']
                  assert caret['runId']==m['buildRunId'] and caret['runAttempt']==m['buildRunAttempt']
                  assert caret['sourceTree']==sdk_build['sourceTree']
                  assert caret['releaseApkSha256']==m['unsignedSha256']
                  compatibility=strict_json(pathlib.Path('gecko-caret-compat-results.json').read_bytes())
                  installed=report['eventTransport']['buildIdentity']
                  verify_installed(compatibility['commonInstalledIdentity'],installed)
                  assert caret['integrationApkSha256']==installed['apkSha256']
                  for key in ('sdkAarSha256','sdkClassesJarSha256','sdkGeckoEditableClassSha256','sdkManifestSha256','sdkBuildReceiptSha256'):
                      assert caret[key]==sdk_build[key],key
              else:
                  assert 'sdkBuildProvenance' not in m and 'controlledCaretCompatibilityRegression' not in m
              for name in ['native-probe-results.json','gecko-pool-results.json','network-core-build.json','network-pool-host-results.json','latency-probe-host-results.json']:
                  assert json.loads(pathlib.Path(name).read_text())['sourceCommit']==m['sourceCommit'],name
              if m['chainPerformanceRegression'].get('fixedExitPreauthentication'):
                  assert json.loads(pathlib.Path('preconnect-results.json').read_text())['sourceCommit']==m['sourceCommit']
          if tuple(map(int,m['version'].split('.'))) >= (1,6,0):
              from tools.gecko.check_profile_evidence import verify_profile_evidence
              assert verify_profile_evidence(pathlib.Path('.'),m['sourceCommit'])==m['environmentProfileRegression']
              prototype=json.loads(pathlib.Path('gecko-identity-prototype-results.json').read_text())
              assert prototype['sourceCommit']==m['sourceCommit'] and prototype['actualAndroidExecution'] is True
              assert prototype['diagnosticOnly'] is True and prototype['releaseAcceptance'] is False
          if tuple(map(int,m['version'].split('.'))) >= (1,7,0):
              from tools.gecko.check_template_evidence import verify_template_evidence
              assert verify_template_evidence(pathlib.Path('.'),m['sourceCommit'])==m['controlledTemplateRegression']
          if tuple(map(int,m['version'].split('.'))) >= (2,0,0):
              from tools.gecko.check_resource_evidence import verify_resource_evidence
              assert verify_resource_evidence(pathlib.Path('.'),m['sourceCommit'])==m['resourcePressureDiagnostic']
          # Optional byte transport only. The same original parts and all
          # release/signature gates below remain mandatory after reconstruction.
          from tools.gecko.release_channel_contract import (restore_signed_transport, signed_transport_artifact_commit,
              verify_unsigned_transport_provenance, read_transport_json_bytes, MAX_MANIFEST_BYTES)
          artifact=signed_transport_artifact_commit(m)
          if artifact is not None:
              subprocess.run(['git','fetch','--no-tags','--depth=1','--filter=blob:none','origin',artifact],check=True)
              actual=subprocess.check_output(['git','rev-parse','FETCH_HEAD^{commit}'],text=True).strip()
              assert actual==artifact
              for obj in (artifact,artifact+':manifest.json'):
                  size=subprocess.check_output(['git','cat-file','-s',obj],text=True).strip()
                  assert size.isdigit() and 0<int(size)<=MAX_MANIFEST_BYTES,'Immutable transport metadata exceeds bound'
              commit_raw=subprocess.check_output(['git','cat-file','-p',artifact])
              header=commit_raw.split(b'\n\n',1)[0].decode('ascii')
              parents=[line.split()[1] for line in header.splitlines() if line.startswith('parent ')]
              remote_manifest=subprocess.check_output(['git','show',artifact+':manifest.json'])
              local_manifest=read_transport_json_bytes('unsigned-build-manifest.json')
              provenance=verify_unsigned_transport_provenance(m,local_manifest,remote_manifest,parents,actual)
              print('SIGNED_TRANSPORT_SOURCE '+json.dumps(provenance,sort_keys=True))
          transport=restore_signed_transport(m,pathlib.Path('.'))
          if transport is not None:print('SIGNED_TRANSPORT '+json.dumps(transport,sort_keys=True))
          data=bytearray()
          for part in m['parts']:
              assert re.fullmatch(re.escape(m['filename'])+r'\.part[0-9]{2}',part['file'])
              raw=pathlib.Path(part['file']).read_bytes()
              assert len(raw)==part['bytes'] and hashlib.sha256(raw).hexdigest()==part['sha256']
              data.extend(raw)
          assert len(data)==m['bytes'] and hashlib.sha256(data).hexdigest()==m['sha256']
          pathlib.Path(m['filename']).write_bytes(data)
          if m['versionCode']>=46:
              import zipfile
              from tools.gecko.sdk_identity_contract import sdk_from_apk, SDK_FIELDS
              tree=subprocess.check_output(['git','rev-parse',m['sourceCommit']+'^{tree}'],text=True).strip()
              with zipfile.ZipFile(m['filename']) as archive: shipped=sdk_from_apk(archive,m['sourceCommit'],tree)
              if sdk_build is None:
                  assert shipped is None
              else:
                  assert shipped is not None
                  for key in (*SDK_FIELDS,'sourceCommit','sourceTree','runId','runAttempt'):
                      assert shipped[key]==sdk_build[key],key
          import os
          tools=sorted(pathlib.Path(os.environ['ANDROID_HOME']).glob('build-tools/*/apksigner'))[-1].parent
          cert=subprocess.check_output([str(tools/'apksigner'),'verify','--print-certs',m['filename']],text=True)
          assert 'f0afa2ef2b9ac68020b374276318b12d2bb4de65d2a3b788194de551356b9434' in cert
          info=subprocess.check_output([str(tools/'aapt2'),'dump','badging',m['filename']],text=True)
          assert f"package: name='local.pocketchat' versionCode='{m['versionCode']}' versionName='{m['version']}'" in info
          assert 'application-debuggable' not in info
          print('Verified original regressions, shipped SDK provenance, original signer, app identity, version and byte hash. Controlled caret checks remain separate from physical phone acceptance.')
          PY
      - name: Publish APK download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess,tempfile,urllib.error,urllib.request
          m=json.loads(pathlib.Path('release-manifest.json').read_text())
          repository=os.environ['GITHUB_REPOSITORY']
          assert re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+',repository)
          assert re.fullmatch(r'[0-9a-f]{40}',m['sourceCommit'])
          from tools.gecko.release_channel_contract import release_tag
          tag=release_tag(m)
          candidate=m.get('channel','stable')=='candidate'
          refs=subprocess.check_output(['git','ls-remote','origin','refs/tags/'+tag,'refs/tags/'+tag+'^{}'],text=True)
          values={name:commit for commit,name in (line.split() for line in refs.splitlines())}
          target=values.get('refs/tags/'+tag+'^{}',values.get('refs/tags/'+tag))
          request=urllib.request.Request('https://api.github.com/repos/'+repository+'/releases/tags/'+tag,
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          try:
              with urllib.request.urlopen(request,timeout=60) as response:existing=json.load(response)
          except urllib.error.HTTPError as error:
              if error.code!=404:raise
              existing=None
          if existing is None:
              assert target is None,'A tag already exists without a verifiable public release identity; use a new version.'
              qualification=[m[key]['file'] for key in ('manualAcceptanceArtifact','releaseAuthorizationArtifact') if key in m]
              if 'releaseException' in m:
                  qualification.append('known-caret-failure.json')
              command=['gh','release','create',tag,m['filename'],'release-manifest.json',*qualification,'--target',m['sourceCommit'],
                  '--title',m['version']+(' · 元婴期院士候选测试版' if candidate else ' · 元婴期院士正式版'),'--notes-file','RELEASE.md','--repo',repository]
              if candidate:command.extend(['--prerelease','--latest=false'])
              else:command.append('--latest=true')
              subprocess.run(command,check=True)
          else:
              assert existing['tag_name']==tag and not existing['draft'] and existing['prerelease']==candidate
              assert target==m['sourceCommit'],'Existing release tag belongs to another source; use a new version.'
              names=[asset['name'] for asset in existing['assets']]
              assert names.count('release-manifest.json')==1 and names.count(m['filename'])==1,'Existing release identity is incomplete; refusing replacement.'
              with tempfile.TemporaryDirectory(prefix='existing-gecko-release-') as directory:
                  subprocess.run(['gh','release','download',tag,'--pattern','release-manifest.json','--pattern',m['filename'],
                      '--dir',directory,'--repo',repository],check=True)
                  previous=json.loads((pathlib.Path(directory)/'release-manifest.json').read_text())
                  assert previous==m,'Existing release manifest differs; a published version is immutable.'
                  digest=hashlib.sha256();size=0
                  with (pathlib.Path(directory)/m['filename']).open('rb') as stream:
                      while data:=stream.read(1024*1024):digest.update(data);size+=len(data)
                  assert size==m['bytes'] and digest.hexdigest()==m['sha256'],'Existing public APK differs; refusing replacement.'
              print('Existing release has the exact manifest and APK identity; leaving its assets unchanged.')
          PY
      - name: Verify public download and advance app update channel
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess,urllib.request
          from tools.gecko.release_channel_contract import release_tag, advances_update_channel
          m=json.loads(pathlib.Path('release-manifest.json').read_text())
          if advances_update_channel(m):
              subprocess.run(['python3','tools/publish-update-feed.py'],check=True)
          else:
              url='https://github.com/Ararataki-number-one/yuanying-chat/releases/download/'+release_tag(m)+'/'+m['filename']
              value=hashlib.sha256();size=0
              with urllib.request.urlopen(url,timeout=60) as response:
                  assert response.status==200
                  while raw:=response.read(1024*1024):value.update(raw);size+=len(raw)
              assert size==m['bytes'] and value.hexdigest()==m['sha256']
              print('Candidate public download verified. Stable automatic update channel is unchanged.')
          PY
