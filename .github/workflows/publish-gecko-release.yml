name: Publish original-signed Gecko APK
on:
  push:
    branches: [apk/gecko-release-20261003]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reconstruct and verify signed public APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,re,subprocess
          m=json.loads(pathlib.Path('release-manifest.json').read_text())
          assert m['filename']=='PocketChat-1.5.7-gecko-arm64.apk'
          data=bytearray()
          for part in m['parts']:
              assert re.fullmatch(r'PocketChat-1\.5\.7-gecko-arm64\.apk\.part[0-9]{2}',part['file'])
              raw=pathlib.Path(part['file']).read_bytes()
              assert len(raw)==part['bytes'] and hashlib.sha256(raw).hexdigest()==part['sha256']
              data.extend(raw)
          assert len(data)==m['bytes'] and hashlib.sha256(data).hexdigest()==m['sha256']
          pathlib.Path(m['filename']).write_bytes(data)
          import os
          tools=sorted(pathlib.Path(os.environ['ANDROID_HOME']).glob('build-tools/*/apksigner'))[-1].parent
          cert=subprocess.check_output([str(tools/'apksigner'),'verify','--print-certs',m['filename']],text=True)
          assert 'f0afa2ef2b9ac68020b374276318b12d2bb4de65d2a3b788194de551356b9434' in cert
          info=subprocess.check_output([str(tools/'aapt2'),'dump','badging',m['filename']],text=True)
          assert "package: name='local.pocketchat' versionCode='33' versionName='1.5.7'" in info
          assert 'application-debuggable' not in info
          print('Verified original signer, app identity, version and byte hash.')
          PY
      - name: Publish APK download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_commit=$(python3 -c "import json;print(json.load(open('release-manifest.json'))['sourceCommit'])")
          if gh release view v1.5.7-gecko --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.5.7-gecko PocketChat-1.5.7-gecko-arm64.apk release-manifest.json --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v1.5.7-gecko PocketChat-1.5.7-gecko-arm64.apk release-manifest.json --target "$source_commit" --title '1.5.7 · Gecko 网页内核更新' --notes-file RELEASE.md --repo "$GITHUB_REPOSITORY"
          fi
