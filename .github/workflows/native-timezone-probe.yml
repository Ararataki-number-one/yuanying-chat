name: Diagnostic native Gecko timezone and worker observations
'on':
  push:
    branches:
    - diagnostics/native-timezone-*
    paths:
    - tests/gecko/NativeTimezoneProbe*.java
    - tests/gecko/AndroidManifest.xml
    - tests/gecko/assets/native-timezone-*
    - tests/gecko/assets/native-timezone-extension/**
    - tools/gecko/run_native_timezone_probe.py
    - tests/native_timezone_probe_test.py
    - .github/workflows/native-timezone-probe.yml
    - tests/gecko/native_timezone_api_contract.py
permissions:
  contents: read
concurrency:
  group: native-timezone-probe-${{ github.ref }}
  cancel-in-progress: false
env:
  ANDROID_CAPACITY_PREFLIGHT: "import json,os,pathlib,re,subprocess,sys,time\nfrom fractions import Fraction\ndef require(value,message):\n    if not value:raise ValueError(message)\nmode,scope=sys.argv[1:]\nrequire(mode in ('host','guest') and re.fullmatch('[a-z0-9-]+',scope),'Invalid preflight scope')\njob=os.environ['GITHUB_JOB'];require(re.fullmatch('[a-z0-9_-]+',job),'Invalid actual job')\ntarget=pathlib.Path('work/gecko-integration')/('android-capacity-'+job+'-'+scope+'.json')\nrecord={'schema':1,'status':'failed','requestedGuestCpus':4,'scope':scope,'job':job,'mode':mode}\npassed=False\ntry:\n    identity={'sourceCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),\n              'sourceTree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),\n              'runId':os.environ['GITHUB_RUN_ID'],'runAttempt':os.environ['GITHUB_RUN_ATTEMPT']}\n    record.update(identity)\n    require(identity['sourceCommit']==os.environ['GITHUB_SHA']\
    \ and re.fullmatch('[0-9a-f]{40}',identity['sourceTree']),'Actual source identity differs')\n    require(identity['runId'].isdigit() and identity['runAttempt'].isdigit(),'Actual CI run identity required')\n    if mode=='host':\n        require(not target.exists() and not target.is_symlink(),'Repeated capacity preflight')\n        affinity=sorted(os.sched_getaffinity(0))\n        nproc=int(subprocess.check_output(['nproc'],text=True,timeout=5).strip())\n        require(affinity and nproc>0,'Actual host CPU counts unavailable')\n        record['host']={'affinityCpus':affinity,'nproc':nproc,'observedAtMonotonicNs':time.monotonic_ns()}\n        unified=[line.split(':',2)[2] for line in pathlib.Path('/proc/self/cgroup').read_text().splitlines() if line.startswith('0::')]\n        mounts=[line for line in pathlib.Path('/proc/self/mountinfo').read_text().splitlines() if ' - cgroup2 ' in line]\n        record['host'].update(unifiedCgroups=unified,cgroup2Mounts=mounts)\n        require(len(unified)==1\
    \ and len(mounts)==1,'Unambiguous cgroup v2 observation required')\n        fields=mounts[0].split(' - ',1)[0].split();mount=pathlib.Path(fields[4]).resolve()\n        current=pathlib.PurePosixPath(unified[0]);root=pathlib.PurePosixPath(fields[3])\n        require(current.is_absolute() and '..' not in current.parts,'Unsupported actual cgroup path')\n        relative=[current.relative_to('/')]\n        if current.is_relative_to(root):relative.append(current.relative_to(root))\n        candidates={(mount/path).resolve() for path in relative}\n        candidates={path for path in candidates if path.is_relative_to(mount) and (path/'cgroup.procs').is_file()}\n        require(len(candidates)==1,'Current cgroup cannot be resolved unambiguously')\n        node=candidates.pop();limits=[];capacity=Fraction(min(len(affinity),nproc));observed=0\n        record['host']['cpuMax']=limits\n        while True:\n            path=node/'cpu.max'\n            try:\n                raw=path.read_text().strip();limits.append({'path':str(path),'raw':raw});quota,period=raw.split()\n\
    \                require(period.isdigit() and int(period)>0 and (quota=='max' or (quota.isdigit() and int(quota)>0)),'Invalid actual cpu.max')\n                if quota!='max':capacity=min(capacity,Fraction(int(quota),int(period)))\n                observed+=1\n            except FileNotFoundError:limits.append({'path':str(path),'raw':None,'interfacePresent':False})\n            if node==mount:break\n            node=node.parent\n        record['host'].update(unifiedCgroup=unified[0],cgroup2Mount=mounts[0],cpuMax=limits,\n                              visibleCapacityCeilingNumerator=capacity.numerator,visibleCapacityCeilingDenominator=capacity.denominator,\n                              capacityScope='Visible affinity/nproc/cgroup limits only; not idle CPUs or invisible outer quotas')\n        require(observed>0,'Actual cgroup CPU quota observation unavailable')\n        require(capacity>=4,'Host effective CPU capacity is below four; no fallback')\n    else:\n        previous=json.loads(target.read_text())\n\
    \        require(previous['status']=='passed' and previous['scope']==scope and previous['job']==job,'Passed host observation missing')\n        require(all(previous.get(key)==value for key,value in identity.items()),'Capacity source/run differs')\n        record=previous;record['mode']='guest'\n        raw=subprocess.check_output(['adb','-s','emulator-5554','shell','getconf','_NPROCESSORS_ONLN'],text=True,timeout=8).strip()\n        record['guest']={'serial':'emulator-5554','getconf':'_NPROCESSORS_ONLN','raw':raw,\n                         'observedAtMonotonicNs':time.monotonic_ns()}\n        require(raw=='4','Actual native-ADB guest online CPU count is not four')\n        record['guest']['onlineCpus']=4\n    record['status']='passed';passed=True\nexcept BaseException as error:\n    record.update(status='failed',errorType=type(error).__name__,error=str(error))\nif mode=='host' and (target.exists() or target.is_symlink()):\n    print('ANDROID_CAPACITY_PREFLIGHT '+json.dumps(record,sort_keys=True),flush=True);sys.exit(1)\n\
    target.parent.mkdir(parents=True,exist_ok=True)\ntemporary=target.with_suffix('.partial');temporary.write_text(json.dumps(record,sort_keys=True)+'\\n');temporary.replace(target)\nprint('ANDROID_CAPACITY_PREFLIGHT '+json.dumps(record,sort_keys=True),flush=True)\nsys.exit(0 if passed else 1)\n"
jobs:
  native_timezone_probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 16
    - name: Restore exact historical source baselines without checkout
      run: python3 tools/browser/prepare_baselines.py
    - name: Verify pinned network core and source patch
      run: 'python3 tests/gecko_prepare_image_test.py

        python3 tests/gecko_platform_tools_test.py

        python3 tests/gecko_native_adb_setup_test.py

        python3 tests/gecko_annotation_download_test.py

        python3 tests/gecko_ci_publish_test.py

        python3 tests/gecko_source_route_logcat_test.py

        python3 -m unittest discover -s tests -p ''gecko_experience*_test.py''

        python3 tools/build-mihomo.py --verify

        '
    - name: Prepare locked toolchain
      shell: bash
      run: 'set -euo pipefail

        echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

        echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"

        echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

        mkdir -p work/gecko-integration

        "$JAVA_HOME_17_X64/bin/keytool" -genkeypair -keystore work/gecko-integration/integration-test.jks -alias androiddebugkey -storepass android -keypass android -dname CN=SyntheticIntegration -keyalg RSA -validity 2

        curl -fsSL --retry 3 https://services.gradle.org/distributions/gradle-9.8.0-bin.zip -o work/gecko-integration/gradle.zip

        echo ''bafd5ce9cfaea0fbccfdc8439a1ac42fbd4cd9c89dc9a988228d8a2639a58e6c  work/gecko-integration/gradle.zip'' | sha256sum -c -

        unzip -q work/gecko-integration/gradle.zip -d work/gecko-integration/gradle

        curl -fsSL --retry 3 https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/157.0.20261005135250/geckoview-157.0.20261005135250.aar -o work/gecko-integration/geckoview.aar

        echo ''15f1edf3c58abcdaf2783f299b8c19c3a36272d348969106a9009671fef8d268  work/gecko-integration/geckoview.aar'' | sha256sum -c -

        curl -fsSL --retry 3 https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/157.0.20261005135250/geckoview-157.0.20261005135250.pom -o work/gecko-integration/geckoview.pom

        curl -fsSL --retry 3 https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/157.0.20261005135250/geckoview-157.0.20261005135250-sources.jar -o work/gecko-integration/geckoview-sources.jar

        python3 tools/gecko/verify_official_sdk.py --aar work/gecko-integration/geckoview.aar --pom work/gecko-integration/geckoview.pom --sources work/gecko-integration/geckoview-sources.jar --upstream-only

        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ''platforms;android-37.1'' ''build-tools;37.0.0''

        export JAVA_HOME="$JAVA_HOME_17_X64"

        python3 tools/gecko/run_key_order_host.py | tee work/gecko-integration/key-order-host-results.json

        python3 tools/gecko/run_reply_handoff_host.py --upstream-sources work/gecko-integration/geckoview-sources.jar | tee work/gecko-integration/reply-handoff-host-results.json

        python3 tools/gecko/caret_workflow.py prepare --work work/gecko-integration

        '
    - name: Compile release and native regression package
      run: 'set -euo pipefail

        python3 tools/gecko/generate_appearance_fixture.py

        work/gecko-integration/gradle/gradle-9.8.0/bin/gradle :app:assembleRelease :app:assembleIntegration :app:writeCaretResolvedArtifacts -PtestSigningKey="$PWD/work/gecko-integration/integration-test.jks" --console=plain 2>&1 | tee work/gecko-integration/build.log

        python3 tools/gecko/verify_official_sdk.py --aar work/gecko-integration/geckoview.aar --pom work/gecko-integration/geckoview.pom --sources work/gecko-integration/geckoview-sources.jar --upstream-only | tee work/gecko-integration/official-sdk-verification.json

        python3 tools/gecko/caret_workflow.py record --work work/gecko-integration

        python3 tools/gecko/check_safe_idle_trust.py --integration-apk app/build/outputs/apk/integration/app-x86_64-integration.apk | tee work/gecko-integration/network-safe-idle-trust-host-results.json

        python3 - <<''PYCODE''

        import json,pathlib,subprocess

        path=pathlib.Path(''work/gecko-integration/network-safe-idle-trust-host-results.json'')

        report=json.loads(path.read_text()); report[''sourceCommit'']=subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip()

        path.write_text(json.dumps(report,indent=2)+''\n'')

        PYCODE

        '
    - name: Preserve exact public derived SDK classpath for independent actual API compilation
      shell: bash
      run: "set -euo pipefail\nmkdir -p work/native-timezone-probe-host\npython3 - <<'PYCODE'\nimport hashlib,json,os,pathlib,subprocess,zipfile\nroot=pathlib.Path('work/native-timezone-probe-host')\nreceipt=pathlib.Path('work/native-caret-sdk/sdk-build-receipt.json')\nr=json.loads(receipt.read_bytes())\nassert r['sourceCommit']==os.environ['GITHUB_SHA']\nassert r['sourceTree']==subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()\nassert r['runId']==os.environ['GITHUB_RUN_ID'] and r['runAttempt']==os.environ['GITHUB_RUN_ATTEMPT']\na=pathlib.Path('work/native-caret-sdk/geckoview-caret.aar')\nwith zipfile.ZipFile(a) as archive:\n    assert archive.namelist().count('classes.jar')==1\n    item=archive.getinfo('classes.jar')\n    assert 0<item.file_size<24*1024*1024\n    raw=archive.read(item)\nassert len(raw)==item.file_size and hashlib.sha256(raw).hexdigest()==r['sdkClassesJarSha256']\n(root/'sdk-classes.jar').write_bytes(raw)\n(root/'sdk-classpath.json').write_text(json.dumps(dict(schema=1,status='passed',sourceCommit=r['sourceCommit'],sourceTree=r['sourceTree'],runId=r['runId'],runAttempt=r['runAttempt'],sdkClassesJarSha256=r['sdkClassesJarSha256'],sdkClassesJarBytes=len(raw),sdkBuildReceiptSha256=hashlib.sha256(receipt.read_bytes()).hexdigest(),actualAndroidExecution=False,keyRead=False,scope='Exact\
        \ classes.jar extracted from the actual full Gradle resolved derived SDK; native runtime tests are separate.'),indent=2)+chr(10))\nPYCODE\n"
    - name: Require probe-only sources, worker measurement and production exclusion controls
      run: 'set -euo pipefail

        python3 tests/native_timezone_probe_test.py

        python3 tests/gecko/native_timezone_api_contract.py

        node --check tests/gecko/assets/native-timezone-extension/parent.js

        node --check tests/gecko/assets/native-timezone-extension/background.js

        node --check tests/gecko/assets/native-timezone-extension/content.js

        node --check tests/gecko/assets/native-timezone-probe.js

        python3 tests/native_timezone_probe_test.py --check-packages --integration-apk app/build/outputs/apk/integration/app-x86_64-integration.apk --release-apk app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk --aapt2 "$ANDROID_HOME/build-tools/37.0.0/aapt2" --output work/native-timezone-probe-host/package-separation.json

        '
    - name: Prepare Android runtime only
      shell: bash
      run: 'set -euo pipefail

        echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

        echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"

        echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ''platforms;android-37.1'' ''build-tools;37.0.0''

        python3 tools/gecko/prepare_android_image.py --component emulator --sdk-root "$ANDROID_HOME" --cache work/android-image --report work/gecko-integration/android-emulator-package-results.json

        python3 tools/gecko/prepare_android_image.py --sdk-root "$ANDROID_HOME" --cache work/android-image --report work/gecko-integration/android-system-image-results.json

        '
    - name: Boot real API35 for diagnostic native timezone observations
      id: android_boot
      shell: bash
      run: 'set -euo pipefail

        exec > >(tee work/gecko-integration/native-test.log) 2>&1

        export ANDROID_AVD_HOME="$PWD/work/gecko-integration/avd"

        export ANDROID_USER_HOME="$PWD/work/gecko-integration/android-user"

        export ANDROID_EMULATOR_HOME="$PWD/work/gecko-integration/emulator-home"

        mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME" "$ANDROID_EMULATOR_HOME"

        sudo chmod a+rw /dev/kvm

        echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force -n geckoproduction -p "$ANDROID_AVD_HOME/geckoproduction.avd" -k ''system-images;android-35;google_apis;x86_64''

        python3 tools/gecko/prepare_platform_tools.py --sdk-root "$ANDROID_HOME" --cache work/android-image --report work/gecko-integration/android-platform-tools-results.json

        adb start-server

        python3 -c "$ANDROID_CAPACITY_PREFLIGHT" host ''native-timezone''

        "$ANDROID_HOME/emulator/emulator" -avd geckoproduction -no-window -no-audio -no-snapshot -no-boot-anim -no-metrics -accel on -port 5556 -gpu swiftshader -memory 3072 -cores 4 -qemu -monitor "unix:$PWD/work/gecko-integration/qemu-monitor.sock,server=on,wait=off" > work/gecko-integration/emulator.log 2>&1 &

        timeout 180 adb -s emulator-5556 wait-for-device

        timeout 300 bash -c ''until [ "$(adb -s emulator-5556 shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done''

        adb -s emulator-5556 shell input keyevent 82

        adb -s emulator-5556 install app/build/outputs/apk/integration/app-x86_64-integration.apk

        python3 tools/gecko/prepare_native_adb.py --adb "$(command -v adb)" --apk app/build/outputs/apk/integration/app-x86_64-integration.apk --monitor "$PWD/work/gecko-integration/qemu-monitor.sock"

        echo "ANDROID_SERIAL=emulator-5554" >> "$GITHUB_ENV"

        python3 tools/gecko/prepare_emulator.py --adb "$(command -v adb)" --serial emulator-5554 --apk app/build/outputs/apk/integration/app-x86_64-integration.apk

        python3 tools/gecko/isolate_emulator_background.py --adb "$(command -v adb)" --serial emulator-5554 --apk app/build/outputs/apk/integration/app-x86_64-integration.apk

        python3 -c "$ANDROID_CAPACITY_PREFLIGHT" guest ''native-timezone''

        '
    - name: Observe native page and worker timezones without modifying system time or Date APIs
      run: python3 tools/gecko/run_native_timezone_probe.py --adb "$(command -v adb)" --serial emulator-5554 --output work/native-timezone-probe
    - name: Bound allowlisted public diagnostic artifact bytes
      if: always()
      shell: bash
      run: 'python3 - <<''PYCODE''

        import pathlib

        patterns=[''work/native-timezone-probe/*.json'',''work/native-timezone-probe-host/*.json'',''work/native-timezone-probe-host/sdk-classes.jar'',''work/gecko-integration/caret-apk-build-receipt.json'',''work/gecko-integration/official-sdk-verification.json'',''work/native-caret-sdk/sdk-build-receipt.json'',''work/gecko-integration/android-*-results.json'',''work/gecko-integration/android-capacity-*.json'']

        files={p for pattern in patterns for p in pathlib.Path(''.'').glob(pattern) if p.is_file()}

        assert all(not p.is_symlink() and p.suffix in (''.json'',''.jar'') for p in files)

        assert len(files)<=128 and sum(p.stat().st_size for p in files)<31*1024*1024

        PYCODE

        '
      id: artifact_bound
    - name: Preserve only source-bound diagnostic JSON and SDK input receipts
      if: always() && steps.artifact_bound.outcome == 'success'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: native-timezone-probe-${{ github.run_id }}-${{ github.run_attempt }}
        path: 'work/native-timezone-probe/*.json

          work/native-timezone-probe-host/*.json

          work/gecko-integration/caret-apk-build-receipt.json

          work/gecko-integration/official-sdk-verification.json

          work/native-caret-sdk/sdk-build-receipt.json

          work/gecko-integration/android-*-results.json

          work/gecko-integration/android-capacity-*.json

          work/native-timezone-probe-host/sdk-classes.jar

          '
        if-no-files-found: warn
        retention-days: 7
