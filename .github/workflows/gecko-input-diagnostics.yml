name: Gecko native-only input diagnostics
on:
  push:
    branches: [debug/gecko-ime-passive-1fb6]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gecko-input-passive-diagnostics
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare locked toolchain
        id: setup
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          mkdir -p work/gecko-input-diagnostics work/gecko-integration
          "$JAVA_HOME_17_X64/bin/keytool" -genkeypair -keystore work/gecko-input-diagnostics/integration-test.jks -alias androiddebugkey -storepass android -keypass android -dname CN=SyntheticIntegration -keyalg RSA -validity 2
          curl -fsSL --retry 3 https://services.gradle.org/distributions/gradle-9.8.0-bin.zip -o work/gecko-input-diagnostics/gradle.zip
          echo 'bafd5ce9cfaea0fbccfdc8439a1ac42fbd4cd9c89dc9a988228d8a2639a58e6c  work/gecko-input-diagnostics/gradle.zip' | sha256sum -c -
          unzip -q work/gecko-input-diagnostics/gradle.zip -d work/gecko-input-diagnostics/gradle
          curl -fsSL --retry 3 https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/157.0.20261005135250/geckoview-157.0.20261005135250.aar -o work/gecko-input-diagnostics/geckoview.aar
          echo '15f1edf3c58abcdaf2783f299b8c19c3a36272d348969106a9009671fef8d268  work/gecko-input-diagnostics/geckoview.aar' | sha256sum -c -
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.1' 'build-tools;37.0.0' 'emulator' 'system-images;android-35;google_apis;x86_64'
      - name: Compile the native integration package
        id: build
        shell: bash
        run: |
          set -euo pipefail
          work/gecko-input-diagnostics/gradle/gradle-9.8.0/bin/gradle :app:assembleIntegration -PtestSigningKey="$PWD/work/gecko-input-diagnostics/integration-test.jks" --console=plain --write-verification-metadata sha256 2>&1 | tee work/gecko-input-diagnostics/build.log
      - name: One native-only diagnostic trial with original input objects on Android 35
        id: gecko
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee work/gecko-input-diagnostics/input-test.log) 2>&1
          export ANDROID_AVD_HOME="$PWD/work/gecko-input-diagnostics/avd"
          export ANDROID_USER_HOME="$PWD/work/gecko-input-diagnostics/android-user"
          export ANDROID_EMULATOR_HOME="$PWD/work/gecko-input-diagnostics/emulator-home"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME" "$ANDROID_EMULATOR_HOME"
          sudo chmod a+rw /dev/kvm
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force -n geckoinput -p "$ANDROID_AVD_HOME/geckoinput.avd" -k 'system-images;android-35;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd geckoinput -no-window -no-audio -no-snapshot -no-boot-anim -no-metrics -accel on -port 5554 -gpu swiftshader -memory 3072 -cores 2 > work/gecko-input-diagnostics/emulator.log 2>&1 &
          timeout 180 adb -s emulator-5554 wait-for-device
          timeout 300 bash -c 'until [ "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
          adb -s emulator-5554 shell input keyevent 82
          adb -s emulator-5554 install app/build/outputs/apk/integration/app-x86_64-integration.apk
          checks_failed=0
          for trial in 1; do
            attempt="work/gecko-input-diagnostics/attempt-$trial"
            mkdir -p "$attempt"
            rm -f work/gecko-integration/gecko-performance-results.json work/gecko-integration/gecko-performance-failure-log.txt work/gecko-integration/gecko-performance-screen.png
            if python3 tests/gecko/run_gecko_performance.py --adb "$(command -v adb)" --serial emulator-5554 --native-input-diagnostics 2>&1 | tee "$attempt/runner.log"; then
              exit_code=0
            else
              exit_code=$?
              checks_failed=1
            fi
            for name in gecko-performance-results.json gecko-performance-failure-log.txt gecko-performance-screen.png gecko-performance-failure-screen.png gecko-performance-failure-ui.xml gecko-performance-failure-window.txt gecko-performance-failure-activity.txt gecko-native-ime-snapshot.log gecko-native-ime-snapshot.json gecko-native-ime-logcat.txt gecko-native-ime-logcat-diagnostic.json gecko-scroll-diagnostics.json gecko-scroll-diagnostic-log.json; do
              if [ -f "work/gecko-integration/$name" ]; then
                cp "work/gecko-integration/$name" "$attempt/$name"
              fi
            done
            adb -s emulator-5554 exec-out screencap -p > "$attempt/screen.png" || rm -f "$attempt/screen.png"
            python3 - "$attempt" "$exit_code" <<'PYCODE'
          import json, os, pathlib, subprocess, sys
          attempt=pathlib.Path(sys.argv[1])
          status={'sourceCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                  'runId':os.environ['GITHUB_RUN_ID'],'runAttempt':os.environ.get('GITHUB_RUN_ATTEMPT','1'),
                  'trial':int(attempt.name.removeprefix('attempt-')),'exitCode':int(sys.argv[2]),
                  'status':'passed' if sys.argv[2]=='0' else 'failed','diagnosticOnly':True,'releaseAcceptance':False,
                  'fixedTrialCount':1,
                  'instrumentation':'Native MOZ_LOG only; original DefaultDelegate/IC/client/listener/child retained; no Java input observer; native logging may affect timing'}
          (attempt/'status.json').write_text(json.dumps(status,indent=2)+'\n')
          PYCODE
          done
          if [ "$checks_failed" -ne 0 ]; then
            exit 1
          fi
      - name: Capture the final synthetic screen
        if: always()
        shell: bash
        run: |
          mkdir -p work/gecko-input-diagnostics
          if command -v adb >/dev/null && adb -s emulator-5554 get-state >/dev/null 2>&1; then
            adb -s emulator-5554 exec-out screencap -p > work/gecko-input-diagnostics/input-diagnostic-screen.png || rm -f work/gecko-input-diagnostics/input-diagnostic-screen.png
          fi
      - name: Publish diagnostic evidence only
        if: always()
        env:
          DIAGNOSTIC_SETUP_OUTCOME: ${{ steps.setup.outcome }}
          DIAGNOSTIC_BUILD_OUTCOME: ${{ steps.build.outcome }}
          DIAGNOSTIC_GECKO_OUTCOME: ${{ steps.gecko.outcome }}
        run: python3 tools/gecko/publish_input_diagnostics.py
