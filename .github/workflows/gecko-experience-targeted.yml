name: 'Diagnostic only: original UI, files and Chrome experience'
'on':
  push:
    branches:
    - diagnostic/gecko-experience-targeted-20261029
    paths:
    - .github/workflows/gecko-experience-targeted.yml
    - tools/gecko/generate_experience_targeted_workflow.py
    - tests/gecko_experience_targeted_workflow_test.py
permissions:
  contents: read
  actions: read
concurrency:
  group: gecko-experience-targeted-${{ github.ref }}
  cancel-in-progress: false
env:
  ANDROID_CAPACITY_PREFLIGHT: |
    import json,os,pathlib,re,subprocess,sys,time
    from fractions import Fraction
    def require(value,message):
        if not value:raise ValueError(message)
    mode,scope=sys.argv[1:]
    require(mode in ('host','guest') and re.fullmatch('[a-z0-9-]+',scope),'Invalid preflight scope')
    job=os.environ['GITHUB_JOB'];require(re.fullmatch('[a-z0-9_-]+',job),'Invalid actual job')
    target=pathlib.Path('work/gecko-integration')/('android-capacity-'+job+'-'+scope+'.json')
    record={'schema':1,'status':'failed','requestedGuestCpus':4,'scope':scope,'job':job,'mode':mode}
    passed=False
    try:
        identity={'sourceCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                  'sourceTree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
                  'runId':os.environ['GITHUB_RUN_ID'],'runAttempt':os.environ['GITHUB_RUN_ATTEMPT']}
        record.update(identity)
        require(identity['sourceCommit']==os.environ['GITHUB_SHA'] and re.fullmatch('[0-9a-f]{40}',identity['sourceTree']),'Actual source identity differs')
        require(identity['runId'].isdigit() and identity['runAttempt'].isdigit(),'Actual CI run identity required')
        if mode=='host':
            require(not target.exists() and not target.is_symlink(),'Repeated capacity preflight')
            affinity=sorted(os.sched_getaffinity(0))
            nproc=int(subprocess.check_output(['nproc'],text=True,timeout=5).strip())
            require(affinity and nproc>0,'Actual host CPU counts unavailable')
            record['host']={'affinityCpus':affinity,'nproc':nproc,'observedAtMonotonicNs':time.monotonic_ns()}
            unified=[line.split(':',2)[2] for line in pathlib.Path('/proc/self/cgroup').read_text().splitlines() if line.startswith('0::')]
            mounts=[line for line in pathlib.Path('/proc/self/mountinfo').read_text().splitlines() if ' - cgroup2 ' in line]
            record['host'].update(unifiedCgroups=unified,cgroup2Mounts=mounts)
            require(len(unified)==1 and len(mounts)==1,'Unambiguous cgroup v2 observation required')
            fields=mounts[0].split(' - ',1)[0].split();mount=pathlib.Path(fields[4]).resolve()
            current=pathlib.PurePosixPath(unified[0]);root=pathlib.PurePosixPath(fields[3])
            require(current.is_absolute() and '..' not in current.parts,'Unsupported actual cgroup path')
            relative=[current.relative_to('/')]
            if current.is_relative_to(root):relative.append(current.relative_to(root))
            candidates={(mount/path).resolve() for path in relative}
            candidates={path for path in candidates if path.is_relative_to(mount) and (path/'cgroup.procs').is_file()}
            require(len(candidates)==1,'Current cgroup cannot be resolved unambiguously')
            node=candidates.pop();limits=[];capacity=Fraction(min(len(affinity),nproc));observed=0
            record['host']['cpuMax']=limits
            while True:
                path=node/'cpu.max'
                try:
                    raw=path.read_text().strip();limits.append({'path':str(path),'raw':raw});quota,period=raw.split()
                    require(period.isdigit() and int(period)>0 and (quota=='max' or (quota.isdigit() and int(quota)>0)),'Invalid actual cpu.max')
                    if quota!='max':capacity=min(capacity,Fraction(int(quota),int(period)))
                    observed+=1
                except FileNotFoundError:limits.append({'path':str(path),'raw':None,'interfacePresent':False})
                if node==mount:break
                node=node.parent
            record['host'].update(unifiedCgroup=unified[0],cgroup2Mount=mounts[0],cpuMax=limits,
                                  visibleCapacityCeilingNumerator=capacity.numerator,visibleCapacityCeilingDenominator=capacity.denominator,
                                  capacityScope='Visible affinity/nproc/cgroup limits only; not idle CPUs or invisible outer quotas')
            require(observed>0,'Actual cgroup CPU quota observation unavailable')
            require(capacity>=4,'Host effective CPU capacity is below four; no fallback')
        else:
            previous=json.loads(target.read_text())
            require(previous['status']=='passed' and previous['scope']==scope and previous['job']==job,'Passed host observation missing')
            require(all(previous.get(key)==value for key,value in identity.items()),'Capacity source/run differs')
            record=previous;record['mode']='guest'
            raw=subprocess.check_output(['adb','-s','emulator-5554','shell','getconf','_NPROCESSORS_ONLN'],text=True,timeout=8).strip()
            record['guest']={'serial':'emulator-5554','getconf':'_NPROCESSORS_ONLN','raw':raw,
                             'observedAtMonotonicNs':time.monotonic_ns()}
            require(raw=='4','Actual native-ADB guest online CPU count is not four')
            record['guest']['onlineCpus']=4
        record['status']='passed';passed=True
    except BaseException as error:
        record.update(status='failed',errorType=type(error).__name__,error=str(error))
    if mode=='host' and (target.exists() or target.is_symlink()):
        print('ANDROID_CAPACITY_PREFLIGHT '+json.dumps(record,sort_keys=True),flush=True);sys.exit(1)
    target.parent.mkdir(parents=True,exist_ok=True)
    temporary=target.with_suffix('.partial');temporary.write_text(json.dumps(record,sort_keys=True)+'\n');temporary.replace(target)
    print('ANDROID_CAPACITY_PREFLIGHT '+json.dumps(record,sort_keys=True),flush=True)
    sys.exit(0 if passed else 1)
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Verify pinned network core and source patch
      run: |
        python3 tests/gecko_prepare_image_test.py
        python3 tests/gecko_platform_tools_test.py
        python3 tests/gecko_native_adb_setup_test.py
        python3 tests/gecko_annotation_download_test.py
        python3 tests/gecko_ci_publish_test.py
        python3 tests/gecko_source_route_logcat_test.py
        python3 -m unittest discover -s tests -p 'gecko_experience*_test.py'
        python3 tools/build-mihomo.py --verify
    - name: Prepare locked toolchain
      shell: bash
      run: |
        set -euo pipefail
        echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
        echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
        echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
        mkdir -p work/gecko-integration
        "$JAVA_HOME_17_X64/bin/keytool" -genkeypair -keystore work/gecko-integration/integration-test.jks -alias androiddebugkey -storepass android -keypass android -dname CN=SyntheticIntegration -keyalg RSA -validity 2
        curl -fsSL --retry 3 https://services.gradle.org/distributions/gradle-9.8.0-bin.zip -o work/gecko-integration/gradle.zip
        echo 'bafd5ce9cfaea0fbccfdc8439a1ac42fbd4cd9c89dc9a988228d8a2639a58e6c  work/gecko-integration/gradle.zip' | sha256sum -c -
        unzip -q work/gecko-integration/gradle.zip -d work/gecko-integration/gradle
        curl -fsSL --retry 3 https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/157.0.20261005135250/geckoview-157.0.20261005135250.aar -o work/gecko-integration/geckoview.aar
        echo '15f1edf3c58abcdaf2783f299b8c19c3a36272d348969106a9009671fef8d268  work/gecko-integration/geckoview.aar' | sha256sum -c -
        curl -fsSL --retry 3 https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/157.0.20261005135250/geckoview-157.0.20261005135250.pom -o work/gecko-integration/geckoview.pom
        curl -fsSL --retry 3 https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/157.0.20261005135250/geckoview-157.0.20261005135250-sources.jar -o work/gecko-integration/geckoview-sources.jar
        python3 tools/gecko/verify_official_sdk.py --aar work/gecko-integration/geckoview.aar --pom work/gecko-integration/geckoview.pom --sources work/gecko-integration/geckoview-sources.jar --upstream-only
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.1' 'build-tools;37.0.0'
        export JAVA_HOME="$JAVA_HOME_17_X64"
        python3 tools/gecko/run_key_order_host.py | tee work/gecko-integration/key-order-host-results.json
        python3 tools/gecko/run_reply_handoff_host.py --upstream-sources work/gecko-integration/geckoview-sources.jar | tee work/gecko-integration/reply-handoff-host-results.json
        python3 tools/gecko/caret_workflow.py prepare --work work/gecko-integration
    - name: Compile release and native regression package
      run: |
        set -euo pipefail
        python3 tools/gecko/generate_appearance_fixture.py
        work/gecko-integration/gradle/gradle-9.8.0/bin/gradle :app:assembleRelease :app:assembleIntegration :app:writeCaretResolvedArtifacts -PtestSigningKey="$PWD/work/gecko-integration/integration-test.jks" --console=plain 2>&1 | tee work/gecko-integration/build.log
        python3 tools/gecko/verify_official_sdk.py --aar work/gecko-integration/geckoview.aar --pom work/gecko-integration/geckoview.pom --sources work/gecko-integration/geckoview-sources.jar --upstream-only | tee work/gecko-integration/official-sdk-verification.json
        python3 tools/gecko/caret_workflow.py record --work work/gecko-integration
        python3 tools/gecko/check_safe_idle_trust.py --integration-apk app/build/outputs/apk/integration/app-x86_64-integration.apk | tee work/gecko-integration/network-safe-idle-trust-host-results.json
        python3 - <<'PYCODE'
        import json,pathlib,subprocess
        path=pathlib.Path('work/gecko-integration/network-safe-idle-trust-host-results.json')
        report=json.loads(path.read_text()); report['sourceCommit']=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
        path.write_text(json.dumps(report,indent=2)+'\n')
        PYCODE
      id: diagnostic_compile
    - name: Stage current original-page UI for visual acceptance
      run: python3 tools/gecko/build_ui_baseline.py --gradle work/gecko-integration/gradle/gradle-9.8.0/bin/gradle --key "$PWD/work/gecko-integration/integration-test.jks"
    - name: Check stale messages and continuous bridge use
      run: |
        set -euo pipefail
        mkdir -p work/gecko-integration/appearance-palette
        javac -encoding UTF-8 -d work/gecko-integration/appearance-palette app/src/main/java/local/pocketchat/AppearanceColors.java tests/browser-runtime/AppearancePaletteTest.java
        java -cp work/gecko-integration/appearance-palette local.pocketchat.AppearancePaletteTest | tee work/gecko-integration/appearance-palette-host-results.json
        mkdir -p work/gecko-integration/bridge-host
        javac -encoding UTF-8 -d work/gecko-integration/bridge-host app/src/main/java/local/pocketchat/BrowserBridgeRequests.java tests/browser-runtime/BrowserBridgeRequestsTest.java
        java -cp work/gecko-integration/bridge-host local.pocketchat.BrowserBridgeRequestsTest | tee work/gecko-integration/bridge-host-results.json
        mkdir -p work/gecko-integration/reading-host
        javac -encoding UTF-8 -d work/gecko-integration/reading-host app/src/main/java/local/pocketchat/BrowserDisplay.java app/src/main/java/local/pocketchat/BrowserReadingPolicy.java app/src/main/java/local/pocketchat/BrowserReading.java tests/browser-reading-host/android/os/SystemClock.java tests/browser-reading-host/android/view/MotionEvent.java tests/browser-reading-host/local/pocketchat/ChatSession.java tests/browser-reading-host/local/pocketchat/BrowserReadingHostTest.java tests/browser-reading-host/local/pocketchat/BrowserReadingFocusScript.java
        java -cp work/gecko-integration/reading-host local.pocketchat.BrowserReadingHostTest | tee work/gecko-integration/reading-host-results.json
        node tests/browser-runtime/session-cookies.test.cjs | tee work/gecko-integration/cookie-host-results.json
        mkdir -p work/gecko-integration/region-host
        javac -encoding UTF-8 -d work/gecko-integration/region-host app/src/main/java/local/pocketchat/NodeRegion.java tests/browser-runtime/NodeRegionTest.java
        java -cp work/gecko-integration/region-host local.pocketchat.NodeRegionTest | tee work/gecko-integration/region-host-results.json
        mkdir -p work/gecko-integration/update-host
        javac -encoding UTF-8 -d work/gecko-integration/update-host app/src/main/java/local/pocketchat/Sha256.java app/src/main/java/local/pocketchat/AppUpdatePolicy.java tests/browser-runtime/AppUpdatePolicyTest.java
        java -cp work/gecko-integration/update-host local.pocketchat.AppUpdatePolicyTest | tee work/gecko-integration/update-host-results.json
        javac --add-modules jdk.httpserver -encoding UTF-8 -d work/gecko-integration/update-host app/src/main/java/local/pocketchat/Sha256.java app/src/main/java/local/pocketchat/AppUpdatePolicy.java app/src/main/java/local/pocketchat/AppUpdateTransfer.java tests/browser-runtime/AppUpdateTransferTest.java tests/browser-runtime/AppUpdateParallelTest.java
        java --add-modules jdk.httpserver -cp work/gecko-integration/update-host local.pocketchat.AppUpdateTransferTest | tee work/gecko-integration/update-transfer-host-results.json
        java --add-modules jdk.httpserver -cp work/gecko-integration/update-host local.pocketchat.AppUpdateParallelTest | tee work/gecko-integration/update-parallel-host-results.json
        mkdir -p work/gecko-integration/snapshot-host
        javac -encoding UTF-8 -d work/gecko-integration/snapshot-host app/src/main/java/local/pocketchat/FileSnapshotCache.java tests/browser-runtime/FileSnapshotCacheTest.java
        java -cp work/gecko-integration/snapshot-host local.pocketchat.FileSnapshotCacheTest | tee work/gecko-integration/snapshot-host-results.json
        npm install --prefix work/browser-perf-host --ignore-scripts --no-audit --no-fund jsdom@26.1.0
        JSDOM_MODULE="$PWD/work/browser-perf-host/node_modules/jsdom" node --test tests/appearance_lifecycle_test.cjs
        java -cp work/gecko-integration/reading-host local.pocketchat.BrowserReadingFocusScript > work/gecko-integration/reading-focus.js
        python3 tools/gecko/run_resource_observer_host.py --jsdom-module "$PWD/work/browser-perf-host/node_modules/jsdom" --output work/gecko-integration/resource-observer-host-results.json
        JSDOM_MODULE="$PWD/work/browser-perf-host/node_modules/jsdom" node tests/browser-reading-focus.cjs work/gecko-integration/reading-focus.js | tee work/gecko-integration/reading-focus-host-results.json
        JSDOM_MODULE="$PWD/work/browser-perf-host/node_modules/jsdom" node tests/browser-runtime/reply-observation.test.cjs | tee work/gecko-integration/reply-observation-host-results.json
        JSDOM_MODULE="$PWD/work/browser-perf-host/node_modules/jsdom" node tests/browser-runtime/reply-binding-loading.test.cjs | tee work/gecko-integration/reply-binding-host-results.json
        JSDOM_MODULE="$PWD/work/browser-perf-host/node_modules/jsdom" node tests/browser-runtime/interaction-scheduling.test.cjs | tee work/gecko-integration/interaction-host-results.json
        mkdir -p work/gecko-integration/browser-policy-host
        javac -encoding UTF-8 -d work/gecko-integration/browser-policy-host app/src/main/java/local/pocketchat/BrowserRuntimePolicy.java tests/browser-runtime/BrowserRuntimePolicyTest.java
        java -cp work/gecko-integration/browser-policy-host local.pocketchat.BrowserRuntimePolicyTest "$PWD" | tee work/gecko-integration/browser-runtime-policy-host-results.json
        JSDOM_MODULE="$PWD/work/browser-perf-host/node_modules/jsdom" node tests/browser-runtime/original-website-policy.test.cjs | tee work/gecko-integration/original-website-policy-host-results.json
        JSDOM_MODULE="$PWD/work/browser-perf-host/node_modules/jsdom" node tests/browser-runtime/continuity-driver-adapter.test.cjs | tee work/gecko-integration/continuity-driver-adapter-host-results.json
        mkdir -p work/gecko-integration/network-policy-host
        javac -encoding UTF-8 -d work/gecko-integration/network-policy-host app/src/main/java/local/pocketchat/NetworkPoolIdentity.java tests/browser-runtime/NetworkPoolIdentityTest.java app/src/main/java/local/pocketchat/LatencyProbePolicy.java tests/browser-runtime/LatencyProbePolicyTest.java
        java -cp work/gecko-integration/network-policy-host local.pocketchat.NetworkPoolIdentityTest | tee work/gecko-integration/network-pool-host-results.json
        java -cp work/gecko-integration/network-policy-host local.pocketchat.LatencyProbePolicyTest | tee work/gecko-integration/latency-probe-host-results.json
        python3 - <<'PYCODE'
        import json,pathlib,subprocess
        source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
        for name in ['network-pool-host-results.json','latency-probe-host-results.json','browser-runtime-policy-host-results.json','original-website-policy-host-results.json','continuity-driver-adapter-host-results.json','reading-host-results.json','reading-focus-host-results.json']:
            path=pathlib.Path('work/gecko-integration')/name
            report=json.loads(path.read_text())
            report['sourceCommit']=source
            path.write_text(json.dumps(report,indent=2)+'\n')
        PYCODE
