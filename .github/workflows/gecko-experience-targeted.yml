    if: github.ref == 'refs/heads/diagnostic/gecko-experience-targeted-20261029' && github.run_attempt == 1
    name: Diagnostic experience build (no release acceptance)
  android:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        phase:
        - ui
        - files
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Download the immutable compiled build
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
      with:
        name: experience-targeted-gecko-${{ github.run_id }}-${{ github.run_attempt }}-build
        path: work/ci-build
    - name: Restore exact build and verify its source/run/byte hashes
      run: python3 tools/gecko/ci_bundle.py restore --kind build --bundle work/ci-build/bundle.tar.gz
    - name: Prepare Android runtime only
      shell: bash
      run: |
        set -euo pipefail
        echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
        echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
        echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.1' 'build-tools;37.0.0'
        python3 tools/gecko/prepare_android_image.py --component emulator --sdk-root "$ANDROID_HOME" --cache work/android-image --report work/gecko-integration/android-emulator-package-results.json
        python3 tools/gecko/prepare_android_image.py --sdk-root "$ANDROID_HOME" --cache work/android-image --report work/gecko-integration/android-system-image-results.json
    - name: Boot Android for native acceptance
      id: android_boot
      shell: bash
      run: |
        set -euo pipefail
        exec > >(tee work/gecko-integration/native-test.log) 2>&1
        export ANDROID_AVD_HOME="$PWD/work/gecko-integration/avd"
        export ANDROID_USER_HOME="$PWD/work/gecko-integration/android-user"
        export ANDROID_EMULATOR_HOME="$PWD/work/gecko-integration/emulator-home"
        mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME" "$ANDROID_EMULATOR_HOME"
        sudo chmod a+rw /dev/kvm
        echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force -n geckoproduction -p "$ANDROID_AVD_HOME/geckoproduction.avd" -k 'system-images;android-35;google_apis;x86_64'
        python3 tools/gecko/prepare_platform_tools.py --sdk-root "$ANDROID_HOME" --cache work/android-image --report work/gecko-integration/android-platform-tools-results.json
        adb start-server
        python3 -c "$ANDROID_CAPACITY_PREFLIGHT" host '${{ matrix.phase }}'
        "$ANDROID_HOME/emulator/emulator" -avd geckoproduction -no-window -no-audio -no-snapshot -no-boot-anim -no-metrics -accel on -port 5556 -gpu swiftshader -memory 3072 -cores 4 -qemu -monitor "unix:$PWD/work/gecko-integration/qemu-monitor.sock,server=on,wait=off" > work/gecko-integration/emulator.log 2>&1 &
        timeout 180 adb -s emulator-5556 wait-for-device
        timeout 300 bash -c 'until [ "$(adb -s emulator-5556 shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
        adb -s emulator-5556 shell input keyevent 82
        adb -s emulator-5556 install app/build/outputs/apk/integration/app-x86_64-integration.apk
        python3 tools/gecko/prepare_native_adb.py --adb "$(command -v adb)" --apk app/build/outputs/apk/integration/app-x86_64-integration.apk --monitor "$PWD/work/gecko-integration/qemu-monitor.sock"
        echo "ANDROID_SERIAL=emulator-5554" >> "$GITHUB_ENV"
        python3 tools/gecko/prepare_emulator.py --adb "$(command -v adb)" --serial emulator-5554 --apk app/build/outputs/apk/integration/app-x86_64-integration.apk
        python3 tools/gecko/isolate_emulator_background.py --adb "$(command -v adb)" --serial emulator-5554 --apk app/build/outputs/apk/integration/app-x86_64-integration.apk
        python3 -c "$ANDROID_CAPACITY_PREFLIGHT" guest '${{ matrix.phase }}'
    - name: Verify network performance and compact chrome
      shell: bash
      run: |
        set -euo pipefail
        exec > >(tee -a work/gecko-integration/native-test.log) 2>&1
        echo "Starting phase: Verify network performance and compact chrome"
        checks_failed=0
        if ! python3 tests/gecko/run_network_performance.py --adb "$(command -v adb)" --serial emulator-5554; then
          checks_failed=1
        fi
        if ! python3 tests/gecko/run_quiet_notifications.py --adb "$(command -v adb)" --serial emulator-5554; then
          checks_failed=1
        fi
        if ! GITHUB_ACTIONS=false python3 tests/gecko/run_ui_visuals.py --adb "$(command -v adb)" --serial emulator-5554; then
          checks_failed=1
        fi
        if [ "$checks_failed" -ne 0 ]; then exit 1; fi
      if: ${{ matrix.phase == 'ui' }}
      id: diagnostic_ui
    - name: Verify editing on a clean Android device
      id: editing
      shell: bash
      run: |
        set -euo pipefail
        exec > >(tee -a work/gecko-integration/native-test.log) 2>&1
        adb shell am force-stop local.pocketchat.test
        adb shell pm clear local.pocketchat.test
        adb shell pm grant local.pocketchat.test android.permission.POST_NOTIFICATIONS
        checks_failed=0
        if python3 tools/gecko/run_caret_editing_phase.py --adb "$(command -v adb)" --serial emulator-5554 --root "$PWD" --out work/gecko-integration --build-receipt work/gecko-integration/caret-apk-build-receipt.json --sdk-receipt work/native-caret-sdk/sdk-build-receipt.json --sdk-aar work/native-caret-sdk/geckoview-caret.aar --official-sdk-aar work/gecko-integration/geckoview.aar --integration-apk app/build/outputs/apk/integration/app-x86_64-integration.apk --release-apk app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk; then
          :
        else
          editing_status=$?
          # Only an ordinary fixture failure after verified HOME restoration
          # may continue collecting the remaining independent evidence.
          if [ "$editing_status" -ne 1 ]; then exit "$editing_status"; fi
          checks_failed=1
        fi
        # An ordinary input fixture failure remains a failed qualification,
        # but must not prevent independent UI/network evidence collection.
        if [ "$checks_failed" -ne 0 ]; then echo 'fixture_failed=true' >> "$GITHUB_OUTPUT"; fi
      if: ${{ matrix.phase == 'editing' }}
    - name: Verify network sharing and explicit import UI
      if: ${{ !cancelled() && matrix.phase == 'ui' && steps.android_boot.outcome == 'success' }}
      shell: bash
      run: |
        set -euo pipefail
        exec > >(tee -a work/gecko-integration/native-test.log) 2>&1
        echo "Starting phase: Verify network sharing and explicit import UI"
        adb shell am force-stop local.pocketchat.test
        adb shell pm clear local.pocketchat.test
        adb shell pm grant local.pocketchat.test android.permission.POST_NOTIFICATIONS
        result=0
        python3 tests/gecko/run_network_sharing.py --adb "$(command -v adb)" --serial emulator-5554 || result=$?
        exit "$result"
      id: diagnostic_sharing
    - name: Verify system and manual appearance without recreation
      shell: bash
      run: |
        set -euo pipefail
        exec > >(tee -a work/gecko-integration/native-test.log) 2>&1
        result=0
        python3 tests/gecko/run_appearance.py --adb "$(command -v adb)" --serial emulator-5554 || result=$?
        exit "$result"
      if: ${{ !cancelled() && matrix.phase == 'ui' && steps.android_boot.outcome == 'success' }}
      id: diagnostic_appearance
    - name: Verify webpage appearance receipts through the actual Gecko bridge
      shell: bash
      run: |
        set -euo pipefail
        exec > >(tee -a work/gecko-integration/native-test.log) 2>&1
        result=0
        python3 tools/gecko/generate_appearance_fixture.py
        python3 tools/gecko/generate_appearance_fixture.py --verify
        python3 tests/gecko/run_appearance_web.py --adb "$(command -v adb)" --serial emulator-5554 --apk app/build/outputs/apk/integration/app-x86_64-integration.apk || result=$?
        exit "$result"
      if: ${{ !cancelled() && matrix.phase == 'ui' && steps.android_boot.outcome == 'success' }}
      id: diagnostic_web_appearance
    - name: Verify production environments and file transfers
      shell: bash
      run: |
        set -euo pipefail
        exec > >(tee -a work/gecko-integration/native-test.log) 2>&1
        echo "Starting phase: Verify production environments and file transfers"
        checks_failed=0
        adb shell am force-stop local.pocketchat.test
        adb shell pm clear local.pocketchat.test
        if ! python3 tests/gecko/run_device.py --adb "$(command -v adb)" --serial emulator-5554 --reading-zoom-trace; then
          checks_failed=1
        fi
        adb exec-out screencap -p > work/gecko-integration/device-screen.png
        if ! python3 tests/gecko/run_update_route.py --adb "$(command -v adb)" --serial emulator-5554; then
          checks_failed=1
        fi
        if [ "$checks_failed" -ne 0 ]; then exit 1; fi
      if: ${{ matrix.phase == 'files' }}
      id: diagnostic_files
    - name: Verify browser connection reuse and preauthentication
      shell: bash
      run: |
        set -euo pipefail
        exec > >(tee -a work/gecko-integration/native-test.log) 2>&1
        echo "Starting phase: Verify browser connection reuse and preauthentication"
        checks_failed=0
        if ! python3 tests/gecko/run_native_probe.py --adb "$(command -v adb)" --serial emulator-5554; then
          checks_failed=1
        fi
        if ! python3 tests/gecko/run_ui_fixes.py --adb "$(command -v adb)" --serial emulator-5554; then
          checks_failed=1
        fi
        if ! python3 tests/gecko/run_gecko_pool.py --adb "$(command -v adb)" --serial emulator-5554; then
          checks_failed=1
        fi
        if ! python3 tests/gecko/run_preconnect.py --adb "$(command -v adb)" --serial emulator-5554; then
          checks_failed=1
        fi
        if ! python3 tests/gecko/run_network_client_binding.py --adb "$(command -v adb)" --serial emulator-5554; then
          checks_failed=1
        fi
        if [ "$checks_failed" -ne 0 ]; then exit 1; fi
      if: ${{ matrix.phase == 'connections' }}
    - name: Verify subscription storage and selection UI
      shell: bash
      run: |
        set -euo pipefail
        exec > >(tee -a work/gecko-integration/native-test.log) 2>&1
        echo "Starting phase: Verify subscription storage and selection UI"
        checks_failed=0
        if ! python3 tests/gecko/run_network_sources.py --adb "$(command -v adb)" --serial emulator-5554; then
          checks_failed=1
        fi
        if ! python3 tests/gecko/run_network_sources_ui.py --adb "$(command -v adb)" --serial emulator-5554 --expected-apk-sha "$(python3 -c 'import hashlib,pathlib;print(hashlib.sha256(pathlib.Path("app/build/outputs/apk/integration/app-x86_64-integration.apk").read_bytes()).hexdigest())')"; then
          checks_failed=1
        fi
        if [ "$checks_failed" -ne 0 ]; then exit 1; fi
      if: ${{ matrix.phase == 'connections' }}
    - name: Verify fixed-exit routing and deferred application
      shell: bash
      run: |
        set -euo pipefail
        exec > >(tee -a work/gecko-integration/native-test.log) 2>&1
        echo "Starting phase: Verify fixed-exit routing and deferred application"
        checks_failed=0
        if ! python3 tests/gecko/run_network_sources_route.py --adb "$(command -v adb)" --serial emulator-5554; then
          checks_failed=1
        fi
        if ! python3 tests/gecko/run_network_safe_idle.py --adb "$(command -v adb)" --serial emulator-5554 --expected-apk-sha "$(python3 -c 'import hashlib,pathlib;print(hashlib.sha256(pathlib.Path("app/build/outputs/apk/integration/app-x86_64-integration.apk").read_bytes()).hexdigest())')"; then
          checks_failed=1
        fi
        if [ "$checks_failed" -ne 0 ]; then exit 1; fi
      if: ${{ matrix.phase == 'connections' }}
    - name: Verify settings retries and exact external and internal application receipts
      if: ${{ !cancelled() && matrix.phase == 'connections' && steps.android_boot.outcome == 'success' }}
      shell: bash
      run: |
        set -euo pipefail
        exec > >(tee -a work/gecko-integration/native-test.log) 2>&1
        expected_apk_sha="$(python3 -c 'import hashlib,pathlib;print(hashlib.sha256(pathlib.Path("app/build/outputs/apk/integration/app-x86_64-integration.apk").read_bytes()).hexdigest())')"
        checks_failed=0
        for fixture in retry application internal; do
          if ! python3 "tests/gecko/run_network_settings_${fixture}.py" --adb "$(command -v adb)" --serial emulator-5554 --expected-apk-sha "$expected_apk_sha"; then
            checks_failed=1
          fi
        done
        if [ "$checks_failed" -ne 0 ]; then exit 1; fi
    - name: Verify environment templates and resource policy
      shell: bash
      run: |
        set -euo pipefail
        exec > >(tee -a work/gecko-integration/native-test.log) 2>&1
        echo "Starting phase: Verify environment templates and resource policy"
        checks_failed=0
        # Preserve the original input/performance baseline before new fixtures.
        if ! python3 tests/gecko/run_profile_features.py --adb "$(command -v adb)" --serial emulator-5554 --apk app/build/outputs/apk/integration/app-x86_64-integration.apk; then
          checks_failed=1
        fi
        if [ "$checks_failed" -ne 0 ]; then exit 1; fi
      if: ${{ matrix.phase == 'profiles' }}
    - name: Preserve emulator and runner health
      if: always()
      shell: bash
      run: |
        mkdir -p work/gecko-integration
        {
          date -u
          free -m
          ps -eo pid,comm,rss --sort=-rss | sed -n '1,20p'
          if [ -r /sys/fs/cgroup/memory.events ]; then cat /sys/fs/cgroup/memory.events; fi
        } > work/gecko-integration/runner-health.txt
    - name: Seal this Android phase evidence
      run: python3 tools/gecko/ci_bundle.py pack --kind phase --phase "${{ matrix.phase }}" --bundle work/ci-phase/bundle.tar.gz
      if: always()
    - name: Preserve source/run-bound phase evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: experience-targeted-gecko-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.phase }}
        path: work/ci-phase/bundle.tar.gz
        if-no-files-found: error
        retention-days: 1
        compression-level: 0
    - name: Preserve failed editing qualification
      if: ${{ always() && matrix.phase == 'editing' && steps.editing.outputs.fixture_failed == 'true' }}
      run: |
        echo 'Input compatibility fixture failed. Independent reports do not qualify this input behavior as passed.'
        exit 1
    - name: Declare diagnostic-only scope and original outcomes
      if: always()
      env:
        TARGETED_PHASE: ${{ matrix.phase }}
        JOB_STATUS: ${{ job.status }}
        BOOT_OUTCOME: ${{ steps.android_boot.outcome }}
        UI_OUTCOME: ${{ steps.diagnostic_ui.outcome }}
        SHARING_OUTCOME: ${{ steps.diagnostic_sharing.outcome }}
        APPEARANCE_OUTCOME: ${{ steps.diagnostic_appearance.outcome }}
        WEB_APPEARANCE_OUTCOME: ${{ steps.diagnostic_web_appearance.outcome }}
        FILES_OUTCOME: ${{ steps.diagnostic_files.outcome }}
      run: |
        python3 - <<'TARGETED_SCOPE'
        import hashlib,json,os,pathlib,re,subprocess
        root=pathlib.Path.cwd()
        source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
        tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
        assert source==os.environ['GITHUB_SHA'] and re.fullmatch('[0-9a-f]{40}',tree)
        assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
        assert os.environ['GITHUB_REF']=='refs/heads/diagnostic/gecko-experience-targeted-20261029'
        assert os.environ['GITHUB_RUN_ID'].isdigit() and os.environ['GITHUB_RUN_ATTEMPT']=='1'
        phase=os.environ['TARGETED_PHASE'];assert phase in ('ui', 'files')
        record=dict(schema=1,diagnosticOnly=True,applicationAcceptance=False,releaseAcceptance=False,
            protectionEffectivenessAcceptance=False,physicalPhoneAcceptance=False,qualification=False,
            sourceCommit=source,sourceTree=tree,runId=os.environ['GITHUB_RUN_ID'],runAttempt=os.environ['GITHUB_RUN_ATTEMPT'],
            job='android',phase=phase,referenceWorkflowSource='0ac8f6373a1398c9802bc7184084a3191ae2ae53',referenceWorkflowSha256='10e35f9884e6eac2ea2fc2e0e6d6f6d5d14c55dc7e776cd0128019c75ab3f2f5',
            derivedWorkflowSha256=hashlib.sha256((root/'.github/workflows/gecko-experience-targeted.yml').read_bytes()).hexdigest(),
            maximumOriginalWorkloadInvocations=1,readingZoomTraceRequested=('android'=='android' and phase=='files'),
            uiCheckpointPublisherSuppressedOnly=True,originalStepOutcomes={k:os.environ.get(k) for k in ('JOB_STATUS', 'BOOT_OUTCOME', 'UI_OUTCOME', 'SHARING_OUTCOME', 'APPEARANCE_OUTCOME', 'WEB_APPEARANCE_OUTCOME', 'FILES_OUTCOME')},
            scope='Targeted controlled-fixture diagnosis only. Workflow success does not establish all four VM outcomes or release acceptance; a separate complete formal cohort remains required.')
        path=root/'work/experience-targeted'/('android'+'-'+phase+'-scope.json');path.parent.mkdir(parents=True,exist_ok=True)
        path.write_text(json.dumps(record,sort_keys=True,indent=2)+'\n')
        print(json.dumps(record,sort_keys=True))
        TARGETED_SCOPE
    - name: Preserve diagnostic-only scope marker
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: experience-targeted-scope-${{ github.run_id }}-${{ github.run_attempt }}-android-${{ matrix.phase }}
        path: work/experience-targeted/android-${{ matrix.phase }}-scope.json
        if-no-files-found: error
        retention-days: 7
        compression-level: 6
    permissions:
      contents: read
      actions: read
    if: github.ref == 'refs/heads/diagnostic/gecko-experience-targeted-20261029' && github.run_attempt == 1
    name: Diagnostic experience (${{ matrix.phase }})
  chrome-diagnostic:
    name: Diagnostic experience Chrome (${{ matrix.scenario }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        scenario:
        - cold
        - after-reload
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Download the immutable compiled build
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
      with:
        name: experience-targeted-gecko-${{ github.run_id }}-${{ github.run_attempt }}-build
        path: work/ci-build
    - name: Restore exact build and verify its source/run/byte hashes
      run: python3 tools/gecko/ci_bundle.py restore --kind build --bundle work/ci-build/bundle.tar.gz
    - name: Prepare Android runtime only
      shell: bash
      run: |
        set -euo pipefail
        echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
        echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
        echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.1' 'build-tools;37.0.0'
        python3 tools/gecko/prepare_android_image.py --component emulator --sdk-root "$ANDROID_HOME" --cache work/android-image --report work/gecko-integration/android-emulator-package-results.json
        python3 tools/gecko/prepare_android_image.py --sdk-root "$ANDROID_HOME" --cache work/android-image --report work/gecko-integration/android-system-image-results.json
    - name: Boot Android for focused diagnostics
      id: android_boot
      shell: bash
      run: |
        set -euo pipefail
        exec > >(tee work/gecko-integration/native-test.log) 2>&1
        export ANDROID_AVD_HOME="$PWD/work/gecko-integration/avd"
        export ANDROID_USER_HOME="$PWD/work/gecko-integration/android-user"
        export ANDROID_EMULATOR_HOME="$PWD/work/gecko-integration/emulator-home"
        mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME" "$ANDROID_EMULATOR_HOME"
        sudo chmod a+rw /dev/kvm
        echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force -n geckoproduction -p "$ANDROID_AVD_HOME/geckoproduction.avd" -k 'system-images;android-35;google_apis;x86_64'
        python3 tools/gecko/prepare_platform_tools.py --sdk-root "$ANDROID_HOME" --cache work/android-image --report work/gecko-integration/android-platform-tools-results.json
        adb start-server
        python3 -c "$ANDROID_CAPACITY_PREFLIGHT" host '${{ matrix.scenario }}'
        "$ANDROID_HOME/emulator/emulator" -avd geckoproduction -no-window -no-audio -no-snapshot -no-boot-anim -no-metrics -accel on -port 5556 -gpu swiftshader -memory 3072 -cores 4 -qemu -monitor "unix:$PWD/work/gecko-integration/qemu-monitor.sock,server=on,wait=off" > work/gecko-integration/emulator.log 2>&1 &
        timeout 180 adb -s emulator-5556 wait-for-device
        timeout 300 bash -c 'until [ "$(adb -s emulator-5556 shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
        adb -s emulator-5556 shell input keyevent 82
        adb -s emulator-5556 install app/build/outputs/apk/integration/app-x86_64-integration.apk
        python3 tools/gecko/prepare_native_adb.py --adb "$(command -v adb)" --apk app/build/outputs/apk/integration/app-x86_64-integration.apk --monitor "$PWD/work/gecko-integration/qemu-monitor.sock"
        echo "ANDROID_SERIAL=emulator-5554" >> "$GITHUB_ENV"
        python3 tools/gecko/prepare_emulator.py --adb "$(command -v adb)" --serial emulator-5554 --apk app/build/outputs/apk/integration/app-x86_64-integration.apk
        python3 tools/gecko/isolate_emulator_background.py --adb "$(command -v adb)" --serial emulator-5554 --apk app/build/outputs/apk/integration/app-x86_64-integration.apk
        python3 -c "$ANDROID_CAPACITY_PREFLIGHT" guest '${{ matrix.scenario }}'
    - name: Diagnose original chrome collapse flow only
      id: focused
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p work/chrome-collapse-diagnostic
        exec > >(tee work/chrome-collapse-diagnostic/runner.log) 2>&1
        python3 tests/gecko/run_chrome_collapse_diagnostic.py --adb "$(command -v adb)" --serial emulator-5554 --scenario "${{ matrix.scenario }}" --out work/chrome-collapse-diagnostic
    - name: Preserve diagnostic job identity and outcome
      if: always()
      shell: bash
      env:
        CHROME_DIAGNOSTIC_SCENARIO: ${{ matrix.scenario }}
        CHROME_DIAGNOSTIC_BOOT_OUTCOME: ${{ steps.android_boot.outcome }}
        CHROME_DIAGNOSTIC_RUNNER_OUTCOME: ${{ steps.focused.outcome }}
      run: |
        python3 - <<'PYCODE'
        import hashlib,json,os,pathlib,subprocess
        out=pathlib.Path('work/chrome-collapse-diagnostic');out.mkdir(parents=True,exist_ok=True)
        build=pathlib.Path('work/gecko-integration/ci-build-index.json')
        boot=os.environ['CHROME_DIAGNOSTIC_BOOT_OUTCOME'];runner=os.environ['CHROME_DIAGNOSTIC_RUNNER_OUTCOME']
        status='passed' if boot==runner=='success' else ('failed' if 'failure' in (boot,runner) else 'incomplete')
        report=dict(schema=1,diagnosticOnly=True,releaseAcceptance=False,status=status,
          sourceCommit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
          sourceTree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
          runId=os.environ['GITHUB_RUN_ID'],runAttempt=os.environ.get('GITHUB_RUN_ATTEMPT','1'),
          scenario=os.environ['CHROME_DIAGNOSTIC_SCENARIO'],bootOutcome=boot,runnerOutcome=runner,
          buildIndexSha256=hashlib.sha256(build.read_bytes()).hexdigest() if build.is_file() else None,
          scope='One fresh Android VM per predeclared scenario; original full UI qualification remains independently required.')
        (out/'job-outcome.json').write_text(json.dumps(report,indent=2)+'\n')
        PYCODE
    - name: Upload focused chrome diagnostics only
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: experience-targeted-chrome-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.scenario }}
        path: |
          work/chrome-collapse-diagnostic/
          work/gecko-integration/ci-build-index.json
          work/gecko-integration/native-test.log
          work/gecko-integration/emulator.log
          work/gecko-integration/native-adb-setup-results.json
          work/gecko-integration/emulator-bootstrap-results.json
          work/gecko-integration/android-system-image-results.json
          work/gecko-integration/android-emulator-package-results.json
          work/gecko-integration/android-platform-tools-results.json
          work/gecko-integration/android-capacity-*.json
        if-no-files-found: error
        retention-days: 3
        compression-level: 6
    - name: Declare diagnostic-only scope and original outcomes
      if: always()
      env:
        TARGETED_PHASE: ${{ matrix.scenario }}
        JOB_STATUS: ${{ job.status }}
        BOOT_OUTCOME: ${{ steps.android_boot.outcome }}
        ORIGINAL_RUNNER_OUTCOME: ${{ steps.focused.outcome }}
      run: |
        python3 - <<'TARGETED_SCOPE'
        import hashlib,json,os,pathlib,re,subprocess
        root=pathlib.Path.cwd()
        source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
        tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
        assert source==os.environ['GITHUB_SHA'] and re.fullmatch('[0-9a-f]{40}',tree)
        assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
        assert os.environ['GITHUB_REF']=='refs/heads/diagnostic/gecko-experience-targeted-20261029'
        assert os.environ['GITHUB_RUN_ID'].isdigit() and os.environ['GITHUB_RUN_ATTEMPT']=='1'
        phase=os.environ['TARGETED_PHASE'];assert phase in ('cold', 'after-reload')
        record=dict(schema=1,diagnosticOnly=True,applicationAcceptance=False,releaseAcceptance=False,
            protectionEffectivenessAcceptance=False,physicalPhoneAcceptance=False,qualification=False,
            sourceCommit=source,sourceTree=tree,runId=os.environ['GITHUB_RUN_ID'],runAttempt=os.environ['GITHUB_RUN_ATTEMPT'],
            job='chrome-diagnostic',phase=phase,referenceWorkflowSource='0ac8f6373a1398c9802bc7184084a3191ae2ae53',referenceWorkflowSha256='10e35f9884e6eac2ea2fc2e0e6d6f6d5d14c55dc7e776cd0128019c75ab3f2f5',
            derivedWorkflowSha256=hashlib.sha256((root/'.github/workflows/gecko-experience-targeted.yml').read_bytes()).hexdigest(),
            maximumOriginalWorkloadInvocations=1,readingZoomTraceRequested=('chrome-diagnostic'=='android' and phase=='files'),
            uiCheckpointPublisherSuppressedOnly=True,originalStepOutcomes={k:os.environ.get(k) for k in ('JOB_STATUS', 'BOOT_OUTCOME', 'ORIGINAL_RUNNER_OUTCOME')},
            scope='Targeted controlled-fixture diagnosis only. Workflow success does not establish all four VM outcomes or release acceptance; a separate complete formal cohort remains required.')
        path=root/'work/experience-targeted'/('chrome-diagnostic'+'-'+phase+'-scope.json');path.parent.mkdir(parents=True,exist_ok=True)
        path.write_text(json.dumps(record,sort_keys=True,indent=2)+'\n')
        print(json.dumps(record,sort_keys=True))
        TARGETED_SCOPE
    - name: Preserve diagnostic-only scope marker
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: experience-targeted-scope-${{ github.run_id }}-${{ github.run_attempt }}-chrome-diagnostic-${{ matrix.scenario
          }}
        path: work/experience-targeted/chrome-diagnostic-${{ matrix.scenario }}-scope.json
        if-no-files-found: error
        retention-days: 7
        compression-level: 6
    if: github.ref == 'refs/heads/diagnostic/gecko-experience-targeted-20261029' && github.run_attempt == 1
