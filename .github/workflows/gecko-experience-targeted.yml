        echo 'dfb7bae2f404cfe0b72b4d23944698cb716b7665171812a0a4d0f5926c0fac79  work/gecko-integration/sharing-android-json.jar' | sha256sum -c -
        python3 tests/network-sharing-host/run.py --json-jar work/gecko-integration/sharing-android-json.jar --yaml-jar work/gecko-integration/sharing-yaml.jar
        python3 tests/gecko_ui_network_visual_fixture_test.py --java-home "$JAVA_HOME" --json-jar work/gecko-integration/catalog-json.jar --output work/gecko-integration/ui-network-visual-fixture-desktop-host-results.json
