name: Collect app feedback
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/feedback-triage.yml']
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Classify feedback without executing its content
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          from urllib.parse import quote
          with open(os.environ['GITHUB_EVENT_PATH']) as f:
              issue = json.load(f).get('issue')
          if issue and 'pull_request' in issue:
              raise SystemExit(0)
          title = issue.get('title', '') if issue else ''
          kind = '类型/问题' if title.startswith('[问题]') else '类型/建议' if title.startswith('[建议]') else None
          if issue and kind is None:
              raise SystemExit(0)
          # The issue body, links and attachments are never executed or fetched.
          base = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          def api(method, path, value=None):
              request = urllib.request.Request(base + path,
                  data=None if value is None else json.dumps(value).encode(), method=method,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                           'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          labels = [('类型/问题', 'd73a4a'), ('类型/建议', '0969da')] + [('状态/' + state, 'd4c5f9') for state in ['待筛选', '待补充', '已确认', '计划中', '处理中', '待验证', '已发布', '不采纳']]
          for name, color in labels:
              try:
                  api('GET', '/labels/' + quote(name, safe=''))
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
                  try:
                      api('POST', '/labels', {'name': name, 'color': color})
                  except urllib.error.HTTPError as race:
                      if race.code != 422:
                          raise
                      api('GET', '/labels/' + quote(name, safe=''))
          if not issue:
              raise SystemExit(0)
          api('POST', '/issues/' + str(int(issue['number'])) + '/labels',
              {'labels': [kind, '状态/待筛选']})
          PY
