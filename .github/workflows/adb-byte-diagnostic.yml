name: Validate TCP ADB on the actual guest WiFi network backend
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 10f650a4c0043edada7b865ae0845a6644ecdbcf
    - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
      with:
        name: gecko-39895680073-1-build
        run-id: 39895680073
        github-token: ${{ github.token }}
        path: work/adb-build
    - name: Extract only the selected APK for transfer diagnostics
      run: "python3 - <<'PY'\nimport hashlib,json,pathlib,tarfile\nout=pathlib.Path('work/adb-diagnostic');out.mkdir(parents=True,exist_ok=True)\nwith tarfile.open('work/adb-build/bundle.tar.gz')\
        \ as t:\n  index=json.load(t.extractfile('_ci_bundle.json'))\n  assert index['sourceCommit']=='10f650a4c0043edada7b865ae0845a6644ecdbcf' and index['runId']=='39895680073'\n\
        \  name='app/build/outputs/apk/integration/app-x86_64-integration.apk'\n  item=next(x for x in index['files'] if x['path']==name);raw=t.extractfile(name).read()\n\
        \  assert len(raw)==item['bytes'] and hashlib.sha256(raw).hexdigest()==item['sha256']\n  pathlib.Path('work/diagnostic.apk').write_bytes(raw);(out/'selected.json').write_text(json.dumps(item))\n\
        PY\n"
    - name: Prepare the unchanged stock Android runtime
      run: 'echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

        echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"

        echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

        python3 tools/gecko/prepare_android_image.py --component emulator --sdk-root "$ANDROID_HOME" --cache work/android-image --report work/adb-diagnostic/emulator.json

        python3 tools/gecko/prepare_android_image.py --sdk-root "$ANDROID_HOME" --cache work/android-image --report work/adb-diagnostic/image.json

        '
    - name: Boot the unchanged Android runtime
      run: "export ANDROID_AVD_HOME=\"$PWD/work/adb-avd\"\nexport ANDROID_USER_HOME=\"$PWD/work/adb-user\"\nexport ANDROID_EMULATOR_HOME=\"$PWD/work/adb-emulator-home\"\
        \nadb kill-server || true\nexport ADB_TRACE=auth\nadb start-server\nif command -v tcpdump >/dev/null; then\n  sudo tcpdump -i lo -n -tttt -l 'tcp\
        \ port 5037 and (tcp[tcpflags] & (tcp-fin|tcp-rst) != 0)' > work/adb-diagnostic/tcp-close.txt 2>&1 &\nfi\nmkdir -p \"$ANDROID_AVD_HOME\" \"$ANDROID_USER_HOME\"\
        \ \"$ANDROID_EMULATOR_HOME\"\nsudo chmod a+rw /dev/kvm\necho no | \"$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager\" create avd --force -n geckoproduction\
        \ -p \"$ANDROID_AVD_HOME/geckoproduction.avd\" -k 'system-images;android-35;google_apis;x86_64'\n\"$ANDROID_HOME/emulator/emulator\" -verbose -avd\
        \ geckoproduction -no-window -no-audio -no-snapshot -no-boot-anim -no-metrics -accel on -port 5556 -gpu swiftshader -memory 3072 -cores 2 -qemu\
        \ -set netdev.virtio-wifi.hostfwd=tcp:127.0.0.1:5555-10.0.2.16:5555 > work/adb-diagnostic/emulator.txt 2>&1 &\ntimeout 180 adb -s emulator-5556\
        \ wait-for-device\ntimeout 300 bash -c 'until [ \"$(adb -s emulator-5556 shell getprop sys.boot_completed | tr -d \"\\r\")\" = \"1\" ]; do sleep\
        \ 2; done'\npython3 - <<'PYNET'\nimport json,pathlib,subprocess,time\nout=pathlib.Path('work/adb-diagnostic/network-ready.json');rows=[];deadline=time.monotonic()+30\n\
        while time.monotonic()<deadline:\n row={}\n for label,parts in [('address',['ip','-4','-o','addr','show','wlan0']),('route',['ip','-4','route','get','10.0.2.2'])]:\n\
        \  r=subprocess.run(['adb','-s','emulator-5556','shell',*parts],capture_output=True,text=True,timeout=min(5,max(.01,deadline-time.monotonic())))\n\
        \  row[label]={'exitCode':r.returncode,'stdout':r.stdout,'stderr':r.stderr}\n rows.append(row)\n if 'inet 10.0.2.16/' in row['address']['stdout']\
        \ and row['route']['exitCode']==0 and 'dev wlan0' in row['route']['stdout']:break\n time.sleep(min(1,max(0,deadline-time.monotonic())))\nelse:\n\
        \ out.write_text(json.dumps({'ready':False,'observations':rows},indent=2));raise SystemExit('Guest WLAN address and return route did not become\
        \ ready')\nout.write_text(json.dumps({'ready':True,'observations':rows},indent=2))\nPYNET\nprintf '%s\\n' 'QEMU native WiFi netdev hostfwd: 127.0.0.1:5555\
        \ -> 10.0.2.16:5555' > work/adb-diagnostic/redirections.txt\npython3 - <<'PYADB'\nimport socket\nwith socket.create_connection(('127.0.0.1',5037),timeout=5)\
        \ as channel:\n    channel.sendall(b'0012host:emulator:5555')\nprint('Sent native ADB emulator announcement for actual forwarded TCP port 5555')\n\
        PYADB\ntimeout 30 adb -s emulator-5554 wait-for-device\nexport ANDROID_SERIAL=emulator-5554\nadb devices -l > work/adb-diagnostic/adb-devices.txt\n\
        adb shell input keyevent 82\nadb install work/diagnostic.apk\npython3 tools/gecko/prepare_emulator.py --adb \"$(command -v adb)\" --serial emulator-5554\
        \ --apk work/diagnostic.apk\n"
    - name: Observe fixed read-only transfers before any editing workload
      run: "python3 - <<'PYCODE'\nimport glob,hashlib,json,os,pathlib,shutil,subprocess,sys,time\nout=pathlib.Path('work/adb-diagnostic');selected=json.loads((out/'selected.json').read_text());adb=shutil.which('adb');base=[adb,'-s','emulator-5554']\n\
        installed=subprocess.check_output(base+['shell','pm','path','local.pocketchat.test'],text=True).strip().removeprefix('package:')\nsys.path.insert(0,'tools/gecko')\n\
        from installed_apk_read import read_installed_apk,InstalledApkReadError\nfrom caret_build_identity import audit_apk\nrows=[];snapshots=[]\ndef snapshot(label):\n\
        \  row={'label':label,'wallTimeNs':time.time_ns()}\n  for name,cmd in [('stat',base+['shell','stat','-c','%s:%i:%Y',installed]),('deviceSha256',base+['shell','sha256sum',installed]),('serverProcess',['pgrep','-a','adb']),('vsockNodes',base+['shell','ls','-l','/dev/vsock'])]:\n\
        \    r=subprocess.run(cmd,capture_output=True,timeout=30);row[name]={'exitCode':r.returncode,'stdout':r.stdout.decode(errors='replace'),'stderr':r.stderr.decode(errors='replace')}\n\
        \  snapshots.append(row)\nsnapshot('before')\ncompiled=audit_apk(pathlib.Path('work/diagnostic.apk'))\nfor i in range(24):\n  target=pathlib.Path('work')/f'diagnostic-pull-{i}.apk';mode='reader-pipe'\
        \ if i%2==0 else 'direct-file';began=time.monotonic();row={'index':i,'mode':mode,'wallTimeNs':time.time_ns()}\n  try:\n    if mode=='reader-pipe':\n\
        \      r=read_installed_apk(adb=adb,serial='emulator-5554',installed_path=installed,destination=target,expected_sha256=selected['sha256'],expected_bytes=selected['bytes'],diagnostics=out/f'reader-{i}.json',label=f'diagnostic-only-{i}')\n\
        \      row.update(returnCode=r['returnCode'],bytes=r['actualFileBytes'],sha256=r['actualFileSha256'],exact=True)\n    else:\n      env=dict(os.environ,ADB_TRACE='adb,transport,sockets')\n\
        \      with target.open('xb') as sink:r=subprocess.run(base+['shell','-T','cat',installed],stdin=subprocess.DEVNULL,stdout=sink,stderr=subprocess.PIPE,timeout=30,env=env)\n\
        \      raw=target.read_bytes();h=hashlib.sha256(raw).hexdigest();row.update(returnCode=r.returncode,bytes=len(raw),sha256=h,exact=r.returncode==0\
        \ and len(raw)==selected['bytes'] and h==selected['sha256']);(out/f'direct-{i}-stderr.txt').write_bytes(r.stderr)\n    if row.get('exact'):row['actualDefinitionAuditMatches']=audit_apk(target)==compiled\n\
        \  except InstalledApkReadError as e:row.update(exact=False,errorType=type(e).__name__,receipt=e.diagnostics)\n  except Exception as e:row.update(exact=False,errorType=type(e).__name__,error=str(e))\n\
        \  finally:target.unlink(missing_ok=True)\n  row['seconds']=time.monotonic()-began;rows.append(row);print(json.dumps(row),flush=True)\n  if not\
        \ row.get('exact'):snapshot('after-failed-'+str(i))\nsnapshot('after')\nreport=dict(diagnosticOnly=True,applicationAcceptance=False,actualEditingWorkloadExecution=False,sourceCommit='10f650a4c0043edada7b865ae0845a6644ecdbcf',diagnosticWorkflowCommit=os.environ['GITHUB_SHA'],serverTrace=os.environ['DIAGNOSTIC_TRACE'],emulatorBackplane=os.environ['DIAGNOSTIC_PIPE'],selected=selected,installedPath=installed,observations=rows,deviceSnapshots=snapshots)\n\
        (out/'diagnostic.json').write_text(json.dumps(report,indent=2))\nfor path in glob.glob('/tmp/adb.*.log'):shutil.copyfile(path,out/pathlib.Path(path).name)\n\
        for name,cmd in [('logcat',base+['logcat','-d']),('memory',['free','-m']),('kernel',['sudo','dmesg'])]:\n  r=subprocess.run(cmd,capture_output=True);(out/(name+'.txt')).write_bytes(r.stdout+r.stderr)\n\
        PYCODE\n"
      env:
        DIAGNOSTIC_TRACE: stock
        DIAGNOSTIC_PIPE: ${{ matrix.pipe }}
    - name: Preserve actual failed setup and authentication state
      if: always()
      run: "python3 - <<'PYADB'\nimport glob,hashlib,json,os,pathlib,shutil,subprocess\nout=pathlib.Path('work/adb-diagnostic');out.mkdir(exist_ok=True)\n\
        for p in glob.glob('/tmp/adb.*.log'):shutil.copyfile(p,out/pathlib.Path(p).name)\ncommands={\n'devices':['adb','devices','-l'],\n'guest-auth':['adb','-s','emulator-5556','shell','getprop','ro.adb.secure'],\n\
        'guest-adb':['adb','-s','emulator-5556','shell','dumpsys','adb'],\n'guest-listeners':['adb','-s','emulator-5556','shell','ss','-tn'],\n'guest-addresses':['adb','-s','emulator-5556','shell','ip','-4','addr'],\n\
        'guest-routes':['adb','-s','emulator-5556','shell','ip','-4','route','show','table','all'],\n'guest-logcat':['adb','-s','emulator-5556','logcat','-d','-s','adbd:V','*:*'],\n\
        }\nfor name,cmd in commands.items():\n try:\n  r=subprocess.run(cmd,capture_output=True,timeout=8);(out/(name+'.txt')).write_bytes(r.stdout+r.stderr)\n\
        \ except Exception as e:(out/(name+'.txt')).write_text(str(e))\nkeys=[]\nfor p in {pathlib.Path.home()/'.android/adbkey.pub',pathlib.Path('work/adb-user/adbkey.pub')}:\n\
        \ if p.exists():keys.append(dict(path=str(p),publicKeySha256=hashlib.sha256(p.read_bytes().strip()).hexdigest()))\ntry:\n r=subprocess.run(['adb','-s','emulator-5556','shell','getprop','ro.boot.qemu.adb.pubkey'],capture_output=True,timeout=8)\n\
        \ keys.append(dict(guestBootPublicKeySha256=hashlib.sha256(r.stdout.strip()).hexdigest(),exitCode=r.returncode))\nexcept Exception as e:keys.append(dict(guestBootPublicKeyError=str(e)))\n\
        (out/'auth-key-fingerprints.json').write_text(json.dumps(keys,indent=2))\nPYADB\n"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: adb-tcp-explicit-wifi-backend
        path: work/adb-diagnostic/
        retention-days: 5
    strategy:
      fail-fast: false
      matrix:
        pipe:
        - tcp
'on':
  push:
    branches:
    - diagnostic/adb-pipe-observation-20261023
