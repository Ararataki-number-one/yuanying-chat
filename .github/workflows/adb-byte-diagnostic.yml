name: Inspect actual QEMU network backend before native ADB qualification
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 10bd0078c1f02937ef7e59e9bca9967b32e529f7
    - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
      with:
        name: gecko-39918328409-1-build
        run-id: 39918328409
        github-token: ${{ github.token }}
        path: work/adb-build
    - name: Extract only the selected APK for transfer diagnostics
      run: |
        python3 - <<'PY'
        import hashlib,json,pathlib,tarfile
        out=pathlib.Path('work/adb-diagnostic');out.mkdir(parents=True,exist_ok=True)
        with tarfile.open('work/adb-build/bundle.tar.gz') as t:
          index=json.load(t.extractfile('_ci_bundle.json'))
          assert index['sourceCommit']=='10bd0078c1f02937ef7e59e9bca9967b32e529f7' and index['runId']=='39918328409'
          name='app/build/outputs/apk/integration/app-x86_64-integration.apk'
          item=next(x for x in index['files'] if x['path']==name);raw=t.extractfile(name).read()
          assert len(raw)==item['bytes'] and hashlib.sha256(raw).hexdigest()==item['sha256']
          pathlib.Path('work/diagnostic.apk').write_bytes(raw);(out/'selected.json').write_text(json.dumps(item))
        PY
    - name: Prepare the unchanged stock Android runtime
      run: |
        echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
        echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
        echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
        python3 tools/gecko/prepare_android_image.py --component emulator --sdk-root "$ANDROID_HOME" --cache work/android-image --report work/adb-diagnostic/emulator.json
        python3 tools/gecko/prepare_android_image.py --sdk-root "$ANDROID_HOME" --cache work/android-image --report work/adb-diagnostic/image.json

        python3 tools/gecko/prepare_platform_tools.py --sdk-root "$ANDROID_HOME" --cache work/android-image --report work/adb-diagnostic/platform-tools.json
        python3 tools/gecko/prepare_platform_tools.py --sdk-root "$ANDROID_HOME" --cache work/android-image --report work/adb-diagnostic/platform-tools.json
        python3 tools/gecko/prepare_platform_tools.py --sdk-root "$ANDROID_HOME" --cache work/android-image --report work/adb-diagnostic/platform-tools.json
        python3 tools/gecko/prepare_platform_tools.py --sdk-root "$ANDROID_HOME" --cache work/android-image --report work/adb-diagnostic/platform-tools.json
        python3 tools/gecko/prepare_platform_tools.py --sdk-root "$ANDROID_HOME" --cache work/android-image --report work/adb-diagnostic/platform-tools.json
    - name: Boot the unchanged Android runtime
      run: |
        set -euo pipefail
        export ANDROID_AVD_HOME="$PWD/work/adb-avd"
        export ANDROID_USER_HOME="$PWD/work/adb-user"
        export ANDROID_EMULATOR_HOME="$PWD/work/adb-emulator-home"
        mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME" "$ANDROID_EMULATOR_HOME"
        adb start-server
        sudo chmod a+rw /dev/kvm
        echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force -n geckoproduction -p "$ANDROID_AVD_HOME/geckoproduction.avd" -k 'system-images;android-35;google_apis;x86_64'
        "$ANDROID_HOME/emulator/emulator" -avd geckoproduction -no-window -no-audio -no-snapshot -no-boot-anim -no-metrics -accel on -port 5556 -gpu swiftshader -memory 3072 -cores 2 -qemu -monitor "unix:$PWD/work/qemu-monitor.sock,server=on,wait=off" > work/adb-diagnostic/emulator.txt 2>&1 &
        timeout 180 adb -s emulator-5556 wait-for-device
        timeout 300 bash -c 'until [ "$(adb -s emulator-5556 shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
        adb -s emulator-5556 shell input keyevent 82
        adb -s emulator-5556 install work/diagnostic.apk
        python3 - <<'PYBOOTSTRAP'
        import json,pathlib,shutil,subprocess,sys,time
        sys.path.insert(0,'tools/gecko');import prepare_emulator as original
        source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
        identity=original.expected_build(pathlib.Path('work/diagnostic.apk').resolve(),source,tree,'2.0.15',68)
        record=dict(schema=2,status='failed',serial='emulator-5556',exactSetupPackage=original.PACKAGE,commands=[],networkObservations=[],diagnostics={},initialInputSettings={},actualAndroidCommands=False,actualIntegrationProviderExecution=False,actualConnectivityManagerExecution=False,applicationAcceptance=False,actualGeckoExecution=False,physicalPhoneAcceptance=False,confirmedQemu=False,applicationOrInputPolicyModified=False,gestureReplayed=False,sdkWifiProvisioningRequested=False,disabledStateConfirmed=False,postSetupNetworkRecoveryRequired=False,sdkWifiProvisioningStages=[],sourceCommit=source,sourceTree=tree,expectedBuildIdentity=identity,diagnosticOnly=True,scope='Diagnostic bootstrap adapter before native transport; actual unchanged preflight logic, no input workloads or application acceptance')
        class DiagnosticBootstrapCommands:
         # Explicit independent diagnostic adapter; the original normal constructor,
         # fixed 5554 acceptance target and every application/input guard remain intact.
         run=original.Commands.run
         def __init__(self):
          self.executable=shutil.which('adb');self.serial='emulator-5556';self.record=record;self.deadline=time.monotonic()+33
        try:
         commands=DiagnosticBootstrapCommands();original.preflight(commands,record,identity)
         assert record['confirmedQemu'] and record['disabledStateConfirmed']
         # SDK request teardown can happen after an immediately healthy CM snapshot.
         # Dispose that connection before creating a persistent SDK AP connection.
         commands.run('shell','cmd','wifi','set-wifi-enabled','disabled')
         while True:
          addresses=commands.run('shell','ip','-4','-o','addr','show','wlan0')
          record.setdefault('wifiResetAddresses',[]).append(addresses)
          if 'inet ' not in addresses:break
          if commands.deadline-time.monotonic()<=1:raise TimeoutError('SDK WiFi teardown did not finish')
          time.sleep(.25)
         original.provision_sdk_wifi(commands,record,identity,'persistent-sdk-wifi-after-setup','after-persistent-sdk-wifi')
         assert original.network_observation(commands,record,identity,'persistent-sdk-wifi-confirmation')
        finally:pathlib.Path('work/adb-diagnostic/bootstrap-network.json').write_text(json.dumps(record,indent=2))
        assert record['status']=='passed' and record['confirmedQemu'] and record['disabledStateConfirmed']
        print(json.dumps(dict(bootstrapNetworkStatus=record['status'],diagnosticOnly=True,applicationAcceptance=False)))
        PYBOOTSTRAP
        adb -s emulator-5556 tcpip 5555
        timeout 30 adb -s emulator-5556 wait-for-device
        python3 - <<'PYSETUP'
        import json,os,pathlib,socket,subprocess,time
        out=pathlib.Path('work/adb-diagnostic');base=['adb','-s','emulator-5556'];record={'diagnosticOnly':True,'applicationAcceptance':False,'backend':os.environ['DIAGNOSTIC_BACKEND']}
        def adb(*parts):return subprocess.check_output(base+list(parts),text=True,timeout=8)
        deadline=time.monotonic()+30
        while True:
         address_result=subprocess.run(base+['shell','ip','-4','-o','addr','show','wlan0'],capture_output=True,text=True,timeout=8)
         route_result=subprocess.run(base+['shell','ip','-4','route','get','10.0.2.2'],capture_output=True,text=True,timeout=8)
         addresses=address_result.stdout;route=route_result.stdout
         record.setdefault('networkObservations',[]).append(dict(addressExit=address_result.returncode,routeExit=route_result.returncode,addresses=addresses,route=route,errors=address_result.stderr+route_result.stderr))
         if address_result.returncode==route_result.returncode==0 and 'inet 10.0.2.16/' in addresses and 'dev wlan0' in route:break
         if time.monotonic()>deadline:raise TimeoutError('Actual WiFi address/return route not ready')
         time.sleep(.25)
        record.update(wifiAddresses=addresses,returnRoute=route)
        def monitor(command):
         with socket.socket(socket.AF_UNIX,socket.SOCK_STREAM) as s:
          s.settimeout(5);s.connect('work/qemu-monitor.sock')
          data=b''
          while b'(qemu)' not in data:data+=s.recv(65536)
          s.sendall(command.encode()+b'\n');data=b''
          while b'(qemu)' not in data:
           block=s.recv(65536)
           if not block:break
           data+=block
           if len(data)>1024*1024:raise ValueError('Unexpected large metadata response')
          return data.decode(errors='replace')
        record['beforeUsernet']=monitor('info usernet')
        record['networkDevices']=monitor('info network')
        if os.environ['DIAGNOSTIC_BACKEND']=='wifi-explicit':
         record['forwardResult']=monitor('hostfwd_add virtio-wifi tcp:127.0.0.1:5555-10.0.2.16:5555')
        else:record['forwardResult']=adb('emu','redir','add','tcp:5555:5555')
        record['afterUsernet']=monitor('info usernet')
        (out/'qemu-forward.json').write_text(json.dumps(record,indent=2));print(json.dumps(record),flush=True)
        with socket.create_connection(('127.0.0.1',5037),timeout=5) as s:
         command=b'host:emulator:5555';s.sendall(('%04x'%len(command)).encode()+command);record['announcement']=s.recv(4).decode(errors='replace')
        deadline=time.monotonic()+30
        while True:
         r=subprocess.run(['adb','-s','emulator-5554','get-state'],capture_output=True,text=True,timeout=5)
         if r.returncode==0 and r.stdout.strip()=='device':break
         if time.monotonic()>deadline:
          record['nativeReady']=False;(out/'qemu-forward.json').write_text(json.dumps(record,indent=2));raise TimeoutError('Native TCP transport not device; no workload started')
         time.sleep(.25)
        record['nativeReady']=True;(out/'qemu-forward.json').write_text(json.dumps(record,indent=2))
        PYSETUP
        python3 tools/gecko/prepare_emulator.py --adb "$(command -v adb)" --serial emulator-5554 --apk work/diagnostic.apk
        adb -s emulator-5554 shell am start -W -n local.pocketchat.test/local.pocketchat.MainActivity
    - name: Observe 64 fixed real installed APK reads with the production shell open
      run: |
        python3 - <<'PYOBSERVE'
        import glob,hashlib,json,os,pathlib,shutil,subprocess,sys,time
        out=pathlib.Path('work/adb-diagnostic');selected=json.loads((out/'selected.json').read_text());adb=shutil.which('adb');base=[adb,'-s','emulator-5554']
        installed=subprocess.check_output(base+['shell','pm','path','local.pocketchat.test'],text=True).strip().removeprefix('package:')
        sys.path.insert(0,'tools/gecko');from installed_apk_read import read_installed_apk,InstalledApkReadError
        from caret_build_identity import audit_apk
        compiled=audit_apk(pathlib.Path('work/diagnostic.apk'));rows=[];snapshots=[]
        def snapshot(label,hash_file=False):
         row={'label':label,'at':time.time_ns()};commands=[('state',base+['get-state']),('stat',base+['shell','stat','-c','%s:%i:%Y',installed]),('adbdProcess',base+['shell','pidof','adbd'])]
         if hash_file:commands.append(('deviceSha256',base+['shell','sha256sum',installed]))
         for name,cmd in commands:
          try:
           r=subprocess.run(cmd,capture_output=True,timeout=30);row[name]={'returnCode':r.returncode,'stdout':r.stdout.decode(errors='replace'),'stderr':r.stderr.decode(errors='replace')}
          except Exception as e:row[name]={'error':str(e)}
         snapshots.append(row)
        # No device SHA256/content read warms the first transfer. No input workload runs.
        snapshot('before-first-read-without-content-hash')
        for i in range(64):
         target=pathlib.Path('work')/f'actual-transfer-{i}.apk';mode='ranged' if i%2==0 else 'whole';began=time.monotonic();row={'index':i,'mode':mode}
         try:
          if mode=='ranged':
           r=read_installed_apk(adb=adb,serial='emulator-5554',installed_path=installed,destination=target,expected_sha256=selected['sha256'],expected_bytes=selected['bytes'],diagnostics=out/f'read-{i}.json',label=f'host-adb-diagnostic-only-{i}')
           row.update(returnCode=r['returnCode'],bytes=r['actualFileBytes'],sha256=r['actualFileSha256'],exact=True)
          else:
           r=subprocess.run(base+['shell','-T','cat',installed],stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=30,env=dict(os.environ,ADB_TRACE='adb,transport,sockets'))
           target.write_bytes(r.stdout);digest=hashlib.file_digest(target.open('rb'),'sha256').hexdigest();row.update(returnCode=r.returncode,bytes=len(r.stdout),sha256=digest,exact=r.returncode==0 and len(r.stdout)==selected['bytes'] and digest==selected['sha256']);(out/f'whole-{i}-stderr.txt').write_bytes(r.stderr)
          if row.get('exact'):row['actualDefinitionAuditMatches']=audit_apk(target)==compiled
         except InstalledApkReadError as e:row.update(exact=False,error=e.diagnostics['error'],returnCode=e.diagnostics['returnCode'],bytes=e.diagnostics['actualFileBytes'])
         except Exception as e:row.update(exact=False,error=str(e))
         finally:target.unlink(missing_ok=True)
         row['seconds']=time.monotonic()-began;rows.append(row);print(json.dumps(row),flush=True)
         if not row.get('exact'):snapshot('after-failed-'+str(i))
        snapshot('after-all-fixed-observations',True)
        report=dict(diagnosticOnly=True,applicationAcceptance=False,actualOriginalInputWorkloadExecution=False,scope='64 predeclared actual installed APK observations per fresh device; no original input workloads or release acceptance',sourceCommit='10bd0078c1f02937ef7e59e9bca9967b32e529f7',sourceRun='39918328409',workflowCommit=os.environ['GITHUB_SHA'],backend=os.environ['DIAGNOSTIC_BACKEND'],bootSample=os.environ['BOOT_SAMPLE'],selected=selected,observations=rows,deviceSnapshots=snapshots)
        (out/'diagnostic.json').write_text(json.dumps(report,indent=2))
        for path in glob.glob('/tmp/adb.*.log'):shutil.copyfile(path,out/pathlib.Path(path).name)
        for name,cmd in [('adbd-log',base+['logcat','-d','-s','adbd:V','*:S']),('host-kernel',['uname','-a']),('devices',[adb,'devices','-l'])]:
         try:
          r=subprocess.run(cmd,capture_output=True,timeout=10);(out/(name+'.txt')).write_bytes(r.stdout+r.stderr)
         except Exception as e:(out/(name+'.txt')).write_text(str(e))
        assert all(r.get('exact') and r.get('actualDefinitionAuditMatches') for r in rows),'At least one fixed observation failed; no replacement'
        PYOBSERVE
    - name: Always preserve connection and listener metadata only
      if: always()
      run: |
        python3 - <<'PYMETA'
        import pathlib,subprocess,shutil
        out=pathlib.Path('work/adb-diagnostic');out.mkdir(parents=True,exist_ok=True)
        bootstrap=pathlib.Path('work/gecko-integration/emulator-bootstrap-results.json')
        if bootstrap.exists():shutil.copyfile(bootstrap,out/'native-preflight.json')
        for name,cmd in [('devices',['adb','devices','-l']),('guest-addresses',['adb','-s','emulator-5556','shell','ip','-4','addr']),('guest-routes',['adb','-s','emulator-5556','shell','ip','-4','route','show','table','all']),('guest-listeners',['adb','-s','emulator-5556','shell','ss','-tn']),('host-listeners',['ss','-tnp'])]:
         try:
          r=subprocess.run(cmd,capture_output=True,timeout=10);(out/(name+'.txt')).write_bytes(r.stdout+r.stderr)
         except Exception as e:(out/(name+'.txt')).write_text(str(e))
        PYMETA
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: qemu-native-${{ matrix.backend }}-${{ matrix.sample }}
        path: work/adb-diagnostic/
        retention-days: 5
    strategy:
      fail-fast: false
      matrix:
        backend:
        - console-default
        - wifi-explicit
        sample:
        - '1'
        - '2'
        - '3'
    env:
      DIAGNOSTIC_BACKEND: ${{ matrix.backend }}
      BOOT_SAMPLE: ${{ matrix.sample }}
'on':
  push:
    branches:
    - diagnostic/adb-pipe-observation-20261023
