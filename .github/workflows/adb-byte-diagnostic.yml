name: Compare official emulator transports without application acceptance
'on':
  push:
    branches:
    - diagnostic/adb-pipe-observation-20261023
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        emulator:
        - 37.2.12
        - 36.3.10
    env:
      COMPARE_EMULATOR: ${{ matrix.emulator }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 10f650a4c0043edada7b865ae0845a6644ecdbcf
    - name: Prepare exact selected emulator and unchanged Google API 35 image
      run: 'set -euo pipefail

        mkdir -p work/adb-diagnostic work/android-image

        echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

        echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"

        echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

        python3 - <<''PYPACKAGE''

        import importlib.util,json,os,pathlib

        from xml.dom import minidom

        spec=importlib.util.spec_from_file_location(''setup'',''tools/gecko/prepare_android_image.py'');setup=importlib.util.module_from_spec(spec);spec.loader.exec_module(setup)

        version=os.environ[''COMPARE_EMULATOR''];pin={''schema'': 1, ''package'': ''emulator'', ''revision'': ''36.3.10'', ''channel'': ''stable'', ''url'':
        ''https://dl.google.com/android/repository/emulator-linux_x64-14472402.zip'', ''bytes'': 320951246, ''sha1'': ''90cf9a2d3d9f802998345bc8251b482a84f9c72e'',
        ''sha256'': ''c8ab9ffbc4c2d11c02e06e81a9d9f81970177dc5ab599e3a30eb08a4a5496a67'', ''upstreamPin'': ''https://github.com/mozilla-firefox/firefox/commit/31f228ee75ad25f4870cb28aae24a6220bc4dfa5'',
        ''scope'': ''Official Google archive also pinned by Firefox CI; transport diagnostic only until same-source application qualification''} if version==''36.3.10''
        else json.loads(setup.EMULATOR_PIN.read_text())

        assert pin[''revision'']==version

        package=pathlib.Path(''work/adb-diagnostic/emulator-package.xml'');doc=minidom.parse(str(setup.EMULATOR_PACKAGE));rev=doc.getElementsByTagName(''revision'')[0]

        for tag,value in zip((''major'',''minor'',''micro''),version.split(''.'')):rev.getElementsByTagName(tag)[0].firstChild.data=value

        package.write_bytes(doc.toxml(encoding=''utf-8''));archive=pathlib.Path(''work/android-image/emulator.zip'')

        attempts=setup.download(pin,archive)

        if pin.get(''sha256''):assert setup.digest(archive,''sha256'')==pin[''sha256'']

        props=setup.install_emulator(archive,pathlib.Path(os.environ[''ANDROID_HOME''])/''emulator'',package,version)

        report=dict(diagnosticOnly=True,applicationAcceptance=False,setupOnly=True,pin=pin,properties=props,downloadAttempts=attempts,bytes=archive.stat().st_size,sha1=setup.digest(archive,''sha1''),sha256=setup.digest(archive,''sha256''))

        pathlib.Path(''work/adb-diagnostic/emulator.json'').write_text(json.dumps(report,indent=2));archive.unlink()

        PYPACKAGE

        python3 tools/gecko/prepare_android_image.py --sdk-root "$ANDROID_HOME" --cache work/android-image --report work/adb-diagnostic/image.json

        '
    - name: Boot unchanged stock transport and input settings
      run: 'set -euo pipefail

        export ANDROID_AVD_HOME="$PWD/work/adb-avd"

        export ANDROID_USER_HOME="$PWD/work/adb-user"

        export ANDROID_EMULATOR_HOME="$PWD/work/adb-emulator-home"

        mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME" "$ANDROID_EMULATOR_HOME"

        adb start-server

        sudo chmod a+rw /dev/kvm

        echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force -n geckoproduction -p "$ANDROID_AVD_HOME/geckoproduction.avd" -k
        ''system-images;android-35;google_apis;x86_64''

        "$ANDROID_HOME/emulator/emulator" -avd geckoproduction -no-window -no-audio -no-snapshot -no-boot-anim -no-metrics -accel on -port 5554 -gpu swiftshader
        -memory 3072 -cores 2 > work/adb-diagnostic/emulator.txt 2>&1 &

        timeout 180 adb -s emulator-5554 wait-for-device

        timeout 300 bash -c ''until [ "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done''

        adb -s emulator-5554 shell input keyevent 82

        '
    - name: Observe 32 fixed synthetic file transfers; no application workload
      run: "python3 - <<'PYDATA'\nimport hashlib,json,os,pathlib,re,subprocess,time\nout=pathlib.Path('work/adb-diagnostic');base=['adb','-s','emulator-5554'];run=os.environ['GITHUB_RUN_ID'];assert\
        \ run.isdigit()\nremote='/data/local/tmp/pocketchat-transfer-'+run;fixture=remote+'/synthetic-zero.bin';size=128*1024*1024;expected=hashlib.sha256(bytes(size)).hexdigest()\n\
        assert subprocess.check_output(base+['shell','getprop','ro.kernel.qemu'],text=True).strip()=='1'\nsubprocess.run(base+['shell','mkdir',remote],check=True,timeout=10)\n\
        subprocess.run(base+['shell','dd','if=/dev/zero','of='+fixture,'bs=1048576','count=128'],check=True,timeout=30)\nrows=[];identities=[]\ndef identity(label):\n\
        \ value={'label':label}\n for name,args in [('size',['stat','-c','%s',fixture]),('sha256',['sha256sum',fixture])]:\n  r=subprocess.run(base+['shell',*args],capture_output=True,text=True,timeout=30);value[name]={'exitCode':r.returncode,'stdout':r.stdout,'stderr':r.stderr}\n\
        \ identities.append(value)\nidentity('before')\nfor i in range(32):\n target=pathlib.Path('work')/f'actual-synthetic-transfer-{i}.bin';began=time.monotonic();row={'index':i}\n\
        \ try:\n  with target.open('xb') as f:\n   r=subprocess.run(base+['shell','-T','cat',fixture],stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=30)\n\
        \   f.write(r.stdout);f.flush()\n  count=target.stat().st_size;digest=hashlib.file_digest(target.open('rb'),'sha256').hexdigest()\n  row.update(returnCode=r.returncode,bytes=count,sha256=digest,exact=r.returncode==0\
        \ and count==size and digest==expected,stderr=r.stderr[-4096:].decode(errors='replace'))\n except Exception as e:row.update(exact=False,errorType=type(e).__name__,error=str(e))\n\
        \ finally:target.unlink(missing_ok=True)\n row['seconds']=time.monotonic()-began;rows.append(row);print(json.dumps(row),flush=True)\nidentity('after')\n\
        report=dict(diagnosticOnly=True,applicationAcceptance=False,releaseAcceptance=False,actualInstalledApkRead=False,actualApplicationWorkloadExecution=False,physicalPhoneAcceptance=False,scope='Only\
        \ a generated all-zero guest file over the stock emulator transport; no app, input or WAN acceptance',emulatorVersion=os.environ['COMPARE_EMULATOR'],workflowCommit=os.environ['GITHUB_SHA'],sourceCheckout=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),expectedBytes=size,expectedSha256=expected,observations=rows,guestFileIdentities=identities)\n\
        (out/'synthetic-transport.json').write_text(json.dumps(report,indent=2))\nsubprocess.run(base+['shell','rm',fixture],check=False,timeout=10)\nassert\
        \ all(x.get('exact') for x in rows),'At least one fixed synthetic transfer failed; no replacement observation is accepted'\nassert all(x['size']['exitCode']==x['sha256']['exitCode']==0\
        \ and x['size']['stdout'].strip()==str(size) and x['sha256']['stdout'].split()[0]==expected for x in identities)\nPYDATA\n"
    - name: Preserve only setup and ADB status logs
      if: always()
      run: "python3 - <<'PYLOG'\nimport glob,pathlib,shutil,subprocess\nout=pathlib.Path('work/adb-diagnostic');out.mkdir(exist_ok=True)\nfor p in glob.glob('/tmp/adb.*.log'):shutil.copyfile(p,out/pathlib.Path(p).name)\n\
        for name,cmd in [('adb-version',['adb','version']),('devices',['adb','devices','-l']),('adbd-log',['adb','-s','emulator-5554','logcat','-d','-s','adbd:V','*:S']),('memory',['free','-m'])]:\n\
        \ try:\n  r=subprocess.run(cmd,capture_output=True,timeout=8);(out/(name+'.txt')).write_bytes(r.stdout+r.stderr)\n except Exception as e:(out/(name+'.txt')).write_text(str(e))\n\
        PYLOG\n"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: emulator-transfer-${{ matrix.emulator }}
        path: work/adb-diagnostic/
        retention-days: 5
