name: Compare bounded actual installed APK transfer
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 877854e4718c7c6018abf8268147d60aeb432b3e
    - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
      with:
        name: gecko-39906714305-1-build
        run-id: 39906714305
        github-token: ${{ github.token }}
        path: work/adb-build
    - name: Extract only the selected APK for transfer diagnostics
      run: "python3 - <<'PY'\nimport hashlib,json,pathlib,tarfile\nout=pathlib.Path('work/adb-diagnostic');out.mkdir(parents=True,exist_ok=True)\nwith tarfile.open('work/adb-build/bundle.tar.gz')\
        \ as t:\n  index=json.load(t.extractfile('_ci_bundle.json'))\n  assert index['sourceCommit']=='877854e4718c7c6018abf8268147d60aeb432b3e' and index['runId']=='39906714305'\n\
        \  name='app/build/outputs/apk/integration/app-x86_64-integration.apk'\n  item=next(x for x in index['files'] if x['path']==name);raw=t.extractfile(name).read()\n\
        \  assert len(raw)==item['bytes'] and hashlib.sha256(raw).hexdigest()==item['sha256']\n  pathlib.Path('work/diagnostic.apk').write_bytes(raw);(out/'selected.json').write_text(json.dumps(item))\n\
        PY\n"
    - name: Prepare the unchanged stock Android runtime
      run: 'echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

        echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"

        echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

        python3 tools/gecko/prepare_android_image.py --component emulator --sdk-root "$ANDROID_HOME" --cache work/android-image --report work/adb-diagnostic/emulator.json

        python3 tools/gecko/prepare_android_image.py --sdk-root "$ANDROID_HOME" --cache work/android-image --report work/adb-diagnostic/image.json

        '
    - name: Boot the unchanged Android runtime
      run: 'set -euo pipefail

        export ANDROID_AVD_HOME="$PWD/work/adb-avd"

        export ANDROID_USER_HOME="$PWD/work/adb-user"

        export ANDROID_EMULATOR_HOME="$PWD/work/adb-emulator-home"

        mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME" "$ANDROID_EMULATOR_HOME"

        adb start-server

        sudo chmod a+rw /dev/kvm

        echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force -n geckoproduction -p "$ANDROID_AVD_HOME/geckoproduction.avd" -k
        ''system-images;android-35;google_apis;x86_64''

        "$ANDROID_HOME/emulator/emulator" -avd geckoproduction -no-window -no-audio -no-snapshot -no-boot-anim -no-metrics -accel on -port 5554 -gpu swiftshader
        -memory 3072 -cores 2 > work/adb-diagnostic/emulator.txt 2>&1 &

        timeout 180 adb -s emulator-5554 wait-for-device

        timeout 300 bash -c ''until [ "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done''

        adb -s emulator-5554 shell input keyevent 82


        adb -s emulator-5554 install work/diagnostic.apk

        python3 tools/gecko/prepare_emulator.py --adb "$(command -v adb)" --serial emulator-5554 --apk work/diagnostic.apk

        '
    - name: Compare 32 fixed actual installed APK reads without input workloads
      run: "python3 - <<'PYREADER'\nfrom pathlib import Path\np=Path('work/diagnostic-reader');p.mkdir(exist_ok=True)\n(p/'installed_apk_read.py').write_text('\"\
        \"\"Read actual installed APK ranges through framed, non-PTY ADB, without retries.\"\"\"\\nimport hashlib\\nimport json\\nimport math\\nimport os\\\
        nfrom pathlib import Path, PurePosixPath\\nimport re\\nimport shutil\\nimport stat\\nimport subprocess\\nimport sys\\nimport time\\n\\n\\nclass\
        \ InstalledApkReadError(ValueError):\\n    def __init__(self, diagnostics):\\n        self.diagnostics = diagnostics\\n        super().__init__(\\\
        'Actual installed APK read failed: \\' + json.dumps(diagnostics, sort_keys=True))\\n\\n\\n# Bound each stream and its host allocation. Ranges are\
        \ contiguous, read once,\\n# and checked individually as well as by the unchanged whole-file identity.\\nRANGE_BYTES = 4 * 1024 * 1024\\n\\n\\ndef\
        \ _disk(path):\\n    try:\\n        usage = shutil.disk_usage(path)\\n        return dict(total=usage.total, used=usage.used, free=usage.free)\\\
        n    except OSError as error:\\n        return dict(error=str(error))\\n\\n\\ndef _stderr(raw):\\n    raw = raw or b\\'\\'\\n    if isinstance(raw,\
        \ str):\\n        raw = raw.encode(\\'utf-8\\', errors=\\'replace\\')\\n    limit = 65536\\n    return dict(stderr=raw[-limit:].decode(\\'utf-8\\\
        ', errors=\\'replace\\'), stderrBytes=len(raw),\\n                stderrTruncated=len(raw) > limit)\\n\\n\\ndef _file_identity(path):\\n    digest,\
        \ size = hashlib.sha256(), 0\\n    with path.open(\\'rb\\') as stream:\\n        for block in iter(lambda: stream.read(1024 * 1024), b\\'\\'):\\\
        n            size += len(block); digest.update(block)\\n    return size, digest.hexdigest()\\n\\n\\ndef _record(path, receipt):\\n    try:\\n  \
        \      path.parent.mkdir(parents=True, exist_ok=True)\\n        path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + \\'\\\\n\\')\\n\
        \    except OSError as error:\\n        # A full filesystem must not replace the original transfer failure.\\n        receipt[\\'diagnosticsWriteError\\\
        '] = str(error)\\n    if receipt[\\'status\\'] != \\'verified-bytes\\':\\n        print(json.dumps(receipt, sort_keys=True), file=sys.stderr, flush=True)\\\
        n\\n\\ndef read_installed_apk(*, adb, serial, installed_path, destination, expected_sha256,\\n                       expected_bytes, diagnostics,\
        \ label, timeout=30):\\n    \"\"\"One bounded read of each APK range, followed by exact size/hash verification.\\n\\n    The caller still audits\
        \ ZIP/DEX/SDK/source assets on this actual transferred\\n    file. Failure removes only our exclusive partial file; no retry, install,\\n    test\
        \ invocation, shell metacharacters or compiled-file substitution exists.\\n    \"\"\"\\n    destination, diagnostics = Path(destination), Path(diagnostics)\\\
        n    receipt = dict(schema=1, scope=\\'host-read-only-installed-apk-byte-transfer\\', status=\\'failed\\',\\n                   transport=\\'adb-shell-v2-no-pty-ranged\\\
        ', dataSource=\\'binary-stdout-destination-file\\',\\n                   adbTrace=\\'adb,transport,sockets\\',\\n                   label=label,\
        \ installedApkPath=installed_path, destination=str(destination),\\n                   expectedBytes=expected_bytes, expectedSha256=expected_sha256,\\\
        n                   timeoutSeconds=timeout, returnCode=None, stdoutBytes=0, stdoutSha256=None,\\n                   actualFileBytes=0, actualFileSha256=None,\\\
        n                   stderr=\\'\\', stderrBytes=0, stderrTruncated=False,\\n                   cliStdout=\\'\\', cliStdoutBytes=0, cliStdoutSha256=None,\
        \ cliStdoutTruncated=False,\\n                   hostDiskBefore=_disk(destination.parent), startedAtMonotonicNanos=time.monotonic_ns(),\\n     \
        \              actualInstalledApkRead=False, actualAndroidFixtureExecution=False,\\n                   retryPerformed=False, compiledFileFallback=False,\
        \ partialCleaned=False,\\n                   rangeBytes=RANGE_BYTES, ranges=[])\\n    owned = False\\n    owned_identity = None\\n    try:\\n  \
        \      # Retain the canonical actual pm path guard; never select a compiled file.\\n        if (not isinstance(installed_path, str)\\n         \
        \       or not re.fullmatch(r\\'/data/app/[A-Za-z0-9_./~+=-]+/base\\\\.apk\\', installed_path)\\n                or str(PurePosixPath(installed_path))\
        \ != installed_path\\n                or \\'..\\' in PurePosixPath(installed_path).parts):\\n            raise ValueError(\\'Unsafe or noncanonical\
        \ actual installed base APK path\\')\\n        if type(expected_bytes) is not int or expected_bytes <= 0 or not isinstance(expected_sha256, str)\
        \ or not re.fullmatch(\\'[0-9a-f]{64}\\', expected_sha256):\\n            raise ValueError(\\'Exact selected APK byte count and SHA256 required\\\
        ')\\n        if type(timeout) not in (int, float) or not math.isfinite(timeout) or not 0 < timeout <= 30:\\n            raise ValueError(\\'Installed\
        \ byte read must use a finite deadline at most 30 seconds\\')\\n        # Reserve the destination exclusively. Shell v2 supplies remote exit\\n\
        \        # statuses and separate stderr; -T forbids terminal transformations.\\n        # Never replay a failed range or resume across a transport\
        \ failure.\\n        with destination.open(\\'xb\\') as output:\\n            owned = True\\n            before = os.fstat(output.fileno())\\n \
        \           owned_identity = (before.st_dev, before.st_ino)\\n            # The canonical absolute path cannot be an option and the whitelist\\\
        n            # excludes shell syntax. No login shell, PTY, or alternate file is used.\\n            environment = dict(os.environ, ADB_TRACE=receipt[\\\
        'adbTrace\\'])\\n            deadline = time.monotonic() + timeout\\n            for index, offset in enumerate(range(0, expected_bytes, RANGE_BYTES)):\\\
        n                count = min(RANGE_BYTES, expected_bytes - offset)\\n                command = [str(adb), \\'-s\\', serial, \\'shell\\', \\'-T\\\
        ', \\'dd\\',\\n                           \\'if=\\' + installed_path, \\'bs=\\' + str(RANGE_BYTES),\\n                           \\'skip=\\' + str(index),\
        \ \\'count=1\\', \\'status=none\\']\\n                receipt[\\'command\\'] = command\\n                part = dict(index=index, offset=offset,\
        \ expectedBytes=count, returnCode=None,\\n                            actualBytes=0, status=\\'failed\\')\\n                receipt[\\'ranges\\\
        '].append(part)\\n                remaining = deadline - time.monotonic()\\n                if remaining <= 0:\\n                    raise subprocess.TimeoutExpired(command,\
        \ timeout)\\n                try:\\n                    result = subprocess.run(command, stdin=subprocess.DEVNULL, stdout=subprocess.PIPE,\\n  \
        \                                          stderr=subprocess.PIPE, timeout=remaining, check=False,\\n                                          \
        \  env=environment)\\n                except subprocess.TimeoutExpired as error:\\n                    # Record partial bytes, never decode APK\
        \ contents into logs.\\n                    if error.stdout:\\n                        output.write(error.stdout)\\n                        output.flush()\\\
        n                        part[\\'actualBytes\\'] = len(error.stdout)\\n                    raise\\n                output.write(result.stdout)\\\
        n                output.flush()\\n                part.update(returnCode=result.returncode, actualBytes=len(result.stdout),\\n                 \
        \           sha256=hashlib.sha256(result.stdout).hexdigest())\\n                receipt.update(returnCode=result.returncode, **_stderr(result.stderr))\\\
        n                after = destination.lstat()\\n                if not stat.S_ISREG(after.st_mode) or (after.st_dev, after.st_ino) != owned_identity:\\\
        n                    raise ValueError(\\'Actual installed APK destination ownership changed\\')\\n                if result.returncode != 0:\\n\
        \                    raise ValueError(\\'ADB direct range read returned nonzero exit status\\')\\n                if len(result.stdout) != count:\\\
        n                    raise ValueError(\\'Actual installed APK range has incorrect byte count\\')\\n                part[\\'status\\'] = \\'verified-length\\\
        '\\n        # Compatibility names describe actual raw device bytes. No progress or\\n        # log text is accepted instead, even when the ADB process\
        \ exits zero.\\n        receipt[\\'stdoutBytes\\'], receipt[\\'stdoutSha256\\'] = _file_identity(destination)\\n        receipt.update(actualFileBytes=receipt[\\\
        'stdoutBytes\\'], actualFileSha256=receipt[\\'stdoutSha256\\'])\\n        if result.returncode != 0:\\n            raise ValueError(\\'ADB direct\
        \ read returned nonzero exit status\\')\\n        if receipt[\\'stdoutBytes\\'] != expected_bytes or receipt[\\'stdoutSha256\\'] != expected_sha256:\\\
        n            raise ValueError(\\'Actual installed bytes differ from selected APK size/SHA256\\')\\n        receipt.update(status=\\'verified-bytes\\\
        ', actualInstalledApkRead=True)\\n    except Exception as error:\\n        receipt.update(failureType=type(error).__name__, error=str(error))\\\
        n        if isinstance(error, subprocess.TimeoutExpired):\\n            receipt.update(**_stderr(error.stderr))\\n        own_path = False\\n  \
        \      if owned:\\n            try:\\n                current = destination.lstat()\\n                own_path = stat.S_ISREG(current.st_mode) and\
        \ (current.st_dev, current.st_ino) == owned_identity\\n            except OSError as inspection_error:\\n                receipt[\\'partialOwnershipInspectionError\\\
        '] = str(inspection_error)\\n        if own_path:\\n            try:\\n                receipt[\\'stdoutBytes\\'], receipt[\\'stdoutSha256\\'] =\
        \ _file_identity(destination)\\n                receipt.update(actualFileBytes=receipt[\\'stdoutBytes\\'], actualFileSha256=receipt[\\'stdoutSha256\\\
        '])\\n            except OSError as read_error:\\n                receipt[\\'partialInspectionError\\'] = str(read_error)\\n            try:\\n\
        \                destination.unlink(); receipt[\\'partialCleaned\\'] = True\\n            except OSError as cleanup_error:\\n                receipt[\\\
        'partialCleanupError\\'] = str(cleanup_error)\\n        elif owned:\\n            receipt[\\'partialCleanupSkipped\\'] = \\'Destination no longer\
        \ refers to the exclusively reserved file\\'\\n        receipt.update(hostDiskAfter=_disk(destination.parent), completedAtMonotonicNanos=time.monotonic_ns())\\\
        n        _record(diagnostics, receipt)\\n        raise InstalledApkReadError(receipt) from error\\n    receipt.update(hostDiskAfter=_disk(destination.parent),\
        \ completedAtMonotonicNanos=time.monotonic_ns())\\n    _record(diagnostics, receipt)\\n    return receipt\\n')\nPYREADER\npython3 - <<'PYCODE'\n\
        import glob,hashlib,json,os,pathlib,shutil,subprocess,sys,time\nout=pathlib.Path('work/adb-diagnostic');selected=json.loads((out/'selected.json').read_text());adb=shutil.which('adb');base=[adb,'-s','emulator-5554']\n\
        installed=subprocess.check_output(base+['shell','pm','path','local.pocketchat.test'],text=True).strip().removeprefix('package:')\nsys.path.insert(0,'tools/gecko');sys.path.insert(0,'work/diagnostic-reader')\n\
        from installed_apk_read import read_installed_apk,InstalledApkReadError\nfrom caret_build_identity import audit_apk\nrows=[];snapshots=[]\ndef snapshot(label):\n\
        \  row={'label':label,'wallTimeNs':time.time_ns()}\n  for name,cmd in [('stat',base+['shell','stat','-c','%s:%i:%Y',installed]),('deviceSha256',base+['shell','sha256sum',installed]),('serverProcess',['pgrep','-a','adb'])]:\n\
        \    r=subprocess.run(cmd,capture_output=True,timeout=30);row[name]={'exitCode':r.returncode,'stdout':r.stdout.decode(errors='replace'),'stderr':r.stderr.decode(errors='replace')}\n\
        \  snapshots.append(row)\nsnapshot('before')\ncompiled=audit_apk(pathlib.Path('work/diagnostic.apk'))\nfor i in range(32):\n  target=pathlib.Path('work')/f'diagnostic-pull-{i}.apk';mode='bounded-ranges'\
        \ if i%2==0 else 'direct-file';began=time.monotonic();row={'index':i,'mode':mode,'wallTimeNs':time.time_ns()}\n  try:\n    if mode=='bounded-ranges':\n\
        \      r=read_installed_apk(adb=adb,serial='emulator-5554',installed_path=installed,destination=target,expected_sha256=selected['sha256'],expected_bytes=selected['bytes'],diagnostics=out/f'reader-{i}.json',label=f'diagnostic-only-{i}')\n\
        \      row.update(returnCode=r['returnCode'],bytes=r['actualFileBytes'],sha256=r['actualFileSha256'],exact=True)\n    else:\n      env=dict(os.environ,ADB_TRACE='adb,transport,sockets')\n\
        \      with target.open('xb') as sink:r=subprocess.run(base+['shell','-T','cat',installed],stdin=subprocess.DEVNULL,stdout=sink,stderr=subprocess.PIPE,timeout=30,env=env)\n\
        \      raw=target.read_bytes();h=hashlib.sha256(raw).hexdigest();row.update(returnCode=r.returncode,bytes=len(raw),sha256=h,exact=r.returncode==0\
        \ and len(raw)==selected['bytes'] and h==selected['sha256']);(out/f'direct-{i}-stderr.txt').write_bytes(r.stderr)\n    if row.get('exact'):row['actualDefinitionAuditMatches']=audit_apk(target)==compiled\n\
        \  except InstalledApkReadError as e:row.update(exact=False,errorType=type(e).__name__,receipt=e.diagnostics)\n  except Exception as e:row.update(exact=False,errorType=type(e).__name__,error=str(e))\n\
        \  finally:target.unlink(missing_ok=True)\n  row['seconds']=time.monotonic()-began;rows.append(row);print(json.dumps(row),flush=True)\n  if not\
        \ row.get('exact'):snapshot('after-failed-'+str(i))\nsnapshot('after')\nreport=dict(diagnosticOnly=True,applicationAcceptance=False,actualEditingWorkloadExecution=False,sourceCommit='877854e4718c7c6018abf8268147d60aeb432b3e',diagnosticWorkflowCommit=os.environ['GITHUB_SHA'],scope='Fixed\
        \ real installed APK transport observations; no original input workload or release acceptance',selected=selected,installedPath=installed,observations=rows,deviceSnapshots=snapshots)\n\
        (out/'diagnostic.json').write_text(json.dumps(report,indent=2))\nfor path in glob.glob('/tmp/adb.*.log'):shutil.copyfile(path,out/pathlib.Path(path).name)\n\
        for name,cmd in [('logcat',base+['logcat','-d','-s','adbd:V','*:S']),('memory',['free','-m']),('kernel',['sudo','dmesg'])]:\n  r=subprocess.run(cmd,capture_output=True);(out/(name+'.txt')).write_bytes(r.stdout+r.stderr)\n\
        PYCODE\n"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: bounded-installed-apk-transport
        path: work/adb-diagnostic/
        retention-days: 5
'on':
  push:
    branches:
    - diagnostic/adb-pipe-observation-20261023
