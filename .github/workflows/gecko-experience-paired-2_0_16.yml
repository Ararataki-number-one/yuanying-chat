name: Fixed 2.0.16 paired experience experiment
'on':
  push:
    branches:
    - debug/gecko-experience-paired-2_0_16
    paths:
    - .github/workflows/gecko-experience-paired-2_0_16.yml
    - tools/gecko/experience-paired-2_0_16.json
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Check experiment identity and statistics guards
      run: python3 tests/gecko_experience_comparison_test.py
    - name: Freeze the committed original build pair
      id: inputs
      run: "python3 - <<'PYCODE'\nimport importlib.util,json,os\nfrom pathlib import Path\nspec=importlib.util.spec_from_file_location('comparison','tools/gecko/run_experience_comparison.py')\n\
        module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)\nassert os.environ['GITHUB_EVENT_NAME']=='push'\n\
        assert os.environ['GITHUB_REF_NAME']=='debug/gecko-experience-paired-2_0_16'\nvalues=json.loads(Path('tools/gecko/experience-paired-2_0_16.json').read_text())\n\
        assert set(values)=={'MODE','BASELINE_SOURCE','BASELINE_RUN','BASELINE_ATTEMPT','CANDIDATE_SOURCE','CANDIDATE_RUN','CANDIDATE_ATTEMPT','REPETITIONS'}\n\
        assert values['MODE']=='compare' and values['REPETITIONS']=='3'\nfor prefix in ('BASELINE','CANDIDATE'):\n    module.input_identity(values[prefix+'_SOURCE'],values[prefix+'_RUN'],values[prefix+'_ATTEMPT'])\n\
        with open(os.environ['GITHUB_OUTPUT'],'a') as output:\n    for key,value in values.items():\n        output.write(key.lower()+'='+value+'\\\
        n')\nreport=Path('work/experience-selection.json');report.parent.mkdir(parents=True,exist_ok=True)\nreport.write_text(json.dumps(dict(schema=1,status='passed',event='push',buildSelectionFrozen=True,selectionSource='committed\
        \ exact original build pair',orchestratorSourceCommit=os.environ['GITHUB_SHA'],selected=values),indent=2)+'\\n')\n\
        PYCODE\n"
    - name: Checkout exact baseline source
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ steps.inputs.outputs.baseline_source }}
        path: work/experience-inputs/baseline
        persist-credentials: false
    - name: Download exact baseline build
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
      with:
        name: gecko-${{ steps.inputs.outputs.baseline_run }}-${{ steps.inputs.outputs.baseline_attempt }}-build
        run-id: ${{ steps.inputs.outputs.baseline_run }}
        github-token: ${{ github.token }}
        path: work/experience-downloads/baseline
    - name: Checkout exact candidate source
      if: steps.inputs.outputs.mode == 'compare'
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ steps.inputs.outputs.candidate_source }}
        path: work/experience-inputs/candidate
        persist-credentials: false
    - name: Download exact candidate build
      if: steps.inputs.outputs.mode == 'compare'
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
      with:
        name: gecko-${{ steps.inputs.outputs.candidate_run }}-${{ steps.inputs.outputs.candidate_attempt }}-build
        run-id: ${{ steps.inputs.outputs.candidate_run }}
        github-token: ${{ github.token }}
        path: work/experience-downloads/candidate
    - name: Restore unchanged build bundles and seal ABBA plan
      env:
        MODE: ${{ steps.inputs.outputs.mode }}
        BASELINE_SOURCE: ${{ steps.inputs.outputs.baseline_source }}
        BASELINE_RUN: ${{ steps.inputs.outputs.baseline_run }}
        BASELINE_ATTEMPT: ${{ steps.inputs.outputs.baseline_attempt }}
        CANDIDATE_SOURCE: ${{ steps.inputs.outputs.candidate_source }}
        CANDIDATE_RUN: ${{ steps.inputs.outputs.candidate_run }}
        CANDIDATE_ATTEMPT: ${{ steps.inputs.outputs.candidate_attempt }}
        REPETITIONS: ${{ steps.inputs.outputs.repetitions }}
      shell: bash
      run: "set -euo pipefail\nselected=(--mode \"$MODE\" --baseline-root \"$PWD/work/experience-inputs/baseline\"\n  --baseline-bundle\
        \ \"$PWD/work/experience-downloads/baseline/bundle.tar.gz\"\n  --baseline-source \"$BASELINE_SOURCE\" --baseline-run\
        \ \"$BASELINE_RUN\"\n  --baseline-attempt \"$BASELINE_ATTEMPT\" --repetitions \"$REPETITIONS\"\n  --plan \"$PWD/work/experience-plan.json\"\
        )\nif [ \"$MODE\" = compare ]; then\n  selected+=(--candidate-root \"$PWD/work/experience-inputs/candidate\"\n   \
        \ --candidate-bundle \"$PWD/work/experience-downloads/candidate/bundle.tar.gz\"\n    --candidate-source \"$CANDIDATE_SOURCE\"\
        \ --candidate-run \"$CANDIDATE_RUN\"\n    --candidate-attempt \"$CANDIDATE_ATTEMPT\")\nfi\npython3 tools/gecko/run_experience_comparison.py\
        \ prepare \"${selected[@]}\"\n"
    - name: Prepare identical pinned Android runtime
      shell: bash
      run: 'set -euo pipefail

        echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

        echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"

        echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

        mkdir -p work/experience-runtime

        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ''platforms;android-37.1'' ''build-tools;37.0.0''

        python3 tools/gecko/prepare_android_image.py --component emulator --sdk-root "$ANDROID_HOME" --cache work/android-image
        --report work/experience-runtime/android-emulator-package-results.json

        python3 tools/gecko/prepare_android_image.py --sdk-root "$ANDROID_HOME" --cache work/android-image --report work/experience-runtime/android-system-image-results.json

        python3 tools/gecko/prepare_platform_tools.py --sdk-root "$ANDROID_HOME" --cache work/android-image --report work/experience-runtime/android-platform-tools-results.json

        '
    - name: Boot one fresh emulator and retain normal animations
      shell: bash
      run: "set -euo pipefail\nexport ANDROID_AVD_HOME=\"$PWD/work/experience-runtime/avd\"\nexport ANDROID_USER_HOME=\"$PWD/work/experience-runtime/android-user\"\
        \nexport ANDROID_EMULATOR_HOME=\"$PWD/work/experience-runtime/emulator-home\"\nmkdir -p \"$ANDROID_AVD_HOME\" \"$ANDROID_USER_HOME\"\
        \ \"$ANDROID_EMULATOR_HOME\"\nsudo chmod a+rw /dev/kvm\necho no | \"$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager\"\
        \ create avd --force -n geckoexperience -p \"$ANDROID_AVD_HOME/geckoexperience.avd\" -k 'system-images;android-35;google_apis;x86_64'\n\
        adb start-server\n\"$ANDROID_HOME/emulator/emulator\" -avd geckoexperience -no-window -no-audio -no-snapshot -no-boot-anim\
        \ -no-metrics -accel on -port 5556 -gpu swiftshader -memory 3072 -cores 2 -qemu -monitor \"unix:$PWD/work/experience-runtime/qemu-monitor.sock,server=on,wait=off\"\
        \ > work/experience-runtime/emulator.log 2>&1 &\ntimeout 180 adb -s emulator-5556 wait-for-device\ntimeout 300 bash\
        \ -c 'until [ \"$(adb -s emulator-5556 shell getprop sys.boot_completed | tr -d \"\\r\")\" = \"1\" ]; do sleep 2;\
        \ done'\nadb -s emulator-5556 shell input keyevent 82\nbaseline_root=\"$PWD/work/experience-inputs/baseline\"\nbaseline_apk=\"\
        $baseline_root/app/build/outputs/apk/integration/app-x86_64-integration.apk\"\nadb -s emulator-5556 install \"$baseline_apk\"\
        \npython3 \"$baseline_root/tools/gecko/prepare_native_adb.py\" --adb \"$(command -v adb)\" --apk \"$baseline_apk\"\
        \ --monitor \"$PWD/work/experience-runtime/qemu-monitor.sock\"\ncp \"$baseline_root/work/gecko-integration/native-adb-setup-results.json\"\
        \ work/experience-runtime/\nadb -s emulator-5554 shell wm size 1080x1920\nadb -s emulator-5554 shell wm density 480\n\
        adb -s emulator-5554 shell settings put system font_scale 1.0\nfor setting in window_animation_scale transition_animation_scale\
        \ animator_duration_scale; do\n  adb -s emulator-5554 shell settings put global \"$setting\" 1.0\ndone\n"
    - name: Measure every predeclared ABBA phase on this device
      run: python3 tools/gecko/run_experience_comparison.py run --plan "$PWD/work/experience-plan.json" --adb "$ANDROID_HOME/platform-tools/adb"
        --out "$PWD/work/experience-output"
    - name: Retain selection, plan, summary and setup failures
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: experience-summary-${{ github.run_id }}-${{ github.run_attempt }}
        path: 'work/experience-selection.json

          work/experience-plan.json

          work/experience-output/comparison-results.json

          work/experience-runtime/*results.json

          work/experience-inputs/baseline/work/gecko-integration/native-adb-setup-results.json

          '
        retention-days: 30
        if-no-files-found: warn
    - name: Retain all raw observations including failed phases
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: experience-raw-${{ github.run_id }}-${{ github.run_attempt }}
        path: 'work/experience-output

          work/experience-runtime/emulator.log

          '
        retention-days: 30
        if-no-files-found: warn
