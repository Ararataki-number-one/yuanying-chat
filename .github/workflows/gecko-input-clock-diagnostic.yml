name: Owned native input clock diagnostic
'on':
  push:
    branches: ['debug/gecko-input-clock-*']
permissions:
  contents: read
concurrency:
  group: input-clock-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Check the focused invocation contract
      run: python3 tests/gecko_input_clock_workflow_test.py
    - name: Prepare the original locked toolchain and source SDK
      shell: bash
      run: |
        set -euo pipefail
        echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
        echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
        echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
        mkdir -p work/gecko-integration
        "$JAVA_HOME_17_X64/bin/keytool" -genkeypair -keystore work/gecko-integration/integration-test.jks -alias androiddebugkey -storepass android -keypass android -dname CN=SyntheticIntegration -keyalg RSA -validity 2
        curl -fsSL --retry 3 https://services.gradle.org/distributions/gradle-9.8.0-bin.zip -o work/gecko-integration/gradle.zip
        echo 'bafd5ce9cfaea0fbccfdc8439a1ac42fbd4cd9c89dc9a988228d8a2639a58e6c  work/gecko-integration/gradle.zip' | sha256sum -c -
        unzip -q work/gecko-integration/gradle.zip -d work/gecko-integration/gradle
        curl -fsSL --retry 3 https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/157.0.20261005135250/geckoview-157.0.20261005135250.aar -o work/gecko-integration/geckoview.aar
        echo '15f1edf3c58abcdaf2783f299b8c19c3a36272d348969106a9009671fef8d268  work/gecko-integration/geckoview.aar' | sha256sum -c -
        curl -fsSL --retry 3 https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/157.0.20261005135250/geckoview-157.0.20261005135250.pom -o work/gecko-integration/geckoview.pom
        curl -fsSL --retry 3 https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/157.0.20261005135250/geckoview-157.0.20261005135250-sources.jar -o work/gecko-integration/geckoview-sources.jar
        python3 tools/gecko/verify_official_sdk.py --aar work/gecko-integration/geckoview.aar --pom work/gecko-integration/geckoview.pom --sources work/gecko-integration/geckoview-sources.jar --upstream-only
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.1' 'build-tools;37.0.0'
        export JAVA_HOME="$JAVA_HOME_17_X64"
        python3 tools/gecko/caret_workflow.py prepare --work work/gecko-integration
    - name: Compile the exact source APKs and observed shell driver
      shell: bash
      run: |
        set -euo pipefail
        work/gecko-integration/gradle/gradle-9.8.0/bin/gradle :app:assembleRelease :app:assembleIntegration :app:writeCaretResolvedArtifacts -PtestSigningKey="$PWD/work/gecko-integration/integration-test.jks" --console=plain 2>&1 | tee work/gecko-integration/build.log
        python3 tools/gecko/caret_workflow.py record --work work/gecko-integration
        python3 tools/gecko/build_native_input_driver.py --key "$PWD/work/gecko-integration/integration-test.jks"
    - name: Boot the original pinned Android and native ADB path
      shell: bash
      run: |
        set -euo pipefail
        exec > >(tee work/gecko-integration/native-test.log) 2>&1
        python3 tools/gecko/prepare_android_image.py --component emulator --sdk-root "$ANDROID_HOME" --cache work/android-image --report work/gecko-integration/android-emulator-package-results.json
        python3 tools/gecko/prepare_android_image.py --sdk-root "$ANDROID_HOME" --cache work/android-image --report work/gecko-integration/android-system-image-results.json
        export ANDROID_AVD_HOME="$PWD/work/gecko-integration/avd"
        export ANDROID_USER_HOME="$PWD/work/gecko-integration/android-user"
        export ANDROID_EMULATOR_HOME="$PWD/work/gecko-integration/emulator-home"
        mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME" "$ANDROID_EMULATOR_HOME"
        sudo chmod a+rw /dev/kvm
        echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force -n geckoproduction -p "$ANDROID_AVD_HOME/geckoproduction.avd" -k 'system-images;android-35;google_apis;x86_64'
        python3 tools/gecko/prepare_platform_tools.py --sdk-root "$ANDROID_HOME" --cache work/android-image --report work/gecko-integration/android-platform-tools-results.json
        adb start-server
        "$ANDROID_HOME/emulator/emulator" -avd geckoproduction -no-window -no-audio -no-snapshot -no-boot-anim -no-metrics -accel on -port 5556 -gpu swiftshader -memory 3072 -cores 2 -qemu -monitor "unix:$PWD/work/gecko-integration/qemu-monitor.sock,server=on,wait=off" > work/gecko-integration/emulator.log 2>&1 &
        timeout 180 adb -s emulator-5556 wait-for-device
        timeout 300 bash -c 'until [ "$(adb -s emulator-5556 shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
        adb -s emulator-5556 shell input keyevent 82
        adb -s emulator-5556 install app/build/outputs/apk/integration/app-x86_64-integration.apk
        python3 tools/gecko/prepare_native_adb.py --adb "$(command -v adb)" --apk app/build/outputs/apk/integration/app-x86_64-integration.apk --monitor "$PWD/work/gecko-integration/qemu-monitor.sock"
        echo "ANDROID_SERIAL=emulator-5554" >> "$GITHUB_ENV"
        python3 tools/gecko/prepare_emulator.py --adb "$(command -v adb)" --serial emulator-5554 --apk app/build/outputs/apk/integration/app-x86_64-integration.apk
    - name: Run the original performance once under its normal launcher guard
      shell: bash
      run: |
        set -euo pipefail
        exec > >(tee -a work/gecko-integration/native-test.log) 2>&1
        adb shell am force-stop local.pocketchat.test
        adb shell pm clear local.pocketchat.test
        adb shell pm grant local.pocketchat.test android.permission.POST_NOTIFICATIONS
        python3 tools/gecko/run_input_clock_diagnostic.py --adb "$(command -v adb)" --serial emulator-5554 --root "$PWD" --out work/gecko-integration --build-receipt work/gecko-integration/caret-apk-build-receipt.json --sdk-receipt work/native-caret-sdk/sdk-build-receipt.json --sdk-aar work/native-caret-sdk/geckoview-caret.aar --official-sdk-aar work/gecko-integration/geckoview.aar --integration-apk app/build/outputs/apk/integration/app-x86_64-integration.apk --release-apk app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk
    - name: Preserve original diagnostic bytes without release publication
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: input-clock-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          work/gecko-integration/native-input-*.json
          work/gecko-integration/native-input-*.log
          work/gecko-integration/gecko-performance-*.json
          work/gecko-integration/gecko-performance-*.txt
          work/gecko-integration/gecko-performance-*.png
          work/gecko-integration/gecko-performance-*.xml
          work/gecko-integration/gecko-scroll-*.json
          work/gecko-integration/installed-apk-read-performance-*.json
          work/gecko-integration/caret-apk-build-receipt.json
          work/gecko-integration/sdk-build-receipt.json
          work/gecko-integration/derived-sdk-verification.json
          work/gecko-integration/derived-sdk-input.json
          work/gecko-integration/android-emulator-package-results.json
          work/gecko-integration/android-system-image-results.json
          work/gecko-integration/android-platform-tools-results.json
          work/gecko-integration/emulator-bootstrap-results.json
          work/gecko-integration/native-adb-setup-results.json
          work/gecko-integration/native-test.log
          work/gecko-integration/emulator.log
          work/gecko-integration/build.log
        if-no-files-found: warn
        retention-days: 7
