    - name: Preserve native input build signature diagnostics
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: scheduler-diagnostic-native-input-build-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          work/gecko-integration/native-input-driver-signature-stdout.log
          work/gecko-integration/native-input-driver-signature-stderr.log
