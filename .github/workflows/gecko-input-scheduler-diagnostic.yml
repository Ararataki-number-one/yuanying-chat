          work/gecko-integration/native-input-driver-signature-api-stdout.log
          work/gecko-integration/native-input-driver-signature-api-stderr.log
          work/native-input-driver-build/strict/signed.apk
        if-no-files-found: warn
        retention-days: 7
        compression-level: 0
    - name: Declare this compiled bundle diagnostic only
      run: |
        python3 - <<'PYCODE'
        import json,os,pathlib,subprocess
        root=pathlib.Path.cwd()
        identity={'sourceCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                  'sourceTree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
                  'runId':os.environ['GITHUB_RUN_ID'],'runAttempt':os.environ['GITHUB_RUN_ATTEMPT']}
        assert identity['sourceCommit']==os.environ['GITHUB_SHA']
        assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
        record=dict(schema=1,diagnosticOnly=True,applicationAcceptance=False,releaseAcceptance=False,
                    kind='scheduler-trace-build',baseSourceCommit='fb67b081895bd37639d0a909155f607100d5cecb',originalWorkflowSha256='2326576f077e3e00cb495890111ad7d8c2e1a045f200adafbcc794992b33dab9',**identity)
        record.update(sample=os.environ.get('DIAGNOSTIC_SAMPLE'),
                      bootStepOutcome=os.environ.get('DIAGNOSTIC_BOOT_OUTCOME'),
                      traceRunnerStepOutcome=os.environ.get('DIAGNOSTIC_RUNNER_OUTCOME'),
                      analysisStepOutcome=os.environ.get('DIAGNOSTIC_ANALYSIS_OUTCOME'),
                      scope='Original fixed workloads with bounded external scheduler/input-service tracing. '
                            'Trace overhead means these artifacts never qualify an application or release.')
        path=pathlib.Path('work/ci-build/diagnostic-build-scope.json');path.parent.mkdir(parents=True,exist_ok=True)
        path.write_text(json.dumps(record,sort_keys=True,indent=2)+'\n')
        PYCODE
    - name: Seal one source/run-bound build for every Android phase
      run: python3 tools/gecko/ci_bundle.py pack --kind build --bundle work/ci-build/bundle.tar.gz
    - name: Transfer exact compiled APKs and SDK inputs
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: scheduler-diagnostic-gecko-${{ github.run_id }}-${{ github.run_attempt }}-build
        path: |
          work/ci-build/bundle.tar.gz
          work/ci-build/diagnostic-build-scope.json
        if-no-files-found: error
        retention-days: 3
        compression-level: 0
    name: Diagnostic build (no application acceptance)
  editing-trace:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        sample:
        - '1'
        - '2'
        - '3'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        fetch-depth: 2
    - name: Download the immutable compiled build
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
      with:
        name: scheduler-diagnostic-gecko-${{ github.run_id }}-${{ github.run_attempt }}-build
        path: work/ci-build
    - name: Restore exact build and verify its source/run/byte hashes
      run: python3 tools/gecko/ci_bundle.py restore --kind build --bundle work/ci-build/bundle.tar.gz
    - name: Prepare Android runtime only
      shell: bash
      run: |
        set -euo pipefail
        echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
        echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
        echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.1' 'build-tools;37.0.0'
        python3 tools/gecko/prepare_android_image.py --component emulator --sdk-root "$ANDROID_HOME" --cache work/android-image --report work/gecko-integration/android-emulator-package-results.json
        python3 tools/gecko/prepare_android_image.py --sdk-root "$ANDROID_HOME" --cache work/android-image --report work/gecko-integration/android-system-image-results.json
    - name: Boot Android for native acceptance
      shell: bash
      run: |
        set -euo pipefail
        exec > >(tee work/gecko-integration/native-test.log) 2>&1
        export ANDROID_AVD_HOME="$PWD/work/gecko-integration/avd"
        export ANDROID_USER_HOME="$PWD/work/gecko-integration/android-user"
        export ANDROID_EMULATOR_HOME="$PWD/work/gecko-integration/emulator-home"
        mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME" "$ANDROID_EMULATOR_HOME"
        sudo chmod a+rw /dev/kvm
        echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force -n geckoproduction -p "$ANDROID_AVD_HOME/geckoproduction.avd" -k 'system-images;android-35;google_apis;x86_64'
        python3 tools/gecko/prepare_platform_tools.py --sdk-root "$ANDROID_HOME" --cache work/android-image --report work/gecko-integration/android-platform-tools-results.json
        adb start-server
        python3 -c "$ANDROID_CAPACITY_PREFLIGHT" host '${{ matrix.sample }}'
        "$ANDROID_HOME/emulator/emulator" -avd geckoproduction -no-window -no-audio -no-snapshot -no-boot-anim -no-metrics -accel on -port 5556 -gpu swiftshader -memory 3072 -cores 4 -qemu -monitor "unix:$PWD/work/gecko-integration/qemu-monitor.sock,server=on,wait=off" > work/gecko-integration/emulator.log 2>&1 &
        timeout 180 adb -s emulator-5556 wait-for-device
        timeout 300 bash -c 'until [ "$(adb -s emulator-5556 shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
        adb -s emulator-5556 shell input keyevent 82
        adb -s emulator-5556 install app/build/outputs/apk/integration/app-x86_64-integration.apk
        python3 tools/gecko/prepare_native_adb.py --adb "$(command -v adb)" --apk app/build/outputs/apk/integration/app-x86_64-integration.apk --monitor "$PWD/work/gecko-integration/qemu-monitor.sock"
        echo "ANDROID_SERIAL=emulator-5554" >> "$GITHUB_ENV"
        python3 tools/gecko/prepare_emulator.py --adb "$(command -v adb)" --serial emulator-5554 --apk app/build/outputs/apk/integration/app-x86_64-integration.apk
        python3 -c "$ANDROID_CAPACITY_PREFLIGHT" guest '${{ matrix.sample }}'
      id: android_boot
    - name: Trace one unchanged original workload, once
      shell: bash
      run: |
        mkdir -p work/input-scheduler-diagnostic
        cat > work/input-scheduler-diagnostic/original-editing.sh <<'POCKETCHAT_ORIGINAL_EDITING'
        set -euo pipefail
        exec > >(tee -a work/gecko-integration/native-test.log) 2>&1
        adb shell am force-stop local.pocketchat.test
        adb shell pm clear local.pocketchat.test
        adb shell pm grant local.pocketchat.test android.permission.POST_NOTIFICATIONS
        python3 tools/gecko/run_caret_editing_phase.py --adb "$(command -v adb)" --serial emulator-5554 --root "$PWD" --out work/gecko-integration --build-receipt work/gecko-integration/caret-apk-build-receipt.json --sdk-receipt work/native-caret-sdk/sdk-build-receipt.json --sdk-aar work/native-caret-sdk/geckoview-caret.aar --official-sdk-aar work/gecko-integration/geckoview.aar --integration-apk app/build/outputs/apk/integration/app-x86_64-integration.apk --release-apk app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk
        POCKETCHAT_ORIGINAL_EDITING
        python3 tools/gecko/trace_input_scheduler.py run --sample '${{ matrix.sample }}' --out work/input-scheduler-diagnostic --command-file work/input-scheduler-diagnostic/original-editing.sh
      id: trace_workload
    - name: Preserve actual CPU capacity for this sample
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: scheduler-diagnostic-android-capacity-${{ github.job }}-${{ matrix.sample }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          work/gecko-integration/android-capacity-*.json
          work/gecko-integration/native-test.log
        if-no-files-found: warn
        retention-days: 5
    - name: Analyze bounded trace after the original workload has ended
      id: trace_analysis
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p work/input-scheduler-tools
        curl -fsSL --connect-timeout 15 --max-time 120 https://github.com/google/perfetto/releases/download/v54.0/linux-amd64.zip -o work/input-scheduler-tools/linux-amd64.zip
        echo '2066ad35f7f56baf622f88506ded9cc07e2bc569417e7cd22e057126c06da382  work/input-scheduler-tools/linux-amd64.zip' | sha256sum -c -
        python3 - <<'PYCODE'
        import pathlib,stat,zipfile
        archive=pathlib.Path('work/input-scheduler-tools/linux-amd64.zip')
        target=pathlib.Path('work/input-scheduler-tools/trace_processor_shell')
        with zipfile.ZipFile(archive) as source:
            members=[m for m in source.infolist() if pathlib.PurePosixPath(m.filename).name=='trace_processor_shell']
            assert len(members)==1 and 0<members[0].file_size<=64*1024*1024
            mode=(members[0].external_attr>>16)&0o170000
            assert not members[0].is_dir() and mode in (0,stat.S_IFREG)
            with source.open(members[0]) as src,target.open('xb') as dst:
                import shutil
                shutil.copyfileobj(src,dst,1024*1024)
        target.chmod(0o700)
        PYCODE
        python3 tools/gecko/trace_input_scheduler.py analyze --sample '${{ matrix.sample }}' --out work/input-scheduler-diagnostic --trace-processor work/input-scheduler-tools/trace_processor_shell
    - name: Seal original phase bytes without an acceptance collector
      if: always()
      run: python3 tools/gecko/ci_bundle.py pack --kind phase --phase editing --bundle work/input-scheduler-diagnostic/original-phase.tar.gz
    - name: Declare diagnostic scope regardless of workload outcome
      if: always()
      env:
        DIAGNOSTIC_SAMPLE: ${{ matrix.sample }}
        DIAGNOSTIC_BOOT_OUTCOME: ${{ steps.android_boot.outcome }}
        DIAGNOSTIC_RUNNER_OUTCOME: ${{ steps.trace_workload.outcome }}
        DIAGNOSTIC_ANALYSIS_OUTCOME: ${{ steps.trace_analysis.outcome }}
      run: |
        python3 - <<'PYCODE'
        import json,os,pathlib,subprocess
        root=pathlib.Path.cwd()
        identity={'sourceCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                  'sourceTree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
                  'runId':os.environ['GITHUB_RUN_ID'],'runAttempt':os.environ['GITHUB_RUN_ATTEMPT']}
        assert identity['sourceCommit']==os.environ['GITHUB_SHA']
        assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
        record=dict(schema=1,diagnosticOnly=True,applicationAcceptance=False,releaseAcceptance=False,
                    kind='scheduler-traced-original-editing',baseSourceCommit='fb67b081895bd37639d0a909155f607100d5cecb',originalWorkflowSha256='2326576f077e3e00cb495890111ad7d8c2e1a045f200adafbcc794992b33dab9',**identity)
        record.update(sample=os.environ.get('DIAGNOSTIC_SAMPLE'),
                      bootStepOutcome=os.environ.get('DIAGNOSTIC_BOOT_OUTCOME'),
                      traceRunnerStepOutcome=os.environ.get('DIAGNOSTIC_RUNNER_OUTCOME'),
                      analysisStepOutcome=os.environ.get('DIAGNOSTIC_ANALYSIS_OUTCOME'),
                      scope='Original fixed workloads with bounded external scheduler/input-service tracing. '
                            'Trace overhead means these artifacts never qualify an application or release.')
        path=pathlib.Path('work/input-scheduler-diagnostic/diagnostic-scope.json');path.parent.mkdir(parents=True,exist_ok=True)
        path.write_text(json.dumps(record,sort_keys=True,indent=2)+'\n')
        PYCODE
    - name: Preserve diagnostic trace and unchanged phase evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: scheduler-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}-editing-${{ matrix.sample }}
        path: work/input-scheduler-diagnostic/
        if-no-files-found: error
        retention-days: 5
        compression-level: 0
    name: Diagnostic editing (${{ matrix.sample }})
