name: Production Gecko integration
on:
  push:
    branches: [feature/android-engine-probe, feature/profile-upgrades-1_6]
    paths: ['app/**', 'tests/gecko/**', 'tests/browser-runtime/**', 'tests/browser-reading-host/**', 'tests/browser-reading-focus.cjs', 'tests/network-catalog-host/**', 'tests/network-source-host/**', 'tests/network-lineage-host/**', 'tests/sealed-file-host/**', 'tools/gecko/**', 'tools/publish-update-feed.py', 'tools/build-mihomo.py', 'third-party/patches/**', 'settings.gradle', 'build.gradle', 'gradle.properties', '.github/workflows/gecko-integration.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gecko-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify pinned network core and source patch
        run: python3 tools/build-mihomo.py --verify
      - name: Prepare locked toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          mkdir -p work/gecko-integration
          "$JAVA_HOME_17_X64/bin/keytool" -genkeypair -keystore work/gecko-integration/integration-test.jks -alias androiddebugkey -storepass android -keypass android -dname CN=SyntheticIntegration -keyalg RSA -validity 2
          curl -fsSL --retry 3 https://services.gradle.org/distributions/gradle-9.8.0-bin.zip -o work/gecko-integration/gradle.zip
          echo 'bafd5ce9cfaea0fbccfdc8439a1ac42fbd4cd9c89dc9a988228d8a2639a58e6c  work/gecko-integration/gradle.zip' | sha256sum -c -
          unzip -q work/gecko-integration/gradle.zip -d work/gecko-integration/gradle
          curl -fsSL --retry 3 https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/157.0.20261005135250/geckoview-157.0.20261005135250.aar -o work/gecko-integration/geckoview.aar
          echo '15f1edf3c58abcdaf2783f299b8c19c3a36272d348969106a9009671fef8d268  work/gecko-integration/geckoview.aar' | sha256sum -c -
          curl -fsSL --retry 3 https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/157.0.20261005135250/geckoview-157.0.20261005135250.pom -o work/gecko-integration/geckoview.pom
          curl -fsSL --retry 3 https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/157.0.20261005135250/geckoview-157.0.20261005135250-sources.jar -o work/gecko-integration/geckoview-sources.jar
          python3 tools/gecko/verify_official_sdk.py --aar work/gecko-integration/geckoview.aar --pom work/gecko-integration/geckoview.pom --sources work/gecko-integration/geckoview-sources.jar
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.1' 'build-tools;37.0.0' 'emulator' 'system-images;android-35;google_apis;x86_64'
      - name: Compile release and native regression package
        run: |
          set -euo pipefail
          work/gecko-integration/gradle/gradle-9.8.0/bin/gradle :app:assembleRelease :app:assembleIntegration -PtestSigningKey="$PWD/work/gecko-integration/integration-test.jks" --console=plain 2>&1 | tee work/gecko-integration/build.log
          python3 tools/gecko/verify_official_sdk.py --aar work/gecko-integration/geckoview.aar --pom work/gecko-integration/geckoview.pom --sources work/gecko-integration/geckoview-sources.jar --gradle-cache "${GRADLE_USER_HOME:-$HOME/.gradle}" | tee work/gecko-integration/official-sdk-verification.json
          python3 tools/gecko/check_safe_idle_trust.py --integration-apk app/build/outputs/apk/integration/app-x86_64-integration.apk | tee work/gecko-integration/network-safe-idle-trust-host-results.json
          python3 - <<'PYCODE'
          import json,pathlib,subprocess
          path=pathlib.Path('work/gecko-integration/network-safe-idle-trust-host-results.json')
          report=json.loads(path.read_text()); report['sourceCommit']=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          path.write_text(json.dumps(report,indent=2)+'\n')
          PYCODE
      - name: Stage current original-page UI for visual acceptance
        run: python3 tools/gecko/build_ui_baseline.py --gradle work/gecko-integration/gradle/gradle-9.8.0/bin/gradle --key "$PWD/work/gecko-integration/integration-test.jks"
      - name: Check stale messages and continuous bridge use
        run: |
          set -euo pipefail
          mkdir -p work/gecko-integration/bridge-host
          javac -encoding UTF-8 -d work/gecko-integration/bridge-host app/src/main/java/local/pocketchat/BrowserBridgeRequests.java tests/browser-runtime/BrowserBridgeRequestsTest.java
          java -cp work/gecko-integration/bridge-host local.pocketchat.BrowserBridgeRequestsTest | tee work/gecko-integration/bridge-host-results.json
          mkdir -p work/gecko-integration/reading-host
          javac -encoding UTF-8 -d work/gecko-integration/reading-host app/src/main/java/local/pocketchat/BrowserDisplay.java app/src/main/java/local/pocketchat/BrowserReadingPolicy.java app/src/main/java/local/pocketchat/BrowserReading.java tests/browser-reading-host/android/os/SystemClock.java tests/browser-reading-host/android/view/MotionEvent.java tests/browser-reading-host/local/pocketchat/ChatSession.java tests/browser-reading-host/local/pocketchat/BrowserReadingHostTest.java tests/browser-reading-host/local/pocketchat/BrowserReadingFocusScript.java
          java -cp work/gecko-integration/reading-host local.pocketchat.BrowserReadingHostTest | tee work/gecko-integration/reading-host-results.json
          node tests/browser-runtime/session-cookies.test.cjs | tee work/gecko-integration/cookie-host-results.json
          mkdir -p work/gecko-integration/region-host
          javac -encoding UTF-8 -d work/gecko-integration/region-host app/src/main/java/local/pocketchat/NodeRegion.java tests/browser-runtime/NodeRegionTest.java
          java -cp work/gecko-integration/region-host local.pocketchat.NodeRegionTest | tee work/gecko-integration/region-host-results.json
          mkdir -p work/gecko-integration/update-host
          javac -encoding UTF-8 -d work/gecko-integration/update-host app/src/main/java/local/pocketchat/AppUpdatePolicy.java tests/browser-runtime/AppUpdatePolicyTest.java
          java -cp work/gecko-integration/update-host local.pocketchat.AppUpdatePolicyTest | tee work/gecko-integration/update-host-results.json
          javac --add-modules jdk.httpserver -encoding UTF-8 -d work/gecko-integration/update-host app/src/main/java/local/pocketchat/AppUpdatePolicy.java app/src/main/java/local/pocketchat/AppUpdateTransfer.java tests/browser-runtime/AppUpdateTransferTest.java
          java --add-modules jdk.httpserver -cp work/gecko-integration/update-host local.pocketchat.AppUpdateTransferTest | tee work/gecko-integration/update-transfer-host-results.json
          mkdir -p work/gecko-integration/snapshot-host
          javac -encoding UTF-8 -d work/gecko-integration/snapshot-host app/src/main/java/local/pocketchat/FileSnapshotCache.java tests/browser-runtime/FileSnapshotCacheTest.java
          java -cp work/gecko-integration/snapshot-host local.pocketchat.FileSnapshotCacheTest | tee work/gecko-integration/snapshot-host-results.json
          npm install --prefix work/browser-perf-host --ignore-scripts --no-audit --no-fund jsdom@26.1.0
          java -cp work/gecko-integration/reading-host local.pocketchat.BrowserReadingFocusScript > work/gecko-integration/reading-focus.js
          JSDOM_MODULE="$PWD/work/browser-perf-host/node_modules/jsdom" node tests/browser-reading-focus.cjs work/gecko-integration/reading-focus.js | tee work/gecko-integration/reading-focus-host-results.json
          JSDOM_MODULE="$PWD/work/browser-perf-host/node_modules/jsdom" node tests/browser-runtime/reply-observation.test.cjs | tee work/gecko-integration/reply-observation-host-results.json
          JSDOM_MODULE="$PWD/work/browser-perf-host/node_modules/jsdom" node tests/browser-runtime/reply-binding-loading.test.cjs | tee work/gecko-integration/reply-binding-host-results.json
          JSDOM_MODULE="$PWD/work/browser-perf-host/node_modules/jsdom" node tests/browser-runtime/interaction-scheduling.test.cjs | tee work/gecko-integration/interaction-host-results.json
          mkdir -p work/gecko-integration/browser-policy-host
          javac -encoding UTF-8 -d work/gecko-integration/browser-policy-host app/src/main/java/local/pocketchat/BrowserRuntimePolicy.java tests/browser-runtime/BrowserRuntimePolicyTest.java
          java -cp work/gecko-integration/browser-policy-host local.pocketchat.BrowserRuntimePolicyTest "$PWD" | tee work/gecko-integration/browser-runtime-policy-host-results.json
          JSDOM_MODULE="$PWD/work/browser-perf-host/node_modules/jsdom" node tests/browser-runtime/original-website-policy.test.cjs | tee work/gecko-integration/original-website-policy-host-results.json
          mkdir -p work/gecko-integration/network-policy-host
          javac -encoding UTF-8 -d work/gecko-integration/network-policy-host app/src/main/java/local/pocketchat/NetworkPoolIdentity.java tests/browser-runtime/NetworkPoolIdentityTest.java app/src/main/java/local/pocketchat/LatencyProbePolicy.java tests/browser-runtime/LatencyProbePolicyTest.java
          java -cp work/gecko-integration/network-policy-host local.pocketchat.NetworkPoolIdentityTest | tee work/gecko-integration/network-pool-host-results.json
          java -cp work/gecko-integration/network-policy-host local.pocketchat.LatencyProbePolicyTest | tee work/gecko-integration/latency-probe-host-results.json
          python3 - <<'PYCODE'
          import json,pathlib,subprocess
          source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          for name in ['network-pool-host-results.json','latency-probe-host-results.json','browser-runtime-policy-host-results.json','original-website-policy-host-results.json','reading-host-results.json','reading-focus-host-results.json']:
              path=pathlib.Path('work/gecko-integration')/name
              report=json.loads(path.read_text())
              report['sourceCommit']=source
              path.write_text(json.dumps(report,indent=2)+'\n')
          PYCODE
      - name: Verify independent subscription catalogues and candidate snapshots
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o work/gecko-integration/catalog-json.jar
          echo '3cf6cd6892e32e2b4c1c39e0f52f5248a2f5b37646fdfbb79a66b46b618414ed  work/gecko-integration/catalog-json.jar' | sha256sum -c -
          python3 tests/network-catalog-host/run.py --json-jar work/gecko-integration/catalog-json.jar --output work/gecko-integration/network-catalog-host-results.json
          python3 tests/network-source-host/run.py --json-jar work/gecko-integration/catalog-json.jar --output work/gecko-integration/network-source-host-results.json
          python3 tests/network-lineage-host/run.py --json-jar work/gecko-integration/catalog-json.jar --output work/gecko-integration/network-lineage-host-results.json
          python3 tests/sealed-file-host/run.py --output work/gecko-integration/sealed-file-host-results.json
          python3 - <<'PYCODE'
          import json,pathlib,subprocess
          source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          for name in ['network-catalog-host-results.json','network-source-host-results.json','network-lineage-host-results.json','sealed-file-host-results.json']:
              path=pathlib.Path('work/gecko-integration')/name
              report=json.loads(path.read_text()); report['sourceCommit']=source
              path.write_text(json.dumps(report,indent=2)+'\n')
          PYCODE
      - name: Verify versioned environment models and authoritative intents
        run: |
          set -euo pipefail
          python3 tools/gecko/run_profile_host_checks.py --json-jar work/gecko-integration/catalog-json.jar --network-reports work/gecko-integration
          cp work/profile-host/results.json work/gecko-integration/profile-host-results.json
          cp work/profile-host/environment-intent-host-results.json work/gecko-integration/environment-intent-host-results.json
          cp work/profile-host/gecko-proxy-route-host-results.json work/gecko-integration/gecko-proxy-route-host-results.json
          python3 -m unittest discover -s tests -p 'profile_*_test.py'
          python3 -m unittest discover -s tests -p 'gecko_emulator_bootstrap_test.py'
          if [ -f tools/gecko/release_channel_contract_test.py ]; then
            python3 tools/gecko/release_channel_contract_test.py
          fi
      - name: Prepare synthetic signed upgrade archives
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee work/gecko-integration/update-fixture-preparation.log) 2>&1
          tools="$ANDROID_HOME/build-tools/37.0.0"
          python3 - <<'PYCODE'
          import pathlib,re
          code=int(re.search(r'versionCode ([0-9]+)',pathlib.Path('app/build.gradle').read_text()).group(1))+1
          text=pathlib.Path('tests/gecko/update-fixture.xml').read_text().replace('android:versionCode="1"',f'android:versionCode="{code}"')
          pathlib.Path('work/gecko-integration/update-fixture.xml').write_text(text)
          PYCODE
          "$tools/aapt2" link -I "$ANDROID_HOME/platforms/android-37.1/android.jar" --manifest work/gecko-integration/update-fixture.xml -o work/gecko-integration/update-fixture-unsigned.apk
          python3 - <<'PYCODE'
          import zipfile
          with zipfile.ZipFile('work/gecko-integration/update-fixture-unsigned.apk','a',compression=zipfile.ZIP_STORED) as archive:
              archive.writestr('assets/resume-fixture.bin', bytes(range(256)) * 4096)
          PYCODE
          "$tools/apksigner" sign --ks work/gecko-integration/integration-test.jks --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out work/gecko-integration/update-fixture.apk work/gecko-integration/update-fixture-unsigned.apk
          keytool -genkeypair -keystore work/gecko-integration/update-wrong-key.jks -alias fixture -storepass android -keypass android -dname CN=Synthetic -keyalg RSA -validity 2
          "$tools/apksigner" sign --ks work/gecko-integration/update-wrong-key.jks --ks-key-alias fixture --ks-pass pass:android --key-pass pass:android --out work/gecko-integration/update-wrong-signer.apk work/gecko-integration/update-fixture-unsigned.apk
      - name: Publish unsigned build for local original signing
        run: python3 tools/gecko/publish_ci.py
      - name: Exercise two production environment processes
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee work/gecko-integration/native-test.log) 2>&1
          export ANDROID_AVD_HOME="$PWD/work/gecko-integration/avd"
          export ANDROID_USER_HOME="$PWD/work/gecko-integration/android-user"
          export ANDROID_EMULATOR_HOME="$PWD/work/gecko-integration/emulator-home"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME" "$ANDROID_EMULATOR_HOME"
          sudo chmod a+rw /dev/kvm
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force -n geckoproduction -p "$ANDROID_AVD_HOME/geckoproduction.avd" -k 'system-images;android-35;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd geckoproduction -no-window -no-audio -no-snapshot -no-boot-anim -no-metrics -accel on -port 5554 -gpu swiftshader -memory 3072 -cores 2 > work/gecko-integration/emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
          adb shell input keyevent 82
          adb install app/build/outputs/apk/integration/app-x86_64-integration.apk
          python3 tools/gecko/prepare_emulator.py --adb "$(command -v adb)" --serial emulator-5554 --apk app/build/outputs/apk/integration/app-x86_64-integration.apk
          checks_failed=0
          if ! python3 tests/gecko/run_gecko_performance.py --adb "$(command -v adb)" --serial emulator-5554; then
            checks_failed=1
          fi
          python3 tools/gecko/publish_ci.py
          if ! python3 tests/gecko/run_network_performance.py --adb "$(command -v adb)" --serial emulator-5554; then
            checks_failed=1
          fi
          if ! python3 tests/gecko/run_quiet_notifications.py --adb "$(command -v adb)" --serial emulator-5554; then
            checks_failed=1
          fi
          if ! python3 tests/gecko/run_ui_visuals.py --adb "$(command -v adb)" --serial emulator-5554; then
            checks_failed=1
          fi
          python3 tools/gecko/publish_ci.py
          adb shell am force-stop local.pocketchat.test
          adb shell pm clear local.pocketchat.test
          if ! python3 tests/gecko/run_device.py --adb "$(command -v adb)" --serial emulator-5554; then
            checks_failed=1
          fi
          adb exec-out screencap -p > work/gecko-integration/device-screen.png
          if ! python3 tests/gecko/run_update_route.py --adb "$(command -v adb)" --serial emulator-5554; then
            checks_failed=1
          fi
          python3 tools/gecko/publish_ci.py
          if ! python3 tests/gecko/run_native_probe.py --adb "$(command -v adb)" --serial emulator-5554; then
            checks_failed=1
          fi
          python3 tools/gecko/publish_ci.py
          if ! python3 tests/gecko/run_gecko_pool.py --adb "$(command -v adb)" --serial emulator-5554; then
            checks_failed=1
          fi
          python3 tools/gecko/publish_ci.py
          if ! python3 tests/gecko/run_preconnect.py --adb "$(command -v adb)" --serial emulator-5554; then
            checks_failed=1
          fi
          python3 tools/gecko/publish_ci.py
          if ! python3 tests/gecko/run_network_sources.py --adb "$(command -v adb)" --serial emulator-5554; then
            checks_failed=1
          fi
          python3 tools/gecko/publish_ci.py
          if ! python3 tests/gecko/run_network_sources_ui.py --adb "$(command -v adb)" --serial emulator-5554 --expected-apk-sha "$(python3 -c 'import hashlib,pathlib;print(hashlib.sha256(pathlib.Path("app/build/outputs/apk/integration/app-x86_64-integration.apk").read_bytes()).hexdigest())')"; then
            checks_failed=1
          fi
          python3 tools/gecko/publish_ci.py
          if ! python3 tests/gecko/run_network_sources_route.py --adb "$(command -v adb)" --serial emulator-5554; then
            checks_failed=1
          fi
          python3 tools/gecko/publish_ci.py
          if ! python3 tests/gecko/run_network_safe_idle.py --adb "$(command -v adb)" --serial emulator-5554 --expected-apk-sha "$(python3 -c 'import hashlib,pathlib;print(hashlib.sha256(pathlib.Path("app/build/outputs/apk/integration/app-x86_64-integration.apk").read_bytes()).hexdigest())')"; then
            checks_failed=1
          fi
          python3 tools/gecko/publish_ci.py
          # Preserve the original input/performance baseline before new fixtures.
          if ! python3 tests/gecko/run_profile_features.py --adb "$(command -v adb)" --serial emulator-5554 --apk app/build/outputs/apk/integration/app-x86_64-integration.apk; then
            checks_failed=1
          fi
          python3 tools/gecko/publish_ci.py
          if ! python3 tools/gecko/check_profile_evidence.py work/gecko-integration --source "$GITHUB_SHA"; then
            checks_failed=1
          fi
          if ! python3 tools/gecko/check_chain_evidence.py work/gecko-integration --source "$GITHUB_SHA"; then
            checks_failed=1
          fi
          if ! python3 tools/gecko/check_client_evidence.py work/gecko-integration --source "$GITHUB_SHA"; then
            checks_failed=1
          fi
          if [ "$checks_failed" -ne 0 ]; then
            exit 1
          fi
      - name: Publish synthetic regression evidence
        if: always()
        run: python3 tools/gecko/publish_ci.py
