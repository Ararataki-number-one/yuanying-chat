name: Production Gecko integration
on:
  push:
    branches: [feature/android-engine-probe]
    paths: ['app/**', 'tests/gecko/**', 'tests/browser-runtime/**', 'tests/browser-reading-host/**', 'tools/gecko/**', 'tools/publish-update-feed.py', 'settings.gradle', 'build.gradle', 'gradle.properties', '.github/workflows/gecko-integration.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gecko-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare locked toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          mkdir -p work/gecko-integration
          "$JAVA_HOME_17_X64/bin/keytool" -genkeypair -keystore work/gecko-integration/integration-test.jks -alias androiddebugkey -storepass android -keypass android -dname CN=SyntheticIntegration -keyalg RSA -validity 2
          curl -fsSL --retry 3 https://services.gradle.org/distributions/gradle-9.8.0-bin.zip -o work/gecko-integration/gradle.zip
          echo 'bafd5ce9cfaea0fbccfdc8439a1ac42fbd4cd9c89dc9a988228d8a2639a58e6c  work/gecko-integration/gradle.zip' | sha256sum -c -
          unzip -q work/gecko-integration/gradle.zip -d work/gecko-integration/gradle
          curl -fsSL --retry 3 https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/157.0.20260924084938/geckoview-157.0.20260924084938.aar -o work/gecko-integration/geckoview.aar
          echo '25de06a6204382c08e405adc36da7373098bdc230d6d768f17a6fe971f0dece0  work/gecko-integration/geckoview.aar' | sha256sum -c -
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.1' 'build-tools;37.0.0' 'emulator' 'system-images;android-35;google_apis;x86_64'
      - name: Compile release and native regression package
        run: |
          set -euo pipefail
          work/gecko-integration/gradle/gradle-9.8.0/bin/gradle :app:assembleRelease :app:assembleIntegration -PtestSigningKey="$PWD/work/gecko-integration/integration-test.jks" --console=plain --write-verification-metadata sha256 2>&1 | tee work/gecko-integration/build.log
      - name: Check stale messages and continuous bridge use
        run: |
          set -euo pipefail
          mkdir -p work/gecko-integration/bridge-host
          javac -encoding UTF-8 -d work/gecko-integration/bridge-host app/src/main/java/local/pocketchat/BrowserBridgeRequests.java tests/browser-runtime/BrowserBridgeRequestsTest.java
          java -cp work/gecko-integration/bridge-host local.pocketchat.BrowserBridgeRequestsTest | tee work/gecko-integration/bridge-host-results.json
          mkdir -p work/gecko-integration/reading-host
          javac -encoding UTF-8 -d work/gecko-integration/reading-host app/src/main/java/local/pocketchat/BrowserDisplay.java app/src/main/java/local/pocketchat/BrowserReadingPolicy.java app/src/main/java/local/pocketchat/BrowserReading.java tests/browser-reading-host/android/os/SystemClock.java tests/browser-reading-host/android/view/MotionEvent.java tests/browser-reading-host/local/pocketchat/ChatSession.java tests/browser-reading-host/local/pocketchat/BrowserReadingHostTest.java
          java -cp work/gecko-integration/reading-host local.pocketchat.BrowserReadingHostTest | tee work/gecko-integration/reading-host-results.json
          node tests/browser-runtime/session-cookies.test.cjs | tee work/gecko-integration/cookie-host-results.json
          mkdir -p work/gecko-integration/region-host
          javac -encoding UTF-8 -d work/gecko-integration/region-host app/src/main/java/local/pocketchat/NodeRegion.java tests/browser-runtime/NodeRegionTest.java
          java -cp work/gecko-integration/region-host local.pocketchat.NodeRegionTest | tee work/gecko-integration/region-host-results.json
          mkdir -p work/gecko-integration/update-host
          javac -encoding UTF-8 -d work/gecko-integration/update-host app/src/main/java/local/pocketchat/AppUpdatePolicy.java tests/browser-runtime/AppUpdatePolicyTest.java
          java -cp work/gecko-integration/update-host local.pocketchat.AppUpdatePolicyTest | tee work/gecko-integration/update-host-results.json
      - name: Prepare synthetic signed upgrade archives
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee work/gecko-integration/update-fixture-preparation.log) 2>&1
          tools="$ANDROID_HOME/build-tools/37.0.0"
          python3 - <<'PYCODE'
          import pathlib,re
          code=int(re.search(r'versionCode ([0-9]+)',pathlib.Path('app/build.gradle').read_text()).group(1))+1
          text=pathlib.Path('tests/gecko/update-fixture.xml').read_text().replace('android:versionCode="1"',f'android:versionCode="{code}"')
          pathlib.Path('work/gecko-integration/update-fixture.xml').write_text(text)
          PYCODE
          "$tools/aapt2" link -I "$ANDROID_HOME/platforms/android-37.1/android.jar" --manifest work/gecko-integration/update-fixture.xml -o work/gecko-integration/update-fixture-unsigned.apk
          "$tools/apksigner" sign --ks work/gecko-integration/integration-test.jks --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out work/gecko-integration/update-fixture.apk work/gecko-integration/update-fixture-unsigned.apk
          keytool -genkeypair -keystore work/gecko-integration/update-wrong-key.jks -alias fixture -storepass android -keypass android -dname CN=Synthetic -keyalg RSA -validity 2
          "$tools/apksigner" sign --ks work/gecko-integration/update-wrong-key.jks --ks-key-alias fixture --ks-pass pass:android --key-pass pass:android --out work/gecko-integration/update-wrong-signer.apk work/gecko-integration/update-fixture-unsigned.apk
      - name: Publish unsigned build for local original signing
        run: python3 tools/gecko/publish_ci.py
      - name: Exercise two production environment processes
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee work/gecko-integration/native-test.log) 2>&1
          export ANDROID_AVD_HOME="$PWD/work/gecko-integration/avd"
          export ANDROID_USER_HOME="$PWD/work/gecko-integration/android-user"
          export ANDROID_EMULATOR_HOME="$PWD/work/gecko-integration/emulator-home"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME" "$ANDROID_EMULATOR_HOME"
          sudo chmod a+rw /dev/kvm
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force -n geckoproduction -p "$ANDROID_AVD_HOME/geckoproduction.avd" -k 'system-images;android-35;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd geckoproduction -no-window -no-audio -no-snapshot -no-boot-anim -no-metrics -accel on -port 5554 -gpu swiftshader -memory 3072 -cores 2 > work/gecko-integration/emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
          adb shell input keyevent 82
          adb install app/build/outputs/apk/integration/app-x86_64-integration.apk
          python3 tests/gecko/run_device.py --adb "$(command -v adb)" --serial emulator-5554
          adb exec-out screencap -p > work/gecko-integration/device-screen.png
      - name: Publish synthetic regression evidence
        if: always()
        run: python3 tools/gecko/publish_ci.py
