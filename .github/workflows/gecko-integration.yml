name: Production Gecko integration
'on':
  push:
    branches:
    - feature/android-engine-probe
    - feature/profile-upgrades-1_6
    - feature/profile-upgrades-1_7
    - feature/profile-upgrades-1_7-final
    - feature/profile-upgrades-2_0
    - release/gecko-*
    paths:
    - app/**
    - tests/**
    - tools/**
    - third-party/patches/**
    - third-party/sdk/**
    - third-party/gecko/**
    - settings.gradle
    - build.gradle
    - gradle.properties
    - .github/workflows/gecko-integration.yml
  workflow_dispatch: null
permissions:
  contents: write
  actions: read
concurrency:
  group: gecko-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Verify pinned network core and source patch
      run: |
        python3 tests/gecko_prepare_image_test.py
        python3 tests/gecko_annotation_download_test.py
        python3 tests/gecko_ci_publish_test.py
        python3 tools/build-mihomo.py --verify
    - name: Prepare locked toolchain
      shell: bash
      run: |
        set -euo pipefail
        echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
        echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
        echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
        mkdir -p work/gecko-integration
        "$JAVA_HOME_17_X64/bin/keytool" -genkeypair -keystore work/gecko-integration/integration-test.jks -alias androiddebugkey -storepass android -keypass android -dname CN=SyntheticIntegration -keyalg RSA -validity 2
        curl -fsSL --retry 3 https://services.gradle.org/distributions/gradle-9.8.0-bin.zip -o work/gecko-integration/gradle.zip
        echo 'bafd5ce9cfaea0fbccfdc8439a1ac42fbd4cd9c89dc9a988228d8a2639a58e6c  work/gecko-integration/gradle.zip' | sha256sum -c -
        unzip -q work/gecko-integration/gradle.zip -d work/gecko-integration/gradle
        curl -fsSL --retry 3 https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/157.0.20261005135250/geckoview-157.0.20261005135250.aar -o work/gecko-integration/geckoview.aar
        echo '15f1edf3c58abcdaf2783f299b8c19c3a36272d348969106a9009671fef8d268  work/gecko-integration/geckoview.aar' | sha256sum -c -
        curl -fsSL --retry 3 https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/157.0.20261005135250/geckoview-157.0.20261005135250.pom -o work/gecko-integration/geckoview.pom
        curl -fsSL --retry 3 https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/157.0.20261005135250/geckoview-157.0.20261005135250-sources.jar -o work/gecko-integration/geckoview-sources.jar
        python3 tools/gecko/verify_official_sdk.py --aar work/gecko-integration/geckoview.aar --pom work/gecko-integration/geckoview.pom --sources work/gecko-integration/geckoview-sources.jar --upstream-only
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.1' 'build-tools;37.0.0'
        export JAVA_HOME="$JAVA_HOME_17_X64"
        python3 tools/gecko/run_key_order_host.py | tee work/gecko-integration/key-order-host-results.json
        python3 tools/gecko/run_reply_handoff_host.py --upstream-sources work/gecko-integration/geckoview-sources.jar | tee work/gecko-integration/reply-handoff-host-results.json
        python3 tools/gecko/caret_workflow.py prepare --work work/gecko-integration
    - name: Compile release and native regression package
      run: |
        set -euo pipefail
        work/gecko-integration/gradle/gradle-9.8.0/bin/gradle :app:assembleRelease :app:assembleIntegration :app:writeCaretResolvedArtifacts -PtestSigningKey="$PWD/work/gecko-integration/integration-test.jks" --console=plain 2>&1 | tee work/gecko-integration/build.log
        python3 tools/gecko/verify_official_sdk.py --aar work/gecko-integration/geckoview.aar --pom work/gecko-integration/geckoview.pom --sources work/gecko-integration/geckoview-sources.jar --upstream-only | tee work/gecko-integration/official-sdk-verification.json
        python3 tools/gecko/caret_workflow.py record --work work/gecko-integration
        python3 tools/gecko/check_safe_idle_trust.py --integration-apk app/build/outputs/apk/integration/app-x86_64-integration.apk | tee work/gecko-integration/network-safe-idle-trust-host-results.json
        python3 - <<'PYCODE'
        import json,pathlib,subprocess
        path=pathlib.Path('work/gecko-integration/network-safe-idle-trust-host-results.json')
        report=json.loads(path.read_text()); report['sourceCommit']=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
        path.write_text(json.dumps(report,indent=2)+'\n')
        PYCODE
    - name: Stage current original-page UI for visual acceptance
      run: python3 tools/gecko/build_ui_baseline.py --gradle work/gecko-integration/gradle/gradle-9.8.0/bin/gradle --key "$PWD/work/gecko-integration/integration-test.jks"
    - name: Check stale messages and continuous bridge use
      run: |
        set -euo pipefail
        mkdir -p work/gecko-integration/appearance-palette
        javac -encoding UTF-8 -d work/gecko-integration/appearance-palette app/src/main/java/local/pocketchat/AppearanceColors.java tests/browser-runtime/AppearancePaletteTest.java
        java -cp work/gecko-integration/appearance-palette local.pocketchat.AppearancePaletteTest | tee work/gecko-integration/appearance-palette-host-results.json
        mkdir -p work/gecko-integration/bridge-host
        javac -encoding UTF-8 -d work/gecko-integration/bridge-host app/src/main/java/local/pocketchat/BrowserBridgeRequests.java tests/browser-runtime/BrowserBridgeRequestsTest.java
        java -cp work/gecko-integration/bridge-host local.pocketchat.BrowserBridgeRequestsTest | tee work/gecko-integration/bridge-host-results.json
        mkdir -p work/gecko-integration/reading-host
        javac -encoding UTF-8 -d work/gecko-integration/reading-host app/src/main/java/local/pocketchat/BrowserDisplay.java app/src/main/java/local/pocketchat/BrowserReadingPolicy.java app/src/main/java/local/pocketchat/BrowserReading.java tests/browser-reading-host/android/os/SystemClock.java tests/browser-reading-host/android/view/MotionEvent.java tests/browser-reading-host/local/pocketchat/ChatSession.java tests/browser-reading-host/local/pocketchat/BrowserReadingHostTest.java tests/browser-reading-host/local/pocketchat/BrowserReadingFocusScript.java
        java -cp work/gecko-integration/reading-host local.pocketchat.BrowserReadingHostTest | tee work/gecko-integration/reading-host-results.json
        node tests/browser-runtime/session-cookies.test.cjs | tee work/gecko-integration/cookie-host-results.json
        mkdir -p work/gecko-integration/region-host
        javac -encoding UTF-8 -d work/gecko-integration/region-host app/src/main/java/local/pocketchat/NodeRegion.java tests/browser-runtime/NodeRegionTest.java
        java -cp work/gecko-integration/region-host local.pocketchat.NodeRegionTest | tee work/gecko-integration/region-host-results.json
        mkdir -p work/gecko-integration/update-host
        javac -encoding UTF-8 -d work/gecko-integration/update-host app/src/main/java/local/pocketchat/Sha256.java app/src/main/java/local/pocketchat/AppUpdatePolicy.java tests/browser-runtime/AppUpdatePolicyTest.java
        java -cp work/gecko-integration/update-host local.pocketchat.AppUpdatePolicyTest | tee work/gecko-integration/update-host-results.json
        javac --add-modules jdk.httpserver -encoding UTF-8 -d work/gecko-integration/update-host app/src/main/java/local/pocketchat/Sha256.java app/src/main/java/local/pocketchat/AppUpdatePolicy.java app/src/main/java/local/pocketchat/AppUpdateTransfer.java tests/browser-runtime/AppUpdateTransferTest.java tests/browser-runtime/AppUpdateParallelTest.java
        java --add-modules jdk.httpserver -cp work/gecko-integration/update-host local.pocketchat.AppUpdateTransferTest | tee work/gecko-integration/update-transfer-host-results.json
        java --add-modules jdk.httpserver -cp work/gecko-integration/update-host local.pocketchat.AppUpdateParallelTest | tee work/gecko-integration/update-parallel-host-results.json
        mkdir -p work/gecko-integration/snapshot-host
        javac -encoding UTF-8 -d work/gecko-integration/snapshot-host app/src/main/java/local/pocketchat/FileSnapshotCache.java tests/browser-runtime/FileSnapshotCacheTest.java
        java -cp work/gecko-integration/snapshot-host local.pocketchat.FileSnapshotCacheTest | tee work/gecko-integration/snapshot-host-results.json
        npm install --prefix work/browser-perf-host --ignore-scripts --no-audit --no-fund jsdom@26.1.0
        JSDOM_MODULE="$PWD/work/browser-perf-host/node_modules/jsdom" node --test tests/appearance_lifecycle_test.cjs
        java -cp work/gecko-integration/reading-host local.pocketchat.BrowserReadingFocusScript > work/gecko-integration/reading-focus.js
        python3 tools/gecko/run_resource_observer_host.py --jsdom-module "$PWD/work/browser-perf-host/node_modules/jsdom" --output work/gecko-integration/resource-observer-host-results.json
        JSDOM_MODULE="$PWD/work/browser-perf-host/node_modules/jsdom" node tests/browser-reading-focus.cjs work/gecko-integration/reading-focus.js | tee work/gecko-integration/reading-focus-host-results.json
        JSDOM_MODULE="$PWD/work/browser-perf-host/node_modules/jsdom" node tests/browser-runtime/reply-observation.test.cjs | tee work/gecko-integration/reply-observation-host-results.json
        JSDOM_MODULE="$PWD/work/browser-perf-host/node_modules/jsdom" node tests/browser-runtime/reply-binding-loading.test.cjs | tee work/gecko-integration/reply-binding-host-results.json
        JSDOM_MODULE="$PWD/work/browser-perf-host/node_modules/jsdom" node tests/browser-runtime/interaction-scheduling.test.cjs | tee work/gecko-integration/interaction-host-results.json
        mkdir -p work/gecko-integration/browser-policy-host
        javac -encoding UTF-8 -d work/gecko-integration/browser-policy-host app/src/main/java/local/pocketchat/BrowserRuntimePolicy.java tests/browser-runtime/BrowserRuntimePolicyTest.java
        java -cp work/gecko-integration/browser-policy-host local.pocketchat.BrowserRuntimePolicyTest "$PWD" | tee work/gecko-integration/browser-runtime-policy-host-results.json
        JSDOM_MODULE="$PWD/work/browser-perf-host/node_modules/jsdom" node tests/browser-runtime/original-website-policy.test.cjs | tee work/gecko-integration/original-website-policy-host-results.json
        JSDOM_MODULE="$PWD/work/browser-perf-host/node_modules/jsdom" node tests/browser-runtime/continuity-driver-adapter.test.cjs | tee work/gecko-integration/continuity-driver-adapter-host-results.json
        mkdir -p work/gecko-integration/network-policy-host
        javac -encoding UTF-8 -d work/gecko-integration/network-policy-host app/src/main/java/local/pocketchat/NetworkPoolIdentity.java tests/browser-runtime/NetworkPoolIdentityTest.java app/src/main/java/local/pocketchat/LatencyProbePolicy.java tests/browser-runtime/LatencyProbePolicyTest.java
        java -cp work/gecko-integration/network-policy-host local.pocketchat.NetworkPoolIdentityTest | tee work/gecko-integration/network-pool-host-results.json
        java -cp work/gecko-integration/network-policy-host local.pocketchat.LatencyProbePolicyTest | tee work/gecko-integration/latency-probe-host-results.json
        python3 - <<'PYCODE'
        import json,pathlib,subprocess
        source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
        for name in ['network-pool-host-results.json','latency-probe-host-results.json','browser-runtime-policy-host-results.json','original-website-policy-host-results.json','continuity-driver-adapter-host-results.json','reading-host-results.json','reading-focus-host-results.json']:
            path=pathlib.Path('work/gecko-integration')/name
            report=json.loads(path.read_text())
            report['sourceCommit']=source
            path.write_text(json.dumps(report,indent=2)+'\n')
        PYCODE
    - name: Verify independent subscription catalogues and candidate snapshots
      run: |
        set -euo pipefail
        curl -fsSL --retry 3 https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o work/gecko-integration/catalog-json.jar
        echo '3cf6cd6892e32e2b4c1c39e0f52f5248a2f5b37646fdfbb79a66b46b618414ed  work/gecko-integration/catalog-json.jar' | sha256sum -c -
        curl -fsSL --retry 3 https://repo.maven.apache.org/maven2/org/yaml/snakeyaml/2.3/snakeyaml-2.3.jar -o work/gecko-integration/sharing-yaml.jar
        echo '63a76fe66b652360bd4c2c107e6f0258daa7d4bb492008ba8c26fcd230ff9146  work/gecko-integration/sharing-yaml.jar' | sha256sum -c -
        python3 tests/network-sharing-host/run.py --json-jar work/gecko-integration/catalog-json.jar --yaml-jar work/gecko-integration/sharing-yaml.jar
        curl -fsSL --retry 3 https://repo.maven.apache.org/maven2/com/vaadin/external/google/android-json/0.0.20131108.vaadin1/android-json-0.0.20131108.vaadin1.jar -o work/gecko-integration/sharing-android-json.jar
        echo 'dfb7bae2f404cfe0b72b4d23944698cb716b7665171812a0a4d0f5926c0fac79  work/gecko-integration/sharing-android-json.jar' | sha256sum -c -
        python3 tests/network-sharing-host/run.py --json-jar work/gecko-integration/sharing-android-json.jar --yaml-jar work/gecko-integration/sharing-yaml.jar
        python3 tests/network-catalog-host/run.py --json-jar work/gecko-integration/catalog-json.jar --output work/gecko-integration/network-catalog-host-results.json
        python3 tests/network-source-host/run.py --json-jar work/gecko-integration/catalog-json.jar --output work/gecko-integration/network-source-host-results.json
        python3 tests/network-lineage-host/run.py --json-jar work/gecko-integration/catalog-json.jar --output work/gecko-integration/network-lineage-host-results.json
        python3 tests/sealed-file-host/run.py --output work/gecko-integration/sealed-file-host-results.json
        python3 - <<'PYCODE'
        import json,pathlib,subprocess
        source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
        for name in ['network-catalog-host-results.json','network-source-host-results.json','network-lineage-host-results.json','sealed-file-host-results.json']:
            path=pathlib.Path('work/gecko-integration')/name
            report=json.loads(path.read_text()); report['sourceCommit']=source
            path.write_text(json.dumps(report,indent=2)+'\n')
        PYCODE
    - name: Verify versioned environment models and authoritative intents
      run: |
        set -euo pipefail
        python3 tools/gecko/run_profile_host_checks.py --json-jar work/gecko-integration/catalog-json.jar --network-reports work/gecko-integration
        cp work/profile-host/resource-pressure-host-results.json work/gecko-integration/resource-pressure-host-results.json
        cp work/profile-host/results.json work/gecko-integration/profile-host-results.json
        cp work/profile-host/caret-document-observer-host-results.json work/gecko-integration/caret-document-observer-host-results.json
        cp work/profile-host/identity-controller-host-results.json work/gecko-integration/identity-controller-host-results.json
        cp work/profile-host/deferred-browser-host-results.json work/gecko-integration/deferred-browser-host-results.json
        cp work/profile-host/identity-bridge-host-results.json work/gecko-integration/identity-bridge-host-results.json
        cp work/profile-host/environment-intent-host-results.json work/gecko-integration/environment-intent-host-results.json
        cp work/profile-host/gecko-proxy-route-host-results.json work/gecko-integration/gecko-proxy-route-host-results.json
        JSDOM_MODULE="$PWD/work/browser-perf-host/node_modules/jsdom" python3 -m unittest discover -s tests -p 'profile_*_test.py'
        python3 -m unittest discover -s tests -p 'gecko_caret_*_test.py'
        python3 -m unittest discover -s tests -p 'gecko_ui_visual_capture_test.py'
        python3 -m unittest discover -s tests -p 'gecko_ci_bundle_test.py'
        python3 -m unittest discover -s tests -p 'gecko_network_ui_route_test.py'
        python3 -m unittest discover -s tests -p 'gecko_emulator_bootstrap_test.py'
        python3 -m unittest discover -s tests -p 'gecko_event_transfer_test.py'
        if [ -f tools/gecko/release_channel_contract_test.py ]; then
          python3 tools/gecko/release_channel_contract_test.py
        fi
    - name: Prepare synthetic signed upgrade archives
      shell: bash
      run: |
        set -euo pipefail
        exec > >(tee work/gecko-integration/update-fixture-preparation.log) 2>&1
        tools="$ANDROID_HOME/build-tools/37.0.0"
        python3 - <<'PYCODE'
        import pathlib,re
        code=int(re.search(r'versionCode ([0-9]+)',pathlib.Path('app/build.gradle').read_text()).group(1))+1
        text=pathlib.Path('tests/gecko/update-fixture.xml').read_text().replace('android:versionCode="1"',f'android:versionCode="{code}"')
        pathlib.Path('work/gecko-integration/update-fixture.xml').write_text(text)
        PYCODE
        "$tools/aapt2" link -I "$ANDROID_HOME/platforms/android-37.1/android.jar" --manifest work/gecko-integration/update-fixture.xml -o work/gecko-integration/update-fixture-unsigned.apk
        python3 - <<'PYCODE'
        import zipfile
        with zipfile.ZipFile('work/gecko-integration/update-fixture-unsigned.apk','a',compression=zipfile.ZIP_STORED) as archive:
            archive.writestr('assets/resume-fixture.bin', bytes(range(256)) * 4096)
        PYCODE
        "$tools/apksigner" sign --ks work/gecko-integration/integration-test.jks --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out work/gecko-integration/update-fixture.apk work/gecko-integration/update-fixture-unsigned.apk
        keytool -genkeypair -keystore work/gecko-integration/update-wrong-key.jks -alias fixture -storepass android -keypass android -dname CN=Synthetic -keyalg RSA -validity 2
        "$tools/apksigner" sign --ks work/gecko-integration/update-wrong-key.jks --ks-key-alias fixture --ks-pass pass:android --key-pass pass:android --out work/gecko-integration/update-wrong-signer.apk work/gecko-integration/update-fixture-unsigned.apk
    - name: Publish unsigned build for local original signing
      run: python3 tools/gecko/publish_ci.py
    - name: Seal one source/run-bound build for every Android phase
      run: python3 tools/gecko/ci_bundle.py pack --kind build --bundle work/ci-build/bundle.tar.gz
    - name: Transfer exact compiled APKs and SDK inputs
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: gecko-${{ github.run_id }}-${{ github.run_attempt }}-build
        path: work/ci-build/bundle.tar.gz
        if-no-files-found: error
        retention-days: 1
        compression-level: 0
  android:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        phase:
        - ui
        - editing
        - files
        - connections
        - profiles
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Download the immutable compiled build
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
      with:
        name: gecko-${{ github.run_id }}-${{ github.run_attempt }}-build
        path: work/ci-build
    - name: Restore exact build and verify its source/run/byte hashes
      run: python3 tools/gecko/ci_bundle.py restore --kind build --bundle work/ci-build/bundle.tar.gz
    - name: Prepare Android runtime only
      shell: bash
      run: |
        set -euo pipefail
        echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
        echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
        echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.1' 'build-tools;37.0.0'
        python3 tools/gecko/prepare_android_image.py --component emulator --sdk-root "$ANDROID_HOME" --cache work/android-image --report work/gecko-integration/android-emulator-package-results.json
        python3 tools/gecko/prepare_android_image.py --sdk-root "$ANDROID_HOME" --cache work/android-image --report work/gecko-integration/android-system-image-results.json
    - name: Boot Android for native acceptance
      shell: bash
      run: |
        set -euo pipefail
        exec > >(tee work/gecko-integration/native-test.log) 2>&1
        export ANDROID_AVD_HOME="$PWD/work/gecko-integration/avd"
        export ANDROID_USER_HOME="$PWD/work/gecko-integration/android-user"
        export ANDROID_EMULATOR_HOME="$PWD/work/gecko-integration/emulator-home"
        mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME" "$ANDROID_EMULATOR_HOME"
        sudo chmod a+rw /dev/kvm
        echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force -n geckoproduction -p "$ANDROID_AVD_HOME/geckoproduction.avd" -k 'system-images;android-35;google_apis;x86_64'
        adb start-server
        "$ANDROID_HOME/emulator/emulator" -avd geckoproduction -no-window -no-audio -no-snapshot -no-boot-anim -no-metrics -accel on -port 5554 -gpu swiftshader -memory 3072 -cores 2 > work/gecko-integration/emulator.log 2>&1 &
        timeout 180 adb wait-for-device
        timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
        adb shell input keyevent 82
        adb install app/build/outputs/apk/integration/app-x86_64-integration.apk
        python3 tools/gecko/prepare_emulator.py --adb "$(command -v adb)" --serial emulator-5554 --apk app/build/outputs/apk/integration/app-x86_64-integration.apk
    - name: Verify network performance and compact chrome
      shell: bash
      run: |
        set -euo pipefail
        exec > >(tee -a work/gecko-integration/native-test.log) 2>&1
        echo "Starting phase: Verify network performance and compact chrome"
        checks_failed=0
        if ! python3 tests/gecko/run_network_performance.py --adb "$(command -v adb)" --serial emulator-5554; then
          checks_failed=1
        fi
        if ! python3 tests/gecko/run_quiet_notifications.py --adb "$(command -v adb)" --serial emulator-5554; then
          checks_failed=1
        fi
        if ! python3 tests/gecko/run_ui_visuals.py --adb "$(command -v adb)" --serial emulator-5554; then
          checks_failed=1
        fi
        python3 tools/gecko/publish_ci.py
        if [ "$checks_failed" -ne 0 ]; then exit 1; fi
      if: ${{ matrix.phase == 'ui' }}
    - name: Verify editing on a clean Android device
      id: editing
      shell: bash
      run: |
        set -euo pipefail
        exec > >(tee -a work/gecko-integration/native-test.log) 2>&1
        adb shell am force-stop local.pocketchat.test
        adb shell pm clear local.pocketchat.test
        adb shell pm grant local.pocketchat.test android.permission.POST_NOTIFICATIONS
        checks_failed=0
        if python3 tools/gecko/run_caret_editing_phase.py --adb "$(command -v adb)" --serial emulator-5554 --root "$PWD" --out work/gecko-integration --build-receipt work/gecko-integration/caret-apk-build-receipt.json --sdk-receipt work/native-caret-sdk/sdk-build-receipt.json --sdk-aar work/native-caret-sdk/geckoview-caret.aar --official-sdk-aar work/gecko-integration/geckoview.aar --integration-apk app/build/outputs/apk/integration/app-x86_64-integration.apk --release-apk app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk; then
          :
        else
          editing_status=$?
          # Only an ordinary fixture failure after verified HOME restoration
          # may continue collecting the remaining independent evidence.
          if [ "$editing_status" -ne 1 ]; then exit "$editing_status"; fi
          checks_failed=1
        fi
        # An ordinary input fixture failure remains a failed qualification,
        # but must not prevent independent UI/network evidence collection.
        if [ "$checks_failed" -ne 0 ]; then echo 'fixture_failed=true' >> "$GITHUB_OUTPUT"; fi
      if: ${{ matrix.phase == 'editing' }}
    - name: Verify network sharing and explicit import UI
      if: ${{ matrix.phase == 'ui' }}
      shell: bash
      run: |
        set -euo pipefail
        exec > >(tee -a work/gecko-integration/native-test.log) 2>&1
        echo "Starting phase: Verify network sharing and explicit import UI"
        adb shell am force-stop local.pocketchat.test
        adb shell pm clear local.pocketchat.test
        adb shell pm grant local.pocketchat.test android.permission.POST_NOTIFICATIONS
        result=0
        python3 tests/gecko/run_network_sharing.py --adb "$(command -v adb)" --serial emulator-5554 || result=$?
        python3 tools/gecko/publish_ci.py
        exit "$result"
    - name: Verify system and manual appearance without recreation
      shell: bash
      run: |
        set -euo pipefail
        exec > >(tee -a work/gecko-integration/native-test.log) 2>&1
        result=0
        python3 tests/gecko/run_appearance.py --adb "$(command -v adb)" --serial emulator-5554 || result=$?
        python3 tools/gecko/publish_ci.py
        exit "$result"
      if: ${{ matrix.phase == 'ui' }}
    - name: Verify production environments and file transfers
      shell: bash
      run: |
        set -euo pipefail
        exec > >(tee -a work/gecko-integration/native-test.log) 2>&1
        echo "Starting phase: Verify production environments and file transfers"
        checks_failed=0
        adb shell am force-stop local.pocketchat.test
        adb shell pm clear local.pocketchat.test
        if ! python3 tests/gecko/run_device.py --adb "$(command -v adb)" --serial emulator-5554; then
          checks_failed=1
        fi
        adb exec-out screencap -p > work/gecko-integration/device-screen.png
        if ! python3 tests/gecko/run_update_route.py --adb "$(command -v adb)" --serial emulator-5554; then
          checks_failed=1
        fi
        if [ "$checks_failed" -ne 0 ]; then exit 1; fi
      if: ${{ matrix.phase == 'files' }}
    - name: Verify browser connection reuse and preauthentication
      shell: bash
      run: |
        set -euo pipefail
        exec > >(tee -a work/gecko-integration/native-test.log) 2>&1
        echo "Starting phase: Verify browser connection reuse and preauthentication"
        checks_failed=0
        if ! python3 tests/gecko/run_native_probe.py --adb "$(command -v adb)" --serial emulator-5554; then
          checks_failed=1
        fi
        if ! python3 tests/gecko/run_ui_fixes.py --adb "$(command -v adb)" --serial emulator-5554; then
          checks_failed=1
        fi
        if ! python3 tests/gecko/run_gecko_pool.py --adb "$(command -v adb)" --serial emulator-5554; then
          checks_failed=1
        fi
        if ! python3 tests/gecko/run_preconnect.py --adb "$(command -v adb)" --serial emulator-5554; then
          checks_failed=1
        fi
        if [ "$checks_failed" -ne 0 ]; then exit 1; fi
      if: ${{ matrix.phase == 'connections' }}
    - name: Verify subscription storage and selection UI
      shell: bash
      run: |
        set -euo pipefail
        exec > >(tee -a work/gecko-integration/native-test.log) 2>&1
        echo "Starting phase: Verify subscription storage and selection UI"
        checks_failed=0
        if ! python3 tests/gecko/run_network_sources.py --adb "$(command -v adb)" --serial emulator-5554; then
          checks_failed=1
        fi
        if ! python3 tests/gecko/run_network_sources_ui.py --adb "$(command -v adb)" --serial emulator-5554 --expected-apk-sha "$(python3 -c 'import hashlib,pathlib;print(hashlib.sha256(pathlib.Path("app/build/outputs/apk/integration/app-x86_64-integration.apk").read_bytes()).hexdigest())')"; then
          checks_failed=1
        fi
        if [ "$checks_failed" -ne 0 ]; then exit 1; fi
      if: ${{ matrix.phase == 'connections' }}
    - name: Verify fixed-exit routing and deferred application
      shell: bash
      run: |
        set -euo pipefail
        exec > >(tee -a work/gecko-integration/native-test.log) 2>&1
        echo "Starting phase: Verify fixed-exit routing and deferred application"
        checks_failed=0
        if ! python3 tests/gecko/run_network_sources_route.py --adb "$(command -v adb)" --serial emulator-5554; then
          checks_failed=1
        fi
        if ! python3 tests/gecko/run_network_safe_idle.py --adb "$(command -v adb)" --serial emulator-5554 --expected-apk-sha "$(python3 -c 'import hashlib,pathlib;print(hashlib.sha256(pathlib.Path("app/build/outputs/apk/integration/app-x86_64-integration.apk").read_bytes()).hexdigest())')"; then
          checks_failed=1
        fi
        if [ "$checks_failed" -ne 0 ]; then exit 1; fi
      if: ${{ matrix.phase == 'connections' }}
    - name: Verify environment templates and resource policy
      shell: bash
      run: |
        set -euo pipefail
        exec > >(tee -a work/gecko-integration/native-test.log) 2>&1
        echo "Starting phase: Verify environment templates and resource policy"
        checks_failed=0
        # Preserve the original input/performance baseline before new fixtures.
        if ! python3 tests/gecko/run_profile_features.py --adb "$(command -v adb)" --serial emulator-5554 --apk app/build/outputs/apk/integration/app-x86_64-integration.apk; then
          checks_failed=1
        fi
        if [ "$checks_failed" -ne 0 ]; then exit 1; fi
      if: ${{ matrix.phase == 'profiles' }}
    - name: Preserve emulator and runner health
      if: always()
      shell: bash
      run: |
        mkdir -p work/gecko-integration
        {
          date -u
          free -m
          ps -eo pid,comm,rss --sort=-rss | sed -n '1,20p'
          if [ -r /sys/fs/cgroup/memory.events ]; then cat /sys/fs/cgroup/memory.events; fi
        } > work/gecko-integration/runner-health.txt
    - name: Seal this Android phase evidence
      run: python3 tools/gecko/ci_bundle.py pack --kind phase --phase "${{ matrix.phase }}" --bundle work/ci-phase/bundle.tar.gz
      if: always()
    - name: Preserve source/run-bound phase evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: gecko-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.phase }}
        path: work/ci-phase/bundle.tar.gz
        if-no-files-found: error
        retention-days: 1
        compression-level: 0
    - name: Preserve failed editing qualification
      if: ${{ always() && matrix.phase == 'editing' && steps.editing.outputs.fixture_failed == 'true' }}
      run: |
        echo 'Input compatibility fixture failed. Independent reports do not qualify this input behavior as passed.'
        exit 1
  editing-samples:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        sample: ['1', '2']
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Download the immutable compiled build
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
      with:
        name: gecko-${{ github.run_id }}-${{ github.run_attempt }}-build
        path: work/ci-build
    - name: Restore exact build and verify its source/run/byte hashes
      run: python3 tools/gecko/ci_bundle.py restore --kind build --bundle work/ci-build/bundle.tar.gz
    - name: Prepare Android runtime only
      shell: bash
      run: |
        set -euo pipefail
        echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
        echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
        echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.1' 'build-tools;37.0.0'
        python3 tools/gecko/prepare_android_image.py --component emulator --sdk-root "$ANDROID_HOME" --cache work/android-image --report work/gecko-integration/android-emulator-package-results.json
        python3 tools/gecko/prepare_android_image.py --sdk-root "$ANDROID_HOME" --cache work/android-image --report work/gecko-integration/android-system-image-results.json
    - name: Boot Android for native acceptance
      shell: bash
      run: |
        set -euo pipefail
        exec > >(tee work/gecko-integration/native-test.log) 2>&1
        export ANDROID_AVD_HOME="$PWD/work/gecko-integration/avd"
        export ANDROID_USER_HOME="$PWD/work/gecko-integration/android-user"
        export ANDROID_EMULATOR_HOME="$PWD/work/gecko-integration/emulator-home"
        mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME" "$ANDROID_EMULATOR_HOME"
        sudo chmod a+rw /dev/kvm
        echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force -n geckoproduction -p "$ANDROID_AVD_HOME/geckoproduction.avd" -k 'system-images;android-35;google_apis;x86_64'
        adb start-server
        "$ANDROID_HOME/emulator/emulator" -avd geckoproduction -no-window -no-audio -no-snapshot -no-boot-anim -no-metrics -accel on -port 5554 -gpu swiftshader -memory 3072 -cores 2 > work/gecko-integration/emulator.log 2>&1 &
        timeout 180 adb wait-for-device
        timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
        adb shell input keyevent 82
        adb install app/build/outputs/apk/integration/app-x86_64-integration.apk
        python3 tools/gecko/prepare_emulator.py --adb "$(command -v adb)" --serial emulator-5554 --apk app/build/outputs/apk/integration/app-x86_64-integration.apk
    - name: Run one original workload on this independent Android device
      shell: bash
      run: |
        set -euo pipefail
        exec > >(tee -a work/gecko-integration/native-test.log) 2>&1
        adb shell am force-stop local.pocketchat.test
        adb shell pm clear local.pocketchat.test
        adb shell pm grant local.pocketchat.test android.permission.POST_NOTIFICATIONS
        python3 tools/gecko/run_caret_editing_phase.py --adb "$(command -v adb)" --serial emulator-5554 --root "$PWD" --out work/gecko-integration --build-receipt work/gecko-integration/caret-apk-build-receipt.json --sdk-receipt work/native-caret-sdk/sdk-build-receipt.json --sdk-aar work/native-caret-sdk/geckoview-caret.aar --official-sdk-aar work/gecko-integration/geckoview.aar --integration-apk app/build/outputs/apk/integration/app-x86_64-integration.apk --release-apk app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk
    - name: Preserve and verify this sample without replay
      if: ${{ always() }}
      run: python3 tools/gecko/key_order_samples.py stage --sample '${{ matrix.sample }}' --input work/gecko-integration --out work/key-order-sample
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: key-order-${{ github.run_id }}-${{ github.run_attempt }}-sample-${{ matrix.sample }}
        path: work/key-order-sample/
        if-no-files-found: error
        retention-days: 5
  verify:
    needs:
    - build
    - android
    - editing-samples
    if: ${{ always() && needs.build.result == 'success' && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Collect this run and attempt only
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
      with:
        pattern: gecko-${{ github.run_id }}-${{ github.run_attempt }}-*
        path: work/ci-artifacts
    - name: Verify and combine exact build and all five Android phases
      shell: bash
      run: |
        set -euo pipefail
        prefix="work/ci-artifacts/gecko-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        python3 tools/gecko/ci_bundle.py restore --kind build --bundle "${prefix}-build/bundle.tar.gz"
        for phase in ui editing files connections profiles; do
          python3 tools/gecko/ci_bundle.py restore --kind phase --phase "$phase" --bundle "${prefix}-${phase}/bundle.tar.gz"
        done
    - name: Publish combined synthetic evidence
      run: python3 tools/gecko/publish_ci.py
    - name: Collect every predeclared independent input sample
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
      with:
        pattern: key-order-${{ github.run_id }}-${{ github.run_attempt }}-sample-*
        path: work/key-order-samples
    - name: Require all three unchanged editing workloads on the same APK
      run: python3 tools/gecko/key_order_samples.py collect --ordinary work/gecko-integration/public --samples work/key-order-samples --out work/gecko-integration/public/key-order-samples-results.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: key-order-${{ github.run_id }}-${{ github.run_attempt }}-summary
        path: work/gecko-integration/public/key-order-samples-results.json
        if-no-files-found: error
        retention-days: 5
    - name: Require every original release acceptance gate
      env:
        ANDROID_RESULT: ${{ needs.android.result }}
        INPUT_SAMPLES_RESULT: ${{ needs.editing-samples.result }}
      run: |
        set -euo pipefail
        python3 - <<'PYCODE'
        import os,pathlib,sys
        sys.path.insert(0,'tools')
        from gecko.check_performance_evidence import verify_performance_evidence
        from gecko.check_connection_evidence import verify_connection_evidence
        from gecko.check_interaction_transfer_evidence import verify_interaction_transfer_evidence
        from gecko.check_profile_evidence import verify_profile_evidence
        from gecko.check_template_evidence import verify_template_evidence
        from gecko.check_resource_evidence import verify_resource_evidence
        from gecko.check_chain_evidence import verify_chain_evidence
        from gecko.check_client_evidence import verify_client_evidence
        from gecko.check_sdk_build_evidence import verify_sdk_build_evidence
        from gecko.check_caret_compat_evidence import verify_caret_evidence
        assert os.environ['INPUT_SAMPLES_RESULT']=='success','Every predeclared independent input sample must succeed'
        assert os.environ['ANDROID_RESULT']=='success','Every independent Android phase must succeed'
        directory=pathlib.Path('work/gecko-integration/public');source=os.environ['GITHUB_SHA']
        for check in (verify_performance_evidence,verify_connection_evidence,verify_interaction_transfer_evidence,verify_profile_evidence,verify_template_evidence,verify_resource_evidence,verify_chain_evidence,verify_client_evidence,verify_sdk_build_evidence,verify_caret_evidence):
            check(directory,source)
            print(check.__name__+': passed',flush=True)
        PYCODE
