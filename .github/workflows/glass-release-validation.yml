name: Real glass release UI validation
on:
  push:
    branches: ['codex/compact-glass-reading']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: glass-release-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  glass-device-acceptance:
    name: Glass UI acceptance (API ${{ matrix.device-api }})
    strategy:
      fail-fast: false
      matrix:
        device-api: [35, 32]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify core and prepare locked SDK toolchain
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build-mihomo.py --verify
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          mkdir -p work/profile-build
          "$JAVA_HOME_17_X64/bin/keytool" -genkeypair -keystore work/profile-build/integration-test.jks -alias androiddebugkey -storepass android -keypass android -dname CN=SyntheticIntegration -keyalg RSA -validity 2
          if ! curl -fsSL --retry 3 https://services.gradle.org/distributions/gradle-9.8.0-bin.zip -o work/profile-build/gradle.zip; then
            curl -fLsS --retry 2 --max-time 240 -H 'Accept: application/octet-stream' -H 'X-GitHub-Api-Version: 2022-11-28' https://api.github.com/repos/gradle/gradle-distributions/releases/assets/586068844 -o work/profile-build/gradle.zip
          fi
          test "$(stat -c %s work/profile-build/gradle.zip)" = 151611662
          echo 'bafd5ce9cfaea0fbccfdc8439a1ac42fbd4cd9c89dc9a988228d8a2639a58e6c  work/profile-build/gradle.zip' | sha256sum -c -
          unzip -q work/profile-build/gradle.zip -d work/profile-build/gradle
          task_sdk_url=https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/157.0.20261005135250/geckoview-157.0.20261005135250
          curl -fsSL --retry 3 "$task_sdk_url.aar" -o work/profile-build/geckoview.aar
          curl -fsSL --retry 3 "$task_sdk_url.pom" -o work/profile-build/geckoview.pom
          curl -fsSL --retry 3 "$task_sdk_url-sources.jar" -o work/profile-build/geckoview-sources.jar
          echo '15f1edf3c58abcdaf2783f299b8c19c3a36272d348969106a9009671fef8d268  work/profile-build/geckoview.aar' | sha256sum -c -
          python3 tools/gecko/verify_official_sdk.py --aar work/profile-build/geckoview.aar --pom work/profile-build/geckoview.pom --sources work/profile-build/geckoview-sources.jar --upstream-only
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.1' 'build-tools;37.0.0'
          export JAVA_HOME="$JAVA_HOME_17_X64"
          python3 tools/gecko/caret_workflow.py prepare --work work/profile-build
      - name: Compile release and test APKs with the source-derived SDK; run lint
        shell: bash
        run: |
          set -euo pipefail
          work/profile-build/gradle/gradle-9.8.0/bin/gradle :app:assembleRelease :app:assembleIntegration :app:lintRelease :app:writeCaretResolvedArtifacts -PtestSigningKey="$PWD/work/profile-build/integration-test.jks" --console=plain 2>&1 | tee work/profile-build/build.log
          python3 tools/gecko/verify_official_sdk.py --aar work/profile-build/geckoview.aar --pom work/profile-build/geckoview.pom --sources work/profile-build/geckoview-sources.jar --upstream-only | tee work/profile-build/official-sdk-verification.json
          python3 tools/gecko/caret_workflow.py record --work work/profile-build
      - name: Check integration stamp and keep it out of release APKs
        shell: bash
        run: |
          set -euo pipefail
          if [ -f tests/gecko/run_profile_features.py ]; then
            python3 - <<'PYCODE'
          import importlib.util,json,pathlib,re,subprocess,zipfile
          root=pathlib.Path.cwd()
          spec=importlib.util.spec_from_file_location('profile_runner',root/'tests/gecko/run_profile_features.py')
          runner=importlib.util.module_from_spec(spec);spec.loader.exec_module(runner)
          source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          settings=(root/'app/build.gradle').read_text()
          version=re.search(r"versionName '([0-9]+\.[0-9]+\.[0-9]+)'",settings).group(1)
          code=int(re.search(r'versionCode ([0-9]+)',settings).group(1))
          integration=sorted((root/'app/build/outputs/apk/integration').glob('app-*-integration.apk'))
          release=sorted((root/'app/build/outputs/apk/release').glob('app-*-release-unsigned.apk'))
          assert len(integration)==2 and len(release)==2,'Both pinned ABI variants must be built'
          identities=[runner.expected_build(apk,source,tree,version,code) for apk in integration]
          for apk in release:
              with zipfile.ZipFile(apk) as archive:
                  assert runner.STAMP not in archive.namelist(),'Integration source stamp leaked into release APK'
          (root/'work/profile-build/integration-stamps.json').write_text(json.dumps({'status':'passed','actualAndroidExecution':False,'sourceCommit':source,'scope':'Built APK bytes and metadata only; not installed or executed','integration':identities},indent=2)+'\n')
          PYCODE
          fi
      - name: State build verification scope
        run: |
          printf '%s\n' 'Pinned upstream SDK verification, reviewed single-class source build, release/test APK compilation and lint passed. APKs remain unsigned or signed with an ephemeral synthetic key. No emulator/ARM execution, real ChatGPT login or WAN measurement is implied; no release is published.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain the actual glass navigation integration APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: glass-navigation-apk-api${{ matrix.device-api }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/outputs/apk/integration/app-x86_64-integration.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Prepare the pinned disposable Android ${{ matrix.device-api }} emulator
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/glass-navigation
          exec > >(tee work/glass-navigation/setup.log) 2>&1
          cat > work/glass-navigation/host-resources.sh <<'SH'
          set -u
          date -u
          free -m
          ps -eo pid,ppid,stat,rss,comm --sort=-rss
          cat /proc/self/cgroup
          task_glass_cgroup=$(awk -F: '$1 == "0" {print $3}' /proc/self/cgroup)
          for task_glass_group in "/sys/fs/cgroup${task_glass_cgroup:-/}" /sys/fs/cgroup; do
            for task_glass_counter in memory.current memory.max memory.peak memory.events; do
              task_glass_file="$task_glass_group/$task_glass_counter"
              if [ -r "$task_glass_file" ]; then
                printf '%s\n' "$task_glass_file"
                cat "$task_glass_file"
              fi
            done
          done
          SH
          bash work/glass-navigation/host-resources.sh > work/glass-navigation/resources-before-gradle-stop.txt
          timeout 60 work/profile-build/gradle/gradle-9.8.0/bin/gradle --stop --console=plain 2>&1 | tee work/glass-navigation/gradle-stop.log
          bash work/glass-navigation/host-resources.sh > work/glass-navigation/resources-after-gradle-stop.txt
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          python3 tools/gecko/prepare_android_image.py --component emulator --sdk-root "$ANDROID_HOME" --cache work/glass-navigation/packages --report work/glass-navigation/emulator-package.json
          if [ "${{ matrix.device-api }}" = 32 ]; then
            python3 tools/gecko/prepare_android32_image.py --sdk-root "$ANDROID_HOME" --cache work/glass-navigation/packages --report work/glass-navigation/system-image.json
          else
            python3 tools/gecko/prepare_android_image.py --sdk-root "$ANDROID_HOME" --cache work/glass-navigation/packages --report work/glass-navigation/system-image.json
          fi
          python3 tools/gecko/prepare_platform_tools.py --sdk-root "$ANDROID_HOME" --cache work/glass-navigation/packages --report work/glass-navigation/platform-tools.json
          export ANDROID_AVD_HOME="$PWD/work/glass-navigation/avd"
          export ANDROID_USER_HOME="$PWD/work/glass-navigation/android-user"
          export ANDROID_EMULATOR_HOME="$PWD/work/glass-navigation/emulator-home"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME" "$ANDROID_EMULATOR_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force -n glassnavigation -p "$ANDROID_AVD_HOME/glassnavigation.avd" -k 'system-images;android-${{ matrix.device-api }};google_apis;x86_64'
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ['ANDROID_AVD_HOME']) / 'glassnavigation.avd/config.ini'
          display = {'hw.lcd.width': '1236', 'hw.lcd.height': '2676', 'hw.lcd.density': '480',
                     'hw.initialOrientation': 'Portrait', 'skin.name': '1236x2676',
                     'skin.path': '_no_skin', 'showDeviceFrame': 'no'}
          lines = [line for line in path.read_text().splitlines() if line.split('=', 1)[0] not in display]
          path.write_text('\n'.join(lines + [key + '=' + value for key, value in display.items()]) + '\n')
          PY
          cat > work/glass-navigation/emulator-supervisor.sh <<'SH'
          set -uo pipefail
          # ANGLE supplies GLES to Android HWUI. API 32 exercises the app's
          # CPU fallback; software GLES on API 35 is still the HWUI glass path.
          "$ANDROID_HOME/emulator/emulator" -avd glassnavigation -no-window -no-audio -no-snapshot -no-boot-anim -no-metrics -accel on -port 5554 -gpu swangle -feature -Vulkan -memory 3072 -cores 2 < /dev/null > work/glass-navigation/emulator.log 2>&1 &
          task_glass_pid=$!
          printf '%s\n' "$task_glass_pid" > work/glass-navigation/emulator.pid
          printf 'emulator_pid=%s\n' "$task_glass_pid"
          if wait "$task_glass_pid"; then task_glass_exit=0; else task_glass_exit=$?; fi
          printf '%s\n' "$task_glass_exit" > work/glass-navigation/emulator-exit.txt
          printf 'emulator_exit=%s\n' "$task_glass_exit"
          exit "$task_glass_exit"
          SH
          nohup bash work/glass-navigation/emulator-supervisor.sh < /dev/null > work/glass-navigation/emulator-supervisor.log 2>&1 &
          timeout 5 bash -c 'until [ -s work/glass-navigation/emulator.pid ]; do sleep 0.1; done'
          task_glass_pid=$(cat work/glass-navigation/emulator.pid)
          kill -0 "$task_glass_pid"
          test ! -f work/glass-navigation/emulator-exit.txt
          timeout 60 "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 wait-for-device
          task_glass_booted=false
          for task_glass_attempt in $(seq 1 120); do
            kill -0 "$task_glass_pid"
            test ! -f work/glass-navigation/emulator-exit.txt
            if [ "$(timeout 5 "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then
              task_glass_booted=true
              break
            fi
            sleep 1
          done
          test "$task_glass_booted" = true
      - name: Run real glass rendering, input and layout acceptance
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          task_glass_pid=$(cat work/glass-navigation/emulator.pid)
          kill -0 "$task_glass_pid"
          test ! -f work/glass-navigation/emulator-exit.txt
          test "$(timeout 5 "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 get-state)" = device
          python3 tools/gecko/capture_glass_navigation.py \
            --root "$PWD" --apk app/build/outputs/apk/integration/app-x86_64-integration.apk \
            --build-work work/profile-build --adb "$ANDROID_HOME/platform-tools/adb" \
            --serial emulator-5554 --aapt2 "$ANDROID_HOME/build-tools/37.0.0/aapt2" \
            --apksigner "$ANDROID_HOME/build-tools/37.0.0/apksigner" \
            --out work/glass-navigation --acceptance-suite --device-api ${{ matrix.device-api }} 2>&1 | tee work/glass-navigation/capture.log
      - name: Keep acceptance diagnostics and stop the disposable emulator
        if: always()
        shell: bash
        run: |
          if [ -f work/glass-navigation/host-resources.sh ]; then
            bash work/glass-navigation/host-resources.sh > work/glass-navigation/resources-after-capture.txt 2>&1 || true
            sudo dmesg --color=never | rg -i 'oom|out of memory|kill' > work/glass-navigation/kernel-oom.txt || true
            sudo dmesg --color=never | rg -i 'segfault|general protection|qemu-system|emulator' > work/glass-navigation/kernel-emulator.txt || true
          fi
          if [ -f work/glass-navigation/emulator.pid ]; then
            timeout 15 "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 logcat -d -s 'PocketUiVisual:I' 'AndroidRuntime:E' '*:S' > work/glass-navigation/final-logcat.txt 2>&1 || true
            timeout 10 "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 emu kill > work/glass-navigation/emulator-stop.txt 2>&1 || true
            task_glass_pid=$(cat work/glass-navigation/emulator.pid)
            if kill -0 "$task_glass_pid" 2>/dev/null; then
              kill "$task_glass_pid" 2>/dev/null || true
            fi
            for task_glass_attempt in $(seq 1 20); do
              if [ -f work/glass-navigation/emulator-exit.txt ]; then break; fi
              sleep 0.25
            done
          fi
      - name: Upload glass acceptance cases, recordings and raw diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: glass-navigation-acceptance-api${{ matrix.device-api }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            work/glass-navigation/**/*.png
            work/glass-navigation/**/*.mp4
            work/glass-navigation/**/*.raw
            work/glass-navigation/**/*.xml
            work/glass-navigation/**/*.json
            work/glass-navigation/**/*.log
            work/glass-navigation/**/*.txt
      - name: Preserve build logs and lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: glass-build-evidence-api${{ matrix.device-api }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/profile-build/build.log
            work/profile-build/official-sdk-verification.json
            work/profile-build/integration-stamps.json
            work/profile-build/sdk-build-receipt.json
            work/profile-build/derived-sdk-verification.json
            work/profile-build/derived-sdk-input.json
            work/profile-build/caret-apk-build-receipt.json
            work/native-caret-sdk/derived-sdk-compilation.json
            work/native-caret-sdk/compile/*-javac.log
            app/build/reports/lint-results-release.*
          if-no-files-found: ignore
