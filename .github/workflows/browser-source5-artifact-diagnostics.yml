name: Read fixed Source5 browser failure artifact (diagnostic only)
'on':
  push:
    branches:
    - diagnostics/browser-2.1.0-source5
    paths:
    - .github/workflows/browser-source5-artifact-diagnostics.yml
permissions:
  actions: read
  contents: read
jobs:
  read_existing_artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: Verify fixed metadata and print bounded source-bound diagnostic bytes
      shell: bash
      run: "set -euo pipefail\nmkdir -p diagnostic-input\ngh api repos/Ararataki-number-one/yuanying-chat/actions/runs/41850471416 > diagnostic-input/run.json\ngh api repos/Ararataki-number-one/yuanying-chat/git/commits/e21b4fd6698074310ee36f85f980b16ad643c934 > diagnostic-input/source.json\ngh api repos/Ararataki-number-one/yuanying-chat/actions/artifacts/13336192988 > diagnostic-input/artifact.json\ngh api repos/Ararataki-number-one/yuanying-chat/actions/artifacts/13336192988/zip > diagnostic-input/artifact.zip\npython3 - <<'PYCODE'\nimport base64,hashlib,json,pathlib,re,stat,zipfile\nREPO='Ararataki-number-one/yuanying-chat';REPO_ID=1401080063\nRUN=41850471416;ATTEMPT=1;ARTIFACT=13336192988\nSOURCE='e21b4fd6698074310ee36f85f980b16ad643c934';TREE='cee24c278512c18926edf3db5102c87958f6b699'\nNAME='browser-41850471416-1-android';SIZE=66420\nSHA='dd27aa9a338a272415a67b379c8551ab746d24b152562efe77613039c72aa52c'\nLIMIT=1024*1024;CHUNK=8192\nroot=pathlib.Path('diagnostic-input')\ndef require(condition,message):\n    if not condition:raise ValueError(message)\nrun=json.loads((root/'run.json').read_text());artifact=json.loads((root/'artifact.json').read_text());commit=json.loads((root/'source.json').read_text())\nrequire(run['id']==RUN and run['run_attempt']==ATTEMPT and run['head_sha']==SOURCE,'Target run/source/attempt differs')\nrequire(run['repository']['full_name']==REPO and run['repository']['id']==REPO_ID,'Target repository differs')\nrequire(run['head_branch']=='release/browser-2.1.0' and run['path']=='.github/workflows/browser-2_1-acceptance.yml','Target branch/workflow differs')\nrequire(commit['sha']==SOURCE and commit['tree']['sha']==TREE,'Actual source tree differs')\nrequire(artifact['id']==ARTIFACT and artifact['name']==NAME and artifact['size_in_bytes']==SIZE and artifact['expired']is False,'Fixed artifact metadata differs')\nrequire(artifact['digest']=='sha256:'+SHA,'Artifact metadata digest differs')\norigin=artifact['workflow_run'];require(origin['id']==RUN and origin['head_sha']==SOURCE and origin['head_branch']=='release/browser-2.1.0','Artifact source/run differs')\nrequire(origin['repository_id']==REPO_ID and origin['head_repository_id']==REPO_ID,'Artifact repository differs')\narchive=root/'artifact.zip';require(archive.stat().st_size==SIZE,'Downloaded ZIP byte count differs');raw=archive.read_bytes();require(hashlib.sha256(raw).hexdigest()==SHA,'Downloaded ZIP SHA256 differs')\nfiles={}\nwith zipfile.ZipFile(archive)as bundle:\n    entries=bundle.infolist();require(len(entries)<=64,'Too many ZIP entries')\n    names=[item.filename for item in entries];require(len(names)==len(set(names)),'Duplicate ZIP path')\n    require(sum(item.file_size for item in entries)<=LIMIT,'Total decompressed bytes exceed one MiB')\n    for item in entries:\n        path=pathlib.PurePosixPath(item.filename)\n        require(not path.is_absolute() and '..'not in path.parts and '\\\\'not in item.filename and '\\x00'not in item.filename,'Unsafe ZIP path')\n        require(not stat.S_ISLNK(item.external_attr>>16),'ZIP symlink is forbidden')\n    for name,maximum in [('results.json',262144),('webview-provider.txt',262144),('screen.png',LIMIT)]:\n        require(names.count(name)==1,'Required single root file missing: '+name)\n        item=bundle.getinfo(name);require(not item.is_dir() and 0<item.file_size<=maximum,'Selected file byte cap differs: '+name)\n        data=bundle.read(item);require(len(data)==item.file_size,'Selected file bytes differ: '+name);files[name]=data\nreport=json.loads(files['results.json'].decode('utf-8'));files['webview-provider.txt'].decode('utf-8')\nrequire(files['screen.png'].startswith(b'\\x89PNG\\r\\n\\x1a\\n'),'Screenshot is not PNG')\nrequire(report['sourceCommit']==SOURCE and report['sourceTree']==TREE,'Existing report source/tree differs')\nrequire(report['status']=='failed' and re.fullmatch('[0-9a-f]{32}',report['runNonce']),'Expected original failure report/nonce missing')\nidentity=report['expectedBuildIdentity'];require(identity['sourceCommit']==SOURCE and identity['sourceTree']==TREE,'APK source/tree differs')\nrequire(identity['dirtySource']is False,'APK came from dirty source')\nsdk=identity['sdkBuildIdentity'];require(str(sdk['runId'])==str(RUN) and str(sdk['runAttempt'])==str(ATTEMPT),'APK SDK run/attempt differs')\nsummary=dict(schema=1,diagnosticOnly=True,releaseAcceptance=False,actualWorkloadInvoked=False,readExistingArtifactOnly=True,targetRepository=REPO,targetRunId=str(RUN),targetRunAttempt=str(ATTEMPT),sourceCommit=SOURCE,sourceTree=TREE,artifactId=ARTIFACT,artifactName=NAME,artifactZipBytes=len(raw),artifactZipSha256=SHA,files={name:dict(bytes=len(data),sha256=hashlib.sha256(data).hexdigest())for name,data in files.items()})\nprint('BROWSER_DIAG_SUMMARY '+json.dumps(summary,sort_keys=True),flush=True)\nfor name,data in files.items():\n    encoded=base64.b64encode(data).decode('ascii');parts=[encoded[i:i+CHUNK]for i in range(0,len(encoded),CHUNK)]\n    metadata=dict(name=name,bytes=len(data),sha256=hashlib.sha256(data).hexdigest(),parts=len(parts))\n    print('BROWSER_DIAG_FILE_BEGIN '+json.dumps(metadata,sort_keys=True),flush=True)\n    for index,part in enumerate(parts):print('BROWSER_DIAG_FILE_CHUNK '+json.dumps(dict(name=name,part=index,base64=part),sort_keys=True),flush=True)\n    print('BROWSER_DIAG_FILE_END '+json.dumps(metadata,sort_keys=True),flush=True)\nprint('BROWSER_DIAG_COMPLETE '+json.dumps(dict(diagnosticOnly=True,releaseAcceptance=False,files=len(files))),flush=True)\nPYCODE\n"
