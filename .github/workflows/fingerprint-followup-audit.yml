name: Fingerprint followup boundary audit
'on':
  push:
    branches:
    - test/fingerprint-*
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: fingerprint-followup-${{ github.ref }}
  cancel-in-progress: false
env:
  ANDROID_CAPACITY_PREFLIGHT: |
    import json,os,pathlib,re,subprocess,sys,time
    from fractions import Fraction
    def require(value,message):
        if not value:raise ValueError(message)
    mode,scope=sys.argv[1:]
    require(mode in ('host','guest') and re.fullmatch('[a-z0-9-]+',scope),'Invalid preflight scope')
    job=os.environ['GITHUB_JOB'];require(re.fullmatch('[a-z0-9_-]+',job),'Invalid actual job')
    target=pathlib.Path('work/gecko-integration')/('android-capacity-'+job+'-'+scope+'.json')
    record={'schema':1,'status':'failed','requestedGuestCpus':4,'scope':scope,'job':job,'mode':mode}
    passed=False
    try:
        identity={'sourceCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                  'sourceTree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
                  'runId':os.environ['GITHUB_RUN_ID'],'runAttempt':os.environ['GITHUB_RUN_ATTEMPT']}
        record.update(identity)
        require(identity['sourceCommit']==os.environ['GITHUB_SHA'] and re.fullmatch('[0-9a-f]{40}',identity['sourceTree']),'Actual source identity differs')
        require(identity['runId'].isdigit() and identity['runAttempt'].isdigit(),'Actual CI run identity required')
        if mode=='host':
            require(not target.exists() and not target.is_symlink(),'Repeated capacity preflight')
            affinity=sorted(os.sched_getaffinity(0))
            nproc=int(subprocess.check_output(['nproc'],text=True,timeout=5).strip())
            require(affinity and nproc>0,'Actual host CPU counts unavailable')
            record['host']={'affinityCpus':affinity,'nproc':nproc,'observedAtMonotonicNs':time.monotonic_ns()}
            unified=[line.split(':',2)[2] for line in pathlib.Path('/proc/self/cgroup').read_text().splitlines() if line.startswith('0::')]
            mounts=[line for line in pathlib.Path('/proc/self/mountinfo').read_text().splitlines() if ' - cgroup2 ' in line]
            record['host'].update(unifiedCgroups=unified,cgroup2Mounts=mounts)
            require(len(unified)==1 and len(mounts)==1,'Unambiguous cgroup v2 observation required')
            fields=mounts[0].split(' - ',1)[0].split();mount=pathlib.Path(fields[4]).resolve()
            current=pathlib.PurePosixPath(unified[0]);root=pathlib.PurePosixPath(fields[3])
            require(current.is_absolute() and '..' not in current.parts,'Unsupported actual cgroup path')
            relative=[current.relative_to('/')]
            if current.is_relative_to(root):relative.append(current.relative_to(root))
            candidates={(mount/path).resolve() for path in relative}
            candidates={path for path in candidates if path.is_relative_to(mount) and (path/'cgroup.procs').is_file()}
            require(len(candidates)==1,'Current cgroup cannot be resolved unambiguously')
            node=candidates.pop();limits=[];capacity=Fraction(min(len(affinity),nproc));observed=0
            record['host']['cpuMax']=limits
            while True:
                path=node/'cpu.max'
                try:
                    raw=path.read_text().strip();limits.append({'path':str(path),'raw':raw});quota,period=raw.split()
                    require(period.isdigit() and int(period)>0 and (quota=='max' or (quota.isdigit() and int(quota)>0)),'Invalid actual cpu.max')
                    if quota!='max':capacity=min(capacity,Fraction(int(quota),int(period)))
                    observed+=1
                except FileNotFoundError:limits.append({'path':str(path),'raw':None,'interfacePresent':False})
                if node==mount:break
                node=node.parent
            record['host'].update(unifiedCgroup=unified[0],cgroup2Mount=mounts[0],cpuMax=limits,
                                  visibleCapacityCeilingNumerator=capacity.numerator,visibleCapacityCeilingDenominator=capacity.denominator,
                                  capacityScope='Visible affinity/nproc/cgroup limits only; not idle CPUs or invisible outer quotas')
            require(observed>0,'Actual cgroup CPU quota observation unavailable')
            require(capacity>=4,'Host effective CPU capacity is below four; no fallback')
        else:
            previous=json.loads(target.read_text())
            require(previous['status']=='passed' and previous['scope']==scope and previous['job']==job,'Passed host observation missing')
            require(all(previous.get(key)==value for key,value in identity.items()),'Capacity source/run differs')
            record=previous;record['mode']='guest'
            raw=subprocess.check_output(['adb','-s','emulator-5554','shell','getconf','_NPROCESSORS_ONLN'],text=True,timeout=8).strip()
            record['guest']={'serial':'emulator-5554','getconf':'_NPROCESSORS_ONLN','raw':raw,
                             'observedAtMonotonicNs':time.monotonic_ns()}
            require(raw=='4','Actual native-ADB guest online CPU count is not four')
            record['guest']['onlineCpus']=4
        record['status']='passed';passed=True
    except BaseException as error:
        record.update(status='failed',errorType=type(error).__name__,error=str(error))
    if mode=='host' and (target.exists() or target.is_symlink()):
        print('ANDROID_CAPACITY_PREFLIGHT '+json.dumps(record,sort_keys=True),flush=True);sys.exit(1)
    target.parent.mkdir(parents=True,exist_ok=True)
    temporary=target.with_suffix('.partial');temporary.write_text(json.dumps(record,sort_keys=True)+'\n');temporary.replace(target)
    print('ANDROID_CAPACITY_PREFLIGHT '+json.dumps(record,sort_keys=True),flush=True)
    sys.exit(0 if passed else 1)
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Observe actual four-CPU host capacity before building
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p work/gecko-integration
        python3 -c "$ANDROID_CAPACITY_PREFLIGHT" host fingerprint-followups
    - name: Check fingerprint diagnostic syntax and locked core inputs
      run: |
        python3 -c "import ast,pathlib;ast.parse(pathlib.Path('tests/gecko/run_fingerprint_followups.py').read_text())"
        node --check tests/gecko/assets/fingerprint-followups.cjs
        node --check tools/fingerprint/request_identity_server.cjs
        node --check app/src/main/assets/gecko/request-identity-background.js
        node --check app/src/main/assets/gecko/request-identity-audit.js
        node --check app/src/main/assets/gecko/main-world-audit.js
        python3 tools/build-mihomo.py --verify
    - name: Prepare locked toolchain
      shell: bash
      run: |
        set -euo pipefail
        echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
        echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
        echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
        mkdir -p work/gecko-integration
        "$JAVA_HOME_17_X64/bin/keytool" -genkeypair -keystore work/gecko-integration/integration-test.jks -alias androiddebugkey -storepass android -keypass android -dname CN=SyntheticIntegration -keyalg RSA -validity 2
        curl -fsSL --retry 3 https://services.gradle.org/distributions/gradle-9.8.0-bin.zip -o work/gecko-integration/gradle.zip
        echo 'bafd5ce9cfaea0fbccfdc8439a1ac42fbd4cd9c89dc9a988228d8a2639a58e6c  work/gecko-integration/gradle.zip' | sha256sum -c -
        unzip -q work/gecko-integration/gradle.zip -d work/gecko-integration/gradle
        curl -fsSL --retry 3 https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/157.0.20261005135250/geckoview-157.0.20261005135250.aar -o work/gecko-integration/geckoview.aar
        echo '15f1edf3c58abcdaf2783f299b8c19c3a36272d348969106a9009671fef8d268  work/gecko-integration/geckoview.aar' | sha256sum -c -
        curl -fsSL --retry 3 https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/157.0.20261005135250/geckoview-157.0.20261005135250.pom -o work/gecko-integration/geckoview.pom
        curl -fsSL --retry 3 https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/157.0.20261005135250/geckoview-157.0.20261005135250-sources.jar -o work/gecko-integration/geckoview-sources.jar
        python3 tools/gecko/verify_official_sdk.py --aar work/gecko-integration/geckoview.aar --pom work/gecko-integration/geckoview.pom --sources work/gecko-integration/geckoview-sources.jar --upstream-only
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.1' 'build-tools;37.0.0'
        export JAVA_HOME="$JAVA_HOME_17_X64"
        python3 tools/gecko/run_key_order_host.py | tee work/gecko-integration/key-order-host-results.json
        python3 tools/gecko/run_reply_handoff_host.py --upstream-sources work/gecko-integration/geckoview-sources.jar | tee work/gecko-integration/reply-handoff-host-results.json
        python3 tools/gecko/caret_workflow.py prepare --work work/gecko-integration
    - name: Build exact source integration and SDK receipts only
      run: |
        set -euo pipefail
        python3 tools/gecko/generate_appearance_fixture.py
        work/gecko-integration/gradle/gradle-9.8.0/bin/gradle :app:assembleRelease :app:assembleIntegration :app:writeCaretResolvedArtifacts -PtestSigningKey="$PWD/work/gecko-integration/integration-test.jks" --console=plain 2>&1 | tee work/gecko-integration/build.log
        python3 tools/gecko/verify_official_sdk.py --aar work/gecko-integration/geckoview.aar --pom work/gecko-integration/geckoview.pom --sources work/gecko-integration/geckoview-sources.jar --upstream-only | tee work/gecko-integration/official-sdk-verification.json
        python3 tools/gecko/caret_workflow.py record --work work/gecko-integration
    - name: Prepare Android runtime only
      shell: bash
      run: |
        set -euo pipefail
        echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
        echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
        echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.1' 'build-tools;37.0.0'
        python3 tools/gecko/prepare_android_image.py --component emulator --sdk-root "$ANDROID_HOME" --cache work/android-image --report work/gecko-integration/android-emulator-package-results.json
        python3 tools/gecko/prepare_android_image.py --sdk-root "$ANDROID_HOME" --cache work/android-image --report work/gecko-integration/android-system-image-results.json
    - name: Boot the original four-CPU Android target
      id: android_boot
      shell: bash
      run: |
        set -euo pipefail
        exec > >(tee work/gecko-integration/native-test.log) 2>&1
        export ANDROID_AVD_HOME="$PWD/work/gecko-integration/avd"
        export ANDROID_USER_HOME="$PWD/work/gecko-integration/android-user"
        export ANDROID_EMULATOR_HOME="$PWD/work/gecko-integration/emulator-home"
        mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME" "$ANDROID_EMULATOR_HOME"
        sudo chmod a+rw /dev/kvm
        echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force -n geckoproduction -p "$ANDROID_AVD_HOME/geckoproduction.avd" -k 'system-images;android-35;google_apis;x86_64'
        python3 tools/gecko/prepare_platform_tools.py --sdk-root "$ANDROID_HOME" --cache work/android-image --report work/gecko-integration/android-platform-tools-results.json
        adb start-server
        "$ANDROID_HOME/emulator/emulator" -avd geckoproduction -no-window -no-audio -no-snapshot -no-boot-anim -no-metrics -accel on -port 5556 -gpu swiftshader -memory 3072 -cores 4 -qemu -monitor "unix:$PWD/work/gecko-integration/qemu-monitor.sock,server=on,wait=off" > work/gecko-integration/emulator.log 2>&1 &
        timeout 180 adb -s emulator-5556 wait-for-device
        timeout 300 bash -c 'until [ "$(adb -s emulator-5556 shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
        adb -s emulator-5556 shell input keyevent 82
        adb -s emulator-5556 install app/build/outputs/apk/integration/app-x86_64-integration.apk
        python3 tools/gecko/prepare_native_adb.py --adb "$(command -v adb)" --apk app/build/outputs/apk/integration/app-x86_64-integration.apk --monitor "$PWD/work/gecko-integration/qemu-monitor.sock"
        echo "ANDROID_SERIAL=emulator-5554" >> "$GITHUB_ENV"
        python3 tools/gecko/prepare_emulator.py --adb "$(command -v adb)" --serial emulator-5554 --apk app/build/outputs/apk/integration/app-x86_64-integration.apk
        python3 -c "$ANDROID_CAPACITY_PREFLIGHT" guest 'fingerprint-followups'
    - name: Observe one actual fingerprint followup invocation
      shell: bash
      run: |
        set -euo pipefail
        python3 tests/gecko/run_fingerprint_followups.py --adb "$(command -v adb)" --serial emulator-5554 --apk app/build/outputs/apk/integration/app-x86_64-integration.apk
    - name: Collect small original diagnostic evidence only
      if: ${{ always() }}
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYCODE'
        from pathlib import Path
        import hashlib,json,os,shutil,subprocess
        root=Path.cwd();out=root/'work/fingerprint-followup-artifact';out.mkdir(parents=True,exist_ok=True)
        paths=[]
        for base in [root/'work/fingerprint-followup-audit/device']:
            if base.is_dir():paths.extend(p for p in base.rglob('*')if p.is_file())
        for name in ['build.log','native-test.log','sdk-build-receipt.json','caret-apk-build-receipt.json','official-sdk-verification.json','derived-sdk-verification.json','emulator.log','emulator-bootstrap-results.json','native-adb-setup-results.json','android-system-image-results.json','android-emulator-package-results.json','android-platform-tools-results.json','android-capacity-audit-fingerprint-followups.json']:
            p=root/'work/gecko-integration'/name
            if p.is_file():paths.append(p)
        paths.extend(p for p in (root/'work/gecko-integration').glob('native-adb-*.json')if p.is_file())
        paths=list(dict.fromkeys(paths));total=sum(p.stat().st_size for p in paths)
        if total>24*1024*1024:
            (out/'artifact-size-rejection.json').write_text(json.dumps(dict(status='failed',reason='Full selected raw evidence exceeds24MiB; no truncated evidence promoted',bytes=total,files=[dict(path=str(p.relative_to(root)),bytes=p.stat().st_size)for p in paths]),indent=2)+'\n')
            raise SystemExit(1)
        files=[]
        for p in paths:
            if p.is_symlink()or p.suffix.lower()in ['.apk','.jks','.pem','.p12','.pfx','.keystore']:raise ValueError('Forbidden diagnostic upload input: '+str(p))
            name=p.relative_to(root/'work');target=out/name;target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,target)
            files.append(dict(path=name.as_posix(),bytes=p.stat().st_size,sha256=hashlib.sha256(p.read_bytes()).hexdigest()))
        source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
        inputs=['app/build.gradle','tests/gecko/AndroidManifest.xml','tests/gecko/IntegrationBuildIdentity.java','tests/gecko/IntegrationEvidenceProvider.java','tests/gecko/FingerprintFollowupIntegrationActivity.java','tests/gecko/run_fingerprint_followups.py','tests/gecko/assets/fingerprint-followups.cjs','tools/fingerprint/request_identity_server.cjs','.github/workflows/fingerprint-followup-audit.yml']
        inputs+=subprocess.check_output(['git','ls-tree','-r','--name-only','HEAD','app/src/main/java/local/pocketchat','app/src/main/assets/gecko'],text=True).splitlines()
        inputs=sorted(set(inputs))
        identity=dict(schema=1,sourceCommit=source,sourceTree=tree,runId=os.environ['GITHUB_RUN_ID'],runAttempt=os.environ['GITHUB_RUN_ATTEMPT'],sourceStatus=subprocess.check_output(['git','status','--porcelain'],text=True),inputs={name:hashlib.sha256(Path(name).read_bytes()).hexdigest()for name in inputs},scope='Actual controlled fingerprint/HTTPS diagnostic source and raw evidence only; no phone, full fingerprint or release qualification',keysOrApksUploaded=False,files=files)
        assert source==os.environ['GITHUB_SHA']and not identity['sourceStatus']
        (out/'source-identity.json').write_text(json.dumps(identity,indent=2)+'\n')
        assert sum(p.stat().st_size for p in out.rglob('*')if p.is_file())<25*1024*1024
        print(json.dumps(dict(files=len(files),bytes=total,scope='diagnostic only',fullFingerprintProtectionAcceptance=False)))
        PYCODE
    - name: Upload bounded diagnostic reports without APK or key
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: fingerprint-followup-audit-${{ github.run_id }}-${{ github.run_attempt }}
        path: work/fingerprint-followup-artifact
        if-no-files-found: error
        retention-days: 7
        compression-level: 6
