name: Independent update route and resumable transfer diagnostics
on:
  push:
    branches: [feature/update-route-lease]
permissions:
  contents: write
concurrency:
  group: update-route-diagnostics
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify pinned unchanged native core
        run: python3 tools/build-mihomo.py --verify
      - name: Prepare locked official SDK toolchain
        id: setup
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          mkdir -p work/gecko-integration
          "$JAVA_HOME_17_X64/bin/keytool" -genkeypair -keystore work/gecko-integration/integration-test.jks -alias androiddebugkey -storepass android -keypass android -dname CN=SyntheticIntegration -keyalg RSA -validity 2
          curl -fsSL --retry 3 https://services.gradle.org/distributions/gradle-9.8.0-bin.zip -o work/gecko-integration/gradle.zip
          echo 'bafd5ce9cfaea0fbccfdc8439a1ac42fbd4cd9c89dc9a988228d8a2639a58e6c  work/gecko-integration/gradle.zip' | sha256sum -c -
          unzip -q work/gecko-integration/gradle.zip -d work/gecko-integration/gradle
          curl -fsSL --retry 3 https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/157.0.20260924084938/geckoview-157.0.20260924084938.aar -o work/gecko-integration/geckoview.aar
          echo '25de06a6204382c08e405adc36da7373098bdc230d6d768f17a6fe971f0dece0  work/gecko-integration/geckoview.aar' | sha256sum -c -
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.1' 'build-tools;37.0.0' 'emulator' 'system-images;android-35;google_apis;x86_64'
      - name: Compile only the non-debuggable integration package
        id: build
        shell: bash
        run: |
          set -euo pipefail
          work/gecko-integration/gradle/gradle-9.8.0/bin/gradle :app:assembleIntegration -PtestSigningKey="$PWD/work/gecko-integration/integration-test.jks" --console=plain --write-verification-metadata sha256 2>&1 | tee work/gecko-integration/build.log
          "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging app/build/outputs/apk/integration/app-x86_64-integration.apk > work/gecko-integration/integration-badging.txt
          python3 - <<'PYCODE'
          import pathlib
          text=pathlib.Path('work/gecko-integration/integration-badging.txt').read_text()
          assert "package: name='local.pocketchat.test'" in text and 'application-debuggable' not in text
          PYCODE
      - name: Prepare signed synthetic upgrade APKs
        id: fixtures
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee work/gecko-integration/update-fixture-preparation.log) 2>&1
          tools="$ANDROID_HOME/build-tools/37.0.0"
          python3 - <<'PYCODE'
          import pathlib,re
          code=int(re.search(r'versionCode ([0-9]+)',pathlib.Path('app/build.gradle').read_text()).group(1))+1
          text=pathlib.Path('tests/gecko/update-fixture.xml').read_text().replace('android:versionCode="1"',f'android:versionCode="{code}"')
          pathlib.Path('work/gecko-integration/update-fixture.xml').write_text(text)
          PYCODE
          "$tools/aapt2" link -I "$ANDROID_HOME/platforms/android-37.1/android.jar" --manifest work/gecko-integration/update-fixture.xml -o work/gecko-integration/update-fixture-unsigned.apk
          python3 - <<'PYCODE'
          import zipfile
          with zipfile.ZipFile('work/gecko-integration/update-fixture-unsigned.apk','a',compression=zipfile.ZIP_STORED) as archive:
              archive.writestr('assets/resume-fixture.bin', bytes(range(256)) * 4096)
          PYCODE
          "$tools/apksigner" sign --ks work/gecko-integration/integration-test.jks --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out work/gecko-integration/update-fixture.apk work/gecko-integration/update-fixture-unsigned.apk
          keytool -genkeypair -keystore work/gecko-integration/update-wrong-key.jks -alias fixture -storepass android -keypass android -dname CN=Synthetic -keyalg RSA -validity 2
          "$tools/apksigner" sign --ks work/gecko-integration/update-wrong-key.jks --ks-key-alias fixture --ks-pass pass:android --key-pass pass:android --out work/gecko-integration/update-wrong-signer.apk work/gecko-integration/update-fixture-unsigned.apk
      - name: Run original 28 transfers and real profile-route regression on Android 35
        id: android
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="$PWD/work/gecko-integration/update-route-avd"
          export ANDROID_USER_HOME="$PWD/work/gecko-integration/update-route-android-user"
          export ANDROID_EMULATOR_HOME="$PWD/work/gecko-integration/update-route-emulator-home"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME" "$ANDROID_EMULATOR_HOME"
          sudo chmod a+rw /dev/kvm
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force -n updateroute -p "$ANDROID_AVD_HOME/updateroute.avd" -k 'system-images;android-35;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd updateroute -no-window -no-audio -no-snapshot -no-boot-anim -no-metrics -accel on -port 5554 -gpu swiftshader -memory 3072 -cores 2 > work/gecko-integration/update-route-emulator.log 2>&1 &
          timeout 180 adb -s emulator-5554 wait-for-device
          timeout 300 bash -c 'until [ "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
          adb -s emulator-5554 shell input keyevent 82
          adb -s emulator-5554 install app/build/outputs/apk/integration/app-x86_64-integration.apk
          publication_failed=0
          transfers_exit=0
          if python3 tests/gecko/run_device.py --adb "$(command -v adb)" --serial emulator-5554 --update-transfers-only 2>&1 | tee work/gecko-integration/update-transfers-runner.log; then
            transfers_exit=0
          else
            transfers_exit=$?
          fi
          if ! python3 tools/gecko/publish_update_route_diagnostics.py --case transfers --exit-code "$transfers_exit"; then
            publication_failed=1
          fi
          route_exit=0
          if python3 tests/gecko/run_update_route.py --adb "$(command -v adb)" --serial emulator-5554 2>&1 | tee work/gecko-integration/update-route-runner.log; then
            route_exit=0
          else
            route_exit=$?
          fi
          if ! python3 tools/gecko/publish_update_route_diagnostics.py --case route --exit-code "$route_exit"; then
            publication_failed=1
          fi
          if [ "$transfers_exit" -ne 0 ] || [ "$route_exit" -ne 0 ] || [ "$publication_failed" -ne 0 ]; then
            exit 1
          fi
      - name: Publish bounded source-matched diagnostics
        if: always()
        env:
          UPDATE_ROUTE_SETUP_OUTCOME: ${{ steps.setup.outcome }}
          UPDATE_ROUTE_BUILD_OUTCOME: ${{ steps.build.outcome }}
          UPDATE_ROUTE_FIXTURES_OUTCOME: ${{ steps.fixtures.outcome }}
          UPDATE_ROUTE_ANDROID_OUTCOME: ${{ steps.android.outcome }}
        run: python3 tools/gecko/publish_update_route_diagnostics.py
