import java.nio.charset.StandardCharsets
import java.util.zip.ZipFile
import javax.inject.Inject
import org.gradle.process.ExecOperations

@CacheableTask
abstract class SeparateChromiumResourcePaths extends DefaultTask {
    // Cefrium 0.21.0 embeds these AndroidX files. Both packages need their own IDs.
    private static final Set<String> COLLISIONS = [
        'drawable/notification_action_background',
        'drawable/notification_bg',
        'drawable/notification_bg_low',
        'drawable/notification_icon_background',
        'drawable/notification_tile_bg',
        'layout/custom_dialog',
        'layout/ime_secondary_split_test_activity',
        'layout/notification_action',
        'layout/notification_action_tombstone',
        'layout/notification_template_custom_big',
        'layout/notification_template_icon_group',
        'layout/notification_template_part_chronometer',
        'layout/notification_template_part_time',
    ].toSet().asImmutable()

    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getAapt2()

    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getLinkedResources()

    @OutputFile
    abstract RegularFileProperty getSeparatedResources()

    @Inject
    abstract ExecOperations getExecOperations()

    @TaskAction
    void separate() {
        File source = linkedResources.get().asFile
        File result = separatedResources.get().asFile
        File rules = new File(temporaryDir, 'resources.cfg')
        File pathMap = new File(temporaryDir, 'paths.txt')
        String originalTable = resourceTable(source)
        Set<String> resourceNames = (originalTable =~ /(?m)^\s+resource 0x[0-9a-fA-F]+ (\S+)/)
            .collect { it[1] }.toSet()
        if (!resourceNames.containsAll(COLLISIONS)) {
            throw new GradleException('Cefrium resource layout changed. Recheck the split resource paths.')
        }
        rules.setText((resourceNames - COLLISIONS).sort().collect { "${it}#no_path_shorten\n" }.join(), 'UTF-8')
        result.parentFile.mkdirs()
        execOperations.exec {
            commandLine aapt2.get().asFile, 'optimize', '--shorten-resource-paths',
                '--resources-config-path', rules, '--resource-path-shortening-map', pathMap,
                '-o', result, source
        }
        Map<String, String> renamedPaths = [:]
        pathMap.eachLine('UTF-8') { line ->
            String[] pair = line.split(' -> ', 2)
            if (pair.length != 2 || !pair[1].matches(/res\/[a-zA-Z0-9_-]+\.xml/)
                    || renamedPaths.containsKey(pair[0])) {
                throw new GradleException('Unexpected AAPT2 resource paths map')
            }
            renamedPaths[pair[0]] = pair[1]
        }
        Set<String> expectedPaths = COLLISIONS.collect { "res/${it}.xml".toString() }.toSet()
        if (renamedPaths.keySet() != expectedPaths || renamedPaths.values().toSet().size() != expectedPaths.size()) {
            throw new GradleException('AAPT2 changed paths outside the reviewed Cefrium resource set')
        }
        String separatedTable = resourceTable(result)
        renamedPaths.each { original, renamed -> separatedTable = separatedTable.replace(renamed, original) }
        if (originalTable != separatedTable) {
            throw new GradleException('AAPT2 changed a Cefrium resource name, ID, value or configuration')
        }
        verifyPayloads(source, result, renamedPaths)
    }

    private String resourceTable(File archive) {
        def text = new ByteArrayOutputStream()
        execOperations.exec {
            commandLine aapt2.get().asFile, 'dump', 'resources', archive
            standardOutput = text
        }
        return text.toString(StandardCharsets.UTF_8)
    }

    private static void verifyPayloads(File source, File result, Map<String, String> renamedPaths) {
        new ZipFile(source).withCloseable { original ->
            new ZipFile(result).withCloseable { separated ->
                def entries = Collections.list(original.entries())
                Set<String> expected = entries.collect { renamedPaths.getOrDefault(it.name, it.name) }.toSet()
                Set<String> actual = Collections.list(separated.entries()).collect { it.name }.toSet()
                if (expected != actual || expected.size() != entries.size() || actual.size() != separated.size()) {
                    throw new GradleException('AAPT2 dropped or duplicated a Cefrium resource file')
                }
                entries.findAll { it.name != 'resources.pb' }.each { entry ->
                    String newName = renamedPaths.getOrDefault(entry.name, entry.name)
                    original.getInputStream(entry).withCloseable { before ->
                        separated.getInputStream(separated.getEntry(newName)).withCloseable { after ->
                            if (!Arrays.equals(before.readAllBytes(), after.readAllBytes())) {
                                throw new GradleException("AAPT2 changed Cefrium resource file content: ${entry.name}")
                            }
                        }
                    }
                }
            }
        }
    }
}

String toolName = System.getProperty('os.name').toLowerCase(Locale.ROOT).startsWith('windows') ? 'aapt2.exe' : 'aapt2'
androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    def separate = tasks.register("separate${variant.name.capitalize()}ChromiumResources", SeparateChromiumResourcePaths) {
        aapt2.set(androidComponents.sdkComponents.sdkDirectory.map { it.file("build-tools/37.0.0/${toolName}") })
    }
    variant.artifacts.use(separate).wiredWithFiles(
        { it.linkedResources }, { it.separatedResources }
    ).withName('feature-chromium.ap_').toTransform(rootProject.ext.chromiumBundleResourceArtifact)
}
