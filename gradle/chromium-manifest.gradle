import javax.xml.parsers.DocumentBuilderFactory
import javax.xml.transform.TransformerFactory
import javax.xml.transform.dom.DOMSource
import javax.xml.transform.stream.StreamResult
import org.w3c.dom.Element

@CacheableTask
abstract class SplitChromiumManifest extends DefaultTask {
    private static final String ANDROID = 'http://schemas.android.com/apk/res/android'

    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getMergedManifest()

    @OutputFile
    abstract RegularFileProperty getPackageManifest()

    @Input
    abstract Property<Boolean> getBasePackage()

    @TaskAction
    void separate() {
        def parser = DocumentBuilderFactory.newDefaultInstance()
        parser.namespaceAware = true
        parser.setFeature('http://apache.org/xml/features/disallow-doctype-decl', true)
        def document = parser.newDocumentBuilder().parse(mergedManifest.get().asFile)
        def application = document.documentElement.getElementsByTagName('application').item(0)
        for (int index = application.childNodes.length - 1; index >= 0; index--) {
            def component = application.childNodes.item(index)
            if (!(component instanceof Element)) continue
            String name = component.getAttributeNS(ANDROID, 'name')
            if (basePackage.get()) {
                // AGP copies feature declarations into the base to resolve the split graph.
                if (component.getAttributeNS(ANDROID, 'splitName') == 'chromium'
                        || name.startsWith('com.cefrium.') || name.startsWith('org.chromium.')
                        || name == 'local.pocketchat.CefriumBrowserActivity'
                        || name == 'local.pocketchat.CefriumSetupProvider'
                        || name == 'com.google.android.gms.cast.framework.media.MediaIntentReceiver'
                        || name == 'com.google.android.datatransport.runtime.scheduling.jobscheduling.AlarmManagerSchedulerBroadcastReceiver') {
                    application.removeChild(component)
                }
            } else if (name == 'com.cefrium.JAVALESS_RENDERERS'
                    || name.startsWith('com.cefrium.ChildServices$NativeSandboxed')) {
                // Gecko owns the app zygote. Keep Chromium on the SDK's Java renderer path.
                application.removeChild(component)
            } else if (name.startsWith('com.cefrium.ChildServices$')) {
                component.removeAttributeNS(ANDROID, 'useAppZygote')
            }
        }
        if (application.getAttributeNS(ANDROID, 'zygotePreloadName').startsWith('org.chromium.')) {
            application.removeAttributeNS(ANDROID, 'zygotePreloadName')
        }
        if (application.getAttributeNS(ANDROID, 'zygotePreloadNativeLib') == 'libcef.so') {
            application.removeAttributeNS(ANDROID, 'zygotePreloadNativeLib')
        }
        def output = packageManifest.get().asFile
        output.parentFile.mkdirs()
        TransformerFactory.newDefaultInstance().newTransformer().transform(
            new DOMSource(document), new StreamResult(output))
    }
}

boolean base = project.name == 'app'
androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    def filter = tasks.register("separate${variant.name.capitalize()}ChromiumManifest", SplitChromiumManifest) {
        basePackage.set(base)
    }
    variant.artifacts.use(filter).wiredWithFiles(
        { it.mergedManifest }, { it.packageManifest }
    ).toTransform(rootProject.ext.chromiumMergedManifestArtifact)
}
