plugins { id 'com.android.application' }

android {
    namespace 'local.pocketchat.engineprobe'
    compileSdk { version = release(37) { minorApiLevel = 1 } }
    defaultConfig {
        applicationId 'local.pocketchat.engineprobe'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-gecko-probe'
    }
    buildTypes { release { minifyEnabled false } }
    packaging { jniLibs { useLegacyPackaging = true } }
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'x86_64'
            universalApk false
        }
    }
}

dependencies { implementation 'org.mozilla.geckoview:geckoview:157.0.20260924084938' }
