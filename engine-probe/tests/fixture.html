<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>受控内核测试</title><style>body{font:16px sans-serif;padding:16px}pre{white-space:pre-wrap}</style>
<h2>受控内核测试</h2><p>这是合成数据测试，不是 ChatGPT 或 Google 登录页。</p><pre id="result">测试中…</pre>
<script>
(async () => {
  const q = new URLSearchParams(location.search), context = q.get('context'), action = q.get('action');
  const token = 'synthetic-environment-' + context;
  const db = await new Promise((resolve, reject) => {
    const r = indexedDB.open('engine-probe', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('tokens');
    r.onsuccess = () => resolve(r.result); r.onerror = () => reject(r.error);
  });
  const database = (mode, operation) => new Promise((resolve, reject) => {
    const tx = db.transaction('tokens', mode), r = operation(tx.objectStore('tokens'));
    tx.oncomplete = () => resolve(r.result ?? null); tx.onerror = () => reject(tx.error);
  });
  if (action === 'seed') {
    document.cookie = 'probe=' + token + '; Path=/; Max-Age=3600; SameSite=Strict';
    localStorage.setItem('probe', token);
    await database('readwrite', store => store.put(token, 'probe'));
    await (await caches.open('engine-probe')).put('/stored-token', new Response(token));
    const registration = await navigator.serviceWorker.register('/worker.js', {scope: '/'});
    await navigator.serviceWorker.ready;
  }
  if (action === 'clear') {
    document.cookie = 'probe=; Path=/; Max-Age=0';
    localStorage.removeItem('probe');
    await database('readwrite', store => store.clear());
    await caches.delete('engine-probe');
    for (const registration of await navigator.serviceWorker.getRegistrations()) await registration.unregister();
  }
  const cached = await (await caches.open('engine-probe')).match('/stored-token');
  const registrations = await navigator.serviceWorker.getRegistrations();
  let workerToken = null;
  if (registrations.length && registrations[0].active) {
    workerToken = await new Promise((resolve, reject) => {
      const channel = new MessageChannel(), timer = setTimeout(() => reject(new Error('worker timeout')), 12000);
      channel.port1.onmessage = event => { clearTimeout(timer); resolve(event.data); };
      registrations[0].active.postMessage({kind: 'read'}, [channel.port2]);
    });
  }
  const result = {action, context, cookie: document.cookie, localStorage: localStorage.getItem('probe'),
    indexedDB: await database('readonly', store => store.get('probe')), cache: cached ? await cached.text() : null,
    serviceWorkers: registrations.length, workerToken};
  if (action === 'network' || action === 'seed') {
    result.redirect = await (await fetch('/redirect')).text();
    result.remoteDns = await (await fetch('http://remote-probe.invalid:8765/dns')).text();
    result.downloadBytes = (await (await fetch('/download')).arrayBuffer()).byteLength;
    result.webSocket = await new Promise((resolve, reject) => {
      const ws = new WebSocket('ws://127.0.0.1:8765/socket');
      const timer = setTimeout(() => {ws.close(); reject(new Error('socket timeout'));}, 12000);
      ws.onopen = () => ws.send('synthetic-probe');
      ws.onmessage = e => {clearTimeout(timer); ws.close(); resolve(e.data);};
      ws.onerror = () => {clearTimeout(timer); reject(new Error('socket error'));};
    });
    const worker = new Worker('/dedicated-worker.js');
    result.dedicatedWorker = await new Promise((resolve, reject) => {
      const timer = setTimeout(() => {worker.terminate(); reject(new Error('worker timeout'));}, 12000);
      worker.onmessage = e => { clearTimeout(timer); worker.terminate(); resolve(e.data); };
      worker.onerror = reject;
    });
  }
  db.close();
  document.querySelector('#result').textContent = JSON.stringify(result, null, 2);
  window.postMessage({channel: 'pocketchat-engine-fixture', result}, location.origin);
})().catch(error => {
  const result = {error: String(error), action: new URLSearchParams(location.search).get('action')};
  document.querySelector('#result').textContent = JSON.stringify(result);
  window.postMessage({channel: 'pocketchat-engine-fixture', result}, location.origin);
});
</script></html>
