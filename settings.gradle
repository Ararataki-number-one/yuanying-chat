pluginManagement { repositories { google(); mavenCentral() } }
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        exclusiveContent {
            forRepository { maven { url = uri(providers.gradleProperty('caretSdkRepository').orElse('work/native-caret-sdk/maven').get()) } }
            filter { includeModule('local.pocketchat.sdk', 'geckoview-caret') }
        }
        google(); mavenCentral(); maven { url = uri('https://maven.mozilla.org/maven2/') }
    }
}
rootProject.name = 'PocketChat'
include ':app'
