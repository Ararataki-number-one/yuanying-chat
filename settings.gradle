pluginManagement {
    plugins {
        id 'com.cefrium' version '0.21.0'
    }
    if (providers.gradleProperty('pocketChatChromiumBundle').map { it.toBoolean() }.getOrElse(false)) {
        def mavenDirectory = file(providers.gradleProperty('pocketChatCefriumRepository')
            .orElse('work/chromium-sdk/maven').get())
        def failures = []
        file('gradle/cefrium-0.21.0.sha256').eachLine { line ->
            def (expected, relativePath) = line.split(/\s+/, 2)
            def artifact = new File(mavenDirectory, relativePath)
            if (!artifact.isFile()) {
                failures.add(relativePath)
                return
            }
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            artifact.withInputStream { input ->
                input.transferTo(new java.security.DigestOutputStream(java.io.OutputStream.nullOutputStream(), digest))
            }
            if (digest.digest().encodeHex().toString() != expected) {
                failures.add(relativePath)
            }
        }
        if (!failures.isEmpty()) {
            throw new GradleException("Cefrium SDK inputs are missing or fail SHA-256 verification. Run gradle/prepare-cefrium-sdk.py. Files: ${failures.join(', ')}")
        }
        gradle.ext.pocketChatCefriumRepository = mavenDirectory
    }
    repositories {
        if (gradle.ext.has('pocketChatCefriumRepository')) {
            exclusiveContent {
                forRepository {
                    maven {
                        url = uri(gradle.ext.pocketChatCefriumRepository)
                        metadataSources { mavenPom(); ignoreGradleMetadataRedirection() }
                    }
                }
                filter { includeGroup('com.cefrium') }
            }
        }
        google()
        maven { url = uri('https://maven-central.storage-download.googleapis.com/maven2/') }
        mavenCentral()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        if (gradle.ext.has('pocketChatCefriumRepository')) {
            exclusiveContent {
                forRepository {
                    maven {
                        url = uri(gradle.ext.pocketChatCefriumRepository)
                        metadataSources { mavenPom(); ignoreGradleMetadataRedirection() }
                    }
                }
                filter { includeGroup('com.cefrium') }
            }
        }
        exclusiveContent {
            forRepository { maven { url = uri(providers.gradleProperty('caretSdkRepository').orElse('work/native-caret-sdk/maven').get()) } }
            filter { includeModule('local.pocketchat.sdk', 'geckoview-caret') }
        }
        google()
        maven { url = uri('https://maven-central.storage-download.googleapis.com/maven2/') }
        mavenCentral()
        maven { url = uri('https://maven.mozilla.org/maven2/') }
    }
}
rootProject.name = 'PocketChat'
include ':app'
if (gradle.ext.has('pocketChatCefriumRepository')) {
    include ':chromium'
}
