<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font:16px sans-serif;line-height:1.7;margin:16px}article{margin:14px 0;padding:12px;border:1px solid #eee}pre{white-space:pre-wrap}textarea{width:90%;height:60px}#probe{position:fixed;top:0;right:0;width:8px;height:8px;background:#4285ff;z-index:99}</style>
<button data-testid="model-switcher-dropdown-button">Thinking</button><button aria-label="Thinking effort">Extra High</button>
<div id="turns"></div><textarea id="prompt-textarea"></textarea><button data-testid="send-button" aria-label="Send">发送</button><div id="probe"></div>
<script>
const text='用于检查长对话的页面阅读、代码、数学内容与缓存同步。无需账号，不访问外网。'.repeat(8);
const fragment=document.createDocumentFragment();
for(let i=0;i<1000;i++){const a=document.createElement('article');a.dataset.messageAuthorRole=i%2?'assistant':'user';a.dataset.messageId='perf-message-'+i;
 if(i%2)a.innerHTML='<div class="markdown"><h3>回复 '+i+'</h3><p>'+text+'</p><p>'+text+'</p><pre><code class="language-python">for i in range(10):\n    print(i * i)\n</code></pre><table><tr><th>A</th><th>B</th></tr><tr><td>1</td><td>2</td></tr></table></div><button data-testid="copy-turn-action-button" aria-label="Copy response">Copy</button>';
 else a.textContent='提问 '+i+' '+text;fragment.append(a);
}turns.append(fragment);
window.fixtureReady=true;window.sendCount=0;window.sample=null;
let scrolling=false,last=0,frameId=0,streamTimer=null;
function frame(now){if(!sample)return; if(last)sample.intervals.push(now-last);last=now;const amount=(now*.06)%100;probe.style.transform='translateX(-'+amount+'px)';
 if(scrolling){const max=document.documentElement.scrollHeight-innerHeight;scrollTo(0,(now*0.07)%Math.max(1,max));}
 if(++frameId%5===0)document.querySelector('textarea').value='正在输入第 '+frameId+' 段中文内容';requestAnimationFrame(frame);}
window.beginPerf=(stream)=>{sample={intervals:[]};last=0;frameId=0;scrolling=true;requestAnimationFrame(frame);if(stream){const lastBody=turns.lastElementChild.querySelector('.markdown p');let n=0;const stop=document.createElement('button');stop.dataset.testid='stop-button';stop.setAttribute('aria-label','Stop');stop.textContent='Stop';document.body.append(stop);streamTimer=setInterval(()=>{lastBody.textContent=text+'\n追加内容 '+(++n);},80);}};
window.endPerf=()=>{const result=sample;sample=null;clearInterval(streamTimer);streamTimer=null;document.querySelector('[data-testid="stop-button"]')?.remove();return result;};
</script>
