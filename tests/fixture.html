<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px sans-serif;padding:16px}textarea{width:85%;height:100px}button{padding:10px}article{margin:12px}</style>
<h2>离线测试网页 · 不连接账号</h2><button data-testid="model-switcher-dropdown-button">Thinking</button><button aria-label="Thinking effort">Extra High</button><div id="turns"></div><textarea id="prompt-textarea"></textarea><button data-testid="send-button" aria-label="Send">发送</button>
<script>
window.sendCount=0;
document.querySelector('[data-testid="send-button"]').onclick=()=>{
 const input=document.querySelector('textarea'),text=input.value;if(!text)return;window.sendCount++;
 const user=document.createElement('article');user.style.whiteSpace='pre-wrap';user.dataset.messageAuthorRole='user';user.dataset.messageId='user-'+sendCount;user.textContent=text;turns.append(user);input.value='';
 const reply=document.createElement('article');reply.dataset.messageAuthorRole='assistant';reply.dataset.messageId='reply-'+sendCount;reply.innerHTML='<div class="markdown"><p>正在生成…</p></div>';turns.append(reply);
 const stop=document.createElement('button');stop.dataset.testid='stop-button';stop.setAttribute('aria-label','Stop');stop.textContent='Stop';document.body.append(stop);
 setTimeout(()=>{reply.innerHTML='<div class="markdown"><p>安卓运行测试成功：中文与多行内容已收到。</p><p><span class="katex"><annotation encoding="application/x-tex">E=mc^2</annotation></span></p><pre><code class="language-python">print("你好，Android")\nprint(2 + 2)</code></pre><ul><li>本地公式渲染</li><li>代码复制</li></ul></div><button data-testid="copy-turn-action-button" aria-label="Copy response">Copy response</button>';stop.remove();},window.replyDelay||650);
};
</script>
