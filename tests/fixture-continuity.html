<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px sans-serif;margin:12px}nav a{padding:6px;display:inline-block}textarea{width:90%;height:90px}.space{height:1600px}article{padding:12px}</style></head><body>
<button data-testid="model-switcher-dropdown-button">Thinking</button><button aria-label="Thinking effort">Extra High</button>
<nav><a id="one" href="/c/one">one</a><a id="two" href="/c/two">two</a><a id="delayed" href="/c/delayed">delayed</a><a id="noop" href="/c/noop">noop</a></nav>
<textarea id="prompt-textarea"></textarea><button data-testid="send-button" aria-label="Send">Send</button><div id="turns"></div><div class="space"></div>
<script>
window.pageInstance=crypto.randomUUID();window.sendCount=0;window.initialRoom='__ROOM__';
window.setRoom=room=>{turns.innerHTML='<article data-message-author-role="user" data-message-id="'+room+'-user">question '+room+'</article><article data-message-author-role="assistant" data-message-id="'+room+'-answer"><div class="markdown"><p>answer '+room+'</p></div></article>';document.querySelector('textarea').value='';};
setRoom(initialRoom);document.querySelector('textarea').value='__DRAFT__';
for(const a of document.querySelectorAll('nav a'))a.addEventListener('click',e=>{e.preventDefault();if(a.id==='noop')return;history.pushState({},'',a.href);if(a.id==='delayed')setTimeout(()=>setRoom(a.id),400);else setRoom(a.id);});
document.querySelector('[data-testid="send-button"]').addEventListener('click',()=>{window.sendCount++;});
</script></body></html>
