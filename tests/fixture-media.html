<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><form onsubmit="return false"><button type="button" data-testid="model-switcher-dropdown-button">Thinking</button><button type="button" aria-label="Thinking effort">Extra High</button><div id="uploads"></div><textarea id="prompt-textarea"></textarea><input id="upload-files" type="file" multiple><input id="upload-photos" type="file" accept="image/*" multiple><button type="button" data-testid="send-button" aria-label="Send">发送</button></form><div id="turns"></div>
<script>
window.uploadReadCount=0;window.sendCount=0;
for(const input of document.querySelectorAll('input[type=file]'))input.onchange=async()=>{for(const file of input.files){const row=document.createElement('div');row.dataset.fileName=file.name;row.dataset.uploadState='uploading';const name=document.createElement('span');name.textContent=file.name;const progress=document.createElement('span');progress.setAttribute('role','progressbar');const remove=document.createElement('button');remove.type='button';remove.setAttribute('aria-label','Remove file '+file.name);remove.textContent='Remove';remove.onclick=()=>row.remove();row.append(name,progress,remove);uploads.append(row);try{const buffer=await file.arrayBuffer();if(buffer.byteLength>0)window.uploadReadCount++;setTimeout(()=>{row.dataset.uploadState='ready';progress.remove()},1500);}catch(e){row.dataset.uploadState='error'}}};
document.querySelector('[data-testid=send-button]').onclick=()=>{window.sendCount++;const el=document.querySelector('textarea');const user=document.createElement('article');user.dataset.messageAuthorRole='user';user.dataset.messageId='fixture-user';user.textContent=el.value;turns.append(user);el.value='';uploads.replaceChildren();const answer=document.createElement('article');answer.dataset.messageAuthorRole='assistant';answer.dataset.messageId='fixture-reply';answer.innerHTML='<div class="markdown">附件测试回复</div><button data-testid="copy-turn-action-button" aria-label="Copy response">Copy</button>';turns.append(answer);};
</script>
