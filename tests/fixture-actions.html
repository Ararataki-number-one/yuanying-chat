<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px sans-serif}button{padding:12px}section{margin:18px}#prompt-textarea{height:70px;width:90%}.card{padding:14px;border:1px solid #aaa;margin:12px}</style>
<button data-testid="model-switcher-dropdown-button">Thinking</button><button aria-label="Thinking effort">Extra High</button><div id="turns"><section data-turn="user"><div data-message-author-role="user" data-message-id="fixture-question">Initial fixture prompt</div></section><section data-turn="assistant" data-testid="conversation-turn-2"><div data-conversation-screenshot-content><div><div data-message-author-role="assistant" data-message-id="fixture-answer"><div class="markdown">Initial reply.</div></div></div><div class="card"><span>sample.docx</span><button aria-label="Download file" onclick="file('docx')">下载</button></div><div class="card"><span>sample.pdf</span><button aria-label="Download file" onclick="file('pdf')">下载</button></div><div class="actions"><button data-testid="copy-turn-action-button" aria-label="Copy response">Copy</button><button id="regen" onclick="regenerate()">Try again</button></div></div></section></div><textarea id="prompt-textarea"></textarea><button data-testid="send-button" aria-label="Send" onclick="window.sendCount++">Send</button>
<script>
window.sendCount=0;window.regenerateCount=0;window.downloadClicks=0;window.payloads={docx:'__DOCX__',pdf:'__PDF__'};
function file(ext){window.downloadClicks++;const bytes=Uint8Array.from(atob(payloads[ext]),c=>c.charCodeAt(0));const type=ext==='pdf'?'application/pdf':'application/vnd.openxmlformats-officedocument.wordprocessingml.document';const url=URL.createObjectURL(new Blob([bytes],{type}));const a=document.createElement('a');a.href=url;a.download='sample.'+ext;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
function regenerate(){window.regenerateCount++;setTimeout(()=>{const stop=document.createElement('button');stop.id='stop';stop.dataset.testid='stop-button';stop.setAttribute('aria-label','Stop');document.body.append(stop);const phase=document.createElement('button');phase.id='phase';phase.textContent='Thinking…';document.querySelector('.actions').append(phase);},4500);setTimeout(()=>document.querySelector('#phase').textContent='Searching…',5800);setTimeout(()=>{document.querySelector('#phase').remove();document.querySelector('.markdown').textContent='Regenerated reply.';},6900);setTimeout(()=>document.querySelector('#stop').remove(),7800);}
</script>
