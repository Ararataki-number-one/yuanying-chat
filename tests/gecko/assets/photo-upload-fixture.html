<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Controlled photo content upload</title>
<h1>Controlled photo content upload</h1>
<input id="upload" type="file" accept="image/*" multiple>
<p id="upload-result"></p>
<script>
'use strict';
const config = __PHOTO_CONFIG__;
const photoEvidence = window.photoEvidence = {
  schema: 1, runNonce: config.runNonce, command: config.command,
  privacyLevel: config.privacyLevel, mode: config.mode, receipts: []
};
const output = document.getElementById('upload-result');
const input = document.getElementById('upload');
function failure(error) {
  document.documentElement.dataset.photoReady = 'failed';
  output.textContent = 'error:' + String(error.message || error);
}
async function submit(phase, image) {
  const form = new FormData();
  form.append('file', image, 'photo-123.png');
  const query = new URLSearchParams({nonce: config.runNonce, command: String(config.command), phase});
  const response = await fetch('/image-received?' + query, {method: 'POST', body: form});
  if (!response.ok) throw Error('Independent image receiver rejected ' + phase);
  const receipt = await response.json();
  if (receipt.runNonce !== config.runNonce || receipt.command !== config.command || receipt.phase !== phase)
    throw Error('Image receiver returned another invocation');
  photoEvidence.receipts.push(receipt);
}
async function canvasFor(blob) {
  const image = await createImageBitmap(blob);
  if (image.width !== 64 || image.height !== 48) throw Error('Selected image dimensions changed');
  const canvas = document.createElement('canvas');
  canvas.width = image.width; canvas.height = image.height;
  canvas.getContext('2d').drawImage(image, 0, 0);
  image.close();
  return canvas;
}
async function encoded(canvas, prefix) {
  const blob = await new Promise((resolve, reject) => canvas.toBlob(
    value => value ? resolve(value) : reject(Error('Canvas toBlob returned no image')), 'image/png'));
  await submit(prefix + 'to-blob', blob);
  // This path goes through the actual browser toDataURL implementation and
  // decodes its returned data URL. It does not reuse toBlob's bytes.
  const dataUrl = canvas.toDataURL('image/png');
  if (!dataUrl.startsWith('data:image/png;base64,')) throw Error('Canvas data URL MIME changed');
  await submit(prefix + 'to-data-url', await (await fetch(dataUrl)).blob());
}
input.onchange = async event => {
  try {
    if (config.mode !== 'select' || document.documentElement.dataset.photoReady !== 'true')
      throw Error('Unexpected file chooser completion');
    document.documentElement.dataset.photoReady = 'selected';
    const file = event.target.files[0];
    if (!file || file.name !== 'photo-123.png' || file.type !== 'image/png')
      throw Error('Selected photo name or MIME changed');
    const canvas = await canvasFor(file);
    await submit('original', file);
    await encoded(canvas, '');
    output.textContent = 'ok:' + file.name + ':' + file.type + ':64x48';
  } catch (error) { failure(error); }
};
(async () => {
  // Fetching a known image is deliberately not a user file selection. In
  // protected mode both exports must still be protected at the receiver.
  const response = await fetch('/photo-pattern.png', {cache: 'no-store'});
  if (!response.ok) throw Error('Controlled image fixture is unavailable');
  await encoded(await canvasFor(await response.blob()), 'unselected-');
  if (config.mode === 'probe') {
    input.disabled = true;
    output.textContent = 'protected:no-selection';
  } else {
    document.documentElement.dataset.photoReady = 'true';
  }
})().catch(failure);
</script>
