<!doctype html><meta charset="utf-8"><style>body{font:16px sans-serif}nav{height:280px;overflow:auto}.row{display:flex;height:42px;align-items:center}.row a{flex:1}.menu,[role=dialog]{position:fixed;top:20px;left:20px;background:white;border:1px solid black;padding:16px;z-index:10}button{padding:8px}</style>
<button aria-label="Hide sidebar">Sidebar</button><nav aria-label="Chat history" id="history"></nav><button id="more">Load more</button>
<script>
const historyList=document.getElementById("history"),moreButton=document.getElementById("more");let loaded=0;function clear(){document.querySelectorAll('.menu,[role=dialog]').forEach(e=>e.remove());}
function add(){for(let i=0;i<10&&loaded<110;i++){const n=++loaded,row=document.createElement('div');row.className='row';const link=document.createElement('a');link.href='/c/fixture-'+n;link.textContent='Conversation '+String(n).padStart(3,'0');const action=document.createElement('button');action.setAttribute('aria-label','Chat actions');action.textContent='…';action.onclick=()=>{clear();const menu=document.createElement('div');menu.className='menu';menu.setAttribute('role','menu');for(const type of ['Rename','Delete']){const b=document.createElement('button');b.setAttribute('role','menuitem');b.textContent=type;b.onclick=()=>{clear();const dialog=document.createElement('div');dialog.setAttribute('role','dialog');if(type==='Rename'){const input=document.createElement('input');input.type='text';input.value=link.textContent;input.onkeydown=e=>{if(e.key==='Enter'){link.textContent=input.value;dialog.remove();}};dialog.append(input);document.body.append(dialog);input.focus();}else{dialog.textContent='Delete chat? This cannot be undone.';const confirm=document.createElement('button');confirm.textContent='Delete';confirm.onclick=()=>{row.remove();dialog.remove();};dialog.append(confirm);document.body.append(dialog);}};menu.append(b);}document.body.append(menu);};row.append(link,action);historyList.append(row);}moreButton.hidden=loaded>=110;}
moreButton.onclick=add;add();
</script>
