<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Desktop reading fixture</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font:16px/1.6 sans-serif}#shell{display:flex;height:100dvh}aside{width:240px;flex:none;background:#f3f3f3;padding:20px}main{min-width:0;flex:1;display:flex;flex-direction:column}header{padding:12px;height:52px;flex:none}#turns{min-height:0;flex:1;overflow-y:auto;padding:24px}article{max-width:680px;margin:auto}pre{max-width:100%;overflow-x:auto;background:#eee;padding:14px}form{padding:12px 24px;flex:none}textarea{width:100%;height:72px;font:16px sans-serif}button{padding:8px}
</style></head><body><div id="shell"><aside>Conversation list</aside><main><header><button data-testid="model-switcher-dropdown-button">Original model</button></header><div id="turns"><article data-message-author-role="assistant" data-message-id="reading-reply"><h2>Long reply</h2><pre><code id="code">const longCode = "unchanged code with a horizontal line to read";</code></pre><div id="paragraphs"></div></article></div><form><textarea id="prompt-textarea">Unsent draft stays here</textarea><button type="button" data-testid="send-button" aria-label="Send">Send</button></form></main></div>
<script>for(let i=0;i<40;i++){const p=document.createElement('p');p.textContent='Long reply paragraph '+i+' — 横竖屏及键盘阅读测试，保留原网页内容。';document.querySelector('#paragraphs').append(p);}document.querySelector('#code').textContent+=' '.repeat(8)+'x'.repeat(240);window.sendCount=0;</script></body></html>
